# Optional local hooks. Install with:  pip install pre-commit && pre-commit install
# The docs drift check and ruff (format + lint) also run in CI (see
# .github/workflows/ci.yml), so these are a convenience for catching the same
# failures before you push — most usefully the `console quality / format` check,
# which trips on un-formatted Python.
repos:
  # ruff format + lint, mirroring each package's `ruff format --check .` /
  # `ruff check .` CI step. ruff resolves the nearest pyproject.toml per file, so
  # each package's own config applies. Pinned to the ruff CI installs. Scoped to
  # package Python only (CI lints within each package dir, not the repo root).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff-format
        files: '^packages/.*\.py$'
      - id: ruff-check
        args: [--fix]
        files: '^packages/.*\.py$'
  # Secret scanning. Uses .gitleaks.toml (the gitleaks default ruleset). Scans
  # staged changes on commit. Bump with `pre-commit autoupdate`.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # Your own private tripwire rules, kept out of the repo in an untracked
      # .gitleaks.local.toml (see .gitleaks.toml). Skipped when the file or a
      # local gitleaks binary is missing.
      - id: gitleaks-local
        name: gitleaks (local rules)
        entry: sh -c 'if [ -f .gitleaks.local.toml ] && command -v gitleaks >/dev/null; then gitleaks git --staged --no-banner --config .gitleaks.local.toml; fi'
        language: system
        pass_filenames: false
      - id: docs-drift-check
        name: docs drift check
        entry: python scripts/check_docs.py
        language: python
        additional_dependencies: [jsonschema]
        pass_filenames: false
        files: '^(docs/|schema/runspec\.schema\.json|spec/SPEC\.md|CHANGELOG\.md|scripts/check_docs\.py|packages/)'
