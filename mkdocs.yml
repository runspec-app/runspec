site_name: runspec
site_url: https://runspec.app
# No repo_url/repo_name: the source repo is private, so a header link to it
# would 404 for public visitors (and expose the owner's username). Re-add once
# there is a public mirror, if ever.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
  palette:
    primary: indigo

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  # Lets docs/changelog.md include the repository-root CHANGELOG.md so the two
  # never drift. base_path is the repo root (mkdocs runs from there);
  # check_paths fails the build if the included file ever goes missing.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

# Publish the canonical JSON Schema at https://runspec.app/runspec.schema.json
# (copied from schema/runspec.schema.json at build time — single source of
# truth). This is the URL the #:schema line in generated runspec.toml files
# points to, and what editor TOML validators fetch.
hooks:
  - hooks/copy_schema.py

nav:
  - The trailhead: index.md
  - "Act I · Into the Forest":
    - First steps: quickstart.md
    - Carving your first path: authoring.md
    - The field guide: format.md
  - "Act II · Learning the Craft":
    - Leaving the old country: migration.md
    - Lighting the way: logging.md
    - Sharpening the blade: typed-args.md
    - Proving your mettle: testing.md
    - The Python tongue: python.md
    - The Node tongue: node.md
    - Packing the caravan: node-deploy.md
    - Tools of the trade: cli.md
  - "Act III · Toward the Kingdom":
    - Meeting your companion: agents.md
    - Crossing the borderlands: jump-hosts.md
    - The wards: denylist.md
  - "Act IV · The Console Kingdom":
    - The Console kingdom: console.md
    - Speaking in other tongues: console-adapters.md

# Files kept in the repo but NOT built into the published (public) site.
# The published surface is usage docs only — internal design notes, the
# maintainer release process, the operator capacity note, and the
# rationale-heavy changelog stay private.
exclude_docs: |
  design/
  releasing.md
  console-ssh-capacity.md
  changelog.md
  security-assessment.md
  security-assessment-exec-brief.md

# Catch a published page that links to an excluded or missing page, so an
# internal doc can never leak into the public site via a stray link.
validation:
  omitted_files: warn
  absolute_links: ignore
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
