site_name: runspec
site_url: https://JasonFinestone.github.io/runspec
repo_url: https://github.com/JasonFinestone/runspec
repo_name: JasonFinestone/runspec

theme:
  name: material
  palette:
    primary: indigo

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  # Lets docs/changelog.md include the repository-root CHANGELOG.md so the two
  # never drift. base_path is the repo root (mkdocs runs from there);
  # check_paths fails the build if the included file ever goes missing.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Migrating from argparse: migration.md
  - Format Reference: format.md
  - Logging: logging.md
  - Python Library: python.md
  - Testing runnables: testing.md
  - Node Library: node.md
  - Deploying Node folders: node-deploy.md
  - CLI Reference: cli.md
  - Agent Integration: agents.md
  - Jump Hosts: jump-hosts.md
  - Desktop Console: console.md
  - Console SSH Capacity: console-ssh-capacity.md
  - runspec-chat (deprecated): runspec-chat.md
  - Releasing: releasing.md
  - Changelog: changelog.md
