site_name: runspec
site_url: https://runspec.app
# No repo_url/repo_name: the source repo is private, so a header link to it
# would 404 for public visitors (and expose the owner's username). Re-add once
# there is a public mirror, if ever.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
  palette:
    primary: indigo

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  # custom_fences renders ```mermaid blocks as Mermaid diagrams (Material's
  # built-in integration) — used by the security page's architecture diagrams.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  # Lets docs/changelog.md include the repository-root CHANGELOG.md so the two
  # never drift. base_path is the repo root (mkdocs runs from there);
  # check_paths fails the build if the included file ever goes missing.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

# Publish the canonical JSON Schema at https://runspec.app/runspec.schema.json
# (copied from schema/runspec.schema.json at build time — single source of
# truth). This is the URL the #:schema line in generated runspec.toml files
# points to, and what editor TOML validators fetch.
hooks:
  - hooks/copy_schema.py

nav:
  - Home: index.md
  - Console:
    - Get started: console-quickstart.md
    - Console without AI: console-ai-off.md
    - Working with the agent: console-agent.md
    - Sandboxed code execution: console-sandbox.md
    - Hosts & fleet: console-hosts.md
    - Automation — triggers, schedules, rota: console-automation.md
    - Runbooks: console-runbooks.md
    - Saved runs: console-saved-runs.md
    - Forms & credentials: console-forms.md
    - Marketplace — install runnable packages: console-marketplace.md
    - Team config — sync & rooms: console-team.md
    - Improve — evaluation & problem reports: console-improve.md
    - Evals — tool-selection regression tests: console-evals.md
    - AI-use disclaimer: console-disclaimer.md
    - Settings & config reference: console-reference.md
  - Authoring runnables:
    - Adding your own runnables: authoring-intro.md
    - Quickstart: quickstart.md
    - Authoring guide: authoring.md
    - Format reference: format.md
    - Typed arguments: typed-args.md
    - Logging: logging.md
    - Shared venvs — the logs inbox: logs-inbox.md
    - Testing: testing.md
    - Python library: python.md
    - Node library: node.md
    - Node deployment: node-deploy.md
    - CLI reference: cli.md
    - Migrating from argparse: migration.md
    - Agent integration (MCP): agents.md
    - MCP server → runnable: mcp-to-runnable.md
    - Jump hosts: jump-hosts.md
    - Claude Code across your fleet: mcp.md
    - Rundeck jobs: rundeck.md
    - Ansible modules: ansible.md
    - Denylist: denylist.md
  - Distribution:
    - White-label walkthrough: white-label.md
    - White-label runnable packages: white-label-runnables.md
    - Custom model adapters: console-adapters.md
    - Telemetry — OpenTelemetry tracing: console-telemetry.md
    - Telemetry for a custom adapter: console-adapter-telemetry.md
    - Custom adapter behind a gateway: console-adapter-gateway.md
    - Local trace analysis with Phoenix: console-phoenix.md
    - External MCP servers: console-mcp.md
    - Console as an MCP server: console-mcp-server.md
  - Security: security.md

# Files kept in the repo but NOT built into the published (public) site.
# The published surface is usage docs only — internal design notes, the
# maintainer release process, the operator capacity note, and the
# rationale-heavy changelog stay private.
exclude_docs: |
  design/
  releasing.md
  console-ssh-capacity.md
  changelog.md
  security-assessment.md
  security-assessment-exec-brief.md

# Catch a published page that links to an excluded or missing page, so an
# internal doc can never leak into the public site via a stray link.
validation:
  omitted_files: warn
  absolute_links: ignore
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
