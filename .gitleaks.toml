# gitleaks configuration for runspec.
#
# Secret scanning via the gitleaks default ruleset (API keys, tokens, etc.).
# Runs as a pre-commit hook (see .pre-commit-config.yaml) and can also run in CI.
# Scan staged changes manually with:  gitleaks git --staged --verbose
#
# Private tripwires (internal hostnames, account names, anything that must never
# be committed) don't belong in a public repo, because a rule has to name what it
# denies. Put them in an untracked `.gitleaks.local.toml` (gitignored) that
# starts with
#
#     [extend]
#     path = ".gitleaks.toml"
#
# and add your own [[rules]]. The `gitleaks-local` pre-commit hook runs it when
# the file exists.

title = "runspec gitleaks config"

[extend]
useDefault = true
