#:schema https://raw.githubusercontent.com/JasonFinestone/runspec/main/schema/runspec.schema.json

# runspec itself is a developer CLI, not an agent tool. Suppress autonomy
# inference so --help doesn't display a meaningless autonomy level on the
# top-level menu or on `serve` (which is a server, not an action).
[config]
autonomy-default = ""

[runspec]
description = "Interface specification for anything runnable"

examples = [
  {cmd = "runspec init",                   description = "Scaffold a new runnable in this directory"},
  {cmd = "runspec local",                  description = "Discover and validate runnables"},
  {cmd = "runspec test",                   description = "Smoke-test every installed runnable (CI gate)"},
  {cmd = "runspec serve",                  description = "Start the MCP stdio server"},
  {cmd = "runspec jump user@host",          description = "List tools available on a remote host"},
  {cmd = "runspec env",                    description = "Show the resolved .runspec_env file"},
  {cmd = "runspec logs deploy",            description = "View merged per-invocation logs for a runnable"},
  {cmd = "runspec deny add --runnable deploy", description = "Disable a runnable in this venv (kill switch)"},
]

[runspec.commands.init]
description = "Scaffold a new runnable — creates runspec.toml and a code stub"
autonomy    = "confirm"

examples = [
  {cmd = "runspec init",                                              description = "Scaffold using current directory name"},
  {cmd = "runspec init --name deploy",                                description = "Scaffold a runnable called 'deploy'"},
  {cmd = "runspec init --example",                                    description = "Generate worked example (clean + scan)"},
  {cmd = "runspec init --example --write-project",                    description = "Also generate pyproject.toml in parent dir"},
  {cmd = "runspec init --write-project --project-dir /tmp/myproject", description = "Write project files to a specific path"},
  {cmd = "runspec init --name myapp --lang typescript",               description = "Use TypeScript code stub"},
]

[runspec.commands.init.args]
name          = {type = "str",    description = "Runnable name (defaults to package directory name)", short = "-n", required = false}
lang          = {type = "choice", description = "Language for the generated code stub", options = ["python", "typescript", "javascript"], default = "python"}
example       = {type = "flag",   description = "Generate a worked example (clean + scan runnables)", short = "-e", default = false}
write-project = {type = "flag",   description = "Generate pyproject.toml, __init__.py, .gitignore, and CLAUDE.md", short = "-w", default = false}
project-dir   = {type = "str",    description = "Where to write project files (default: parent directory)", short = "-d", required = false}
force         = {type = "flag",   description = "Override the cwd safety check (don't refuse when pyproject.toml is present in cwd)", default = false}

[runspec.commands.local]
description = "List installed runnables or emit their tool schemas"
autonomy    = "autonomous"
output      = "json"

examples = [
  {cmd = "runspec local",                                description = "Discover runnables and validate setup"},
  {cmd = "runspec local --format mcp",                   description = "Emit MCP tool schemas"},
  {cmd = "runspec local --format mcp --runnable deploy", description = "Emit schema for one runnable"},
  {cmd = "runspec local --format json",                  description = "Full spec as JSON"},
]

[runspec.commands.local.args]
format   = {type = "choice", description = "Output format", options = ["text", "json", "mcp", "openai", "anthropic"], short = "-f", default = "text"}
runnable = {type = "str",    description = "Filter output to a single runnable by name", short = "-r", required = false}

[runspec.commands.stubs]
description = "Generate typings/runspec/__init__.pyi so parse() is precisely typed per runnable"
autonomy    = "autonomous"

examples = [
  {cmd = "runspec stubs",         description = "Generate/refresh the type stub from installed runnables"},
  {cmd = "runspec stubs --check", description = "Exit non-zero if the stub is missing or stale (CI/pre-commit)"},
  {cmd = "runspec stubs --off",   description = "Disable typing: remove the stub (arg access back to Any)"},
]

[runspec.commands.stubs.args]
check = {type = "flag", description = "Verify the stub is up to date; do not write. Exit 1 if stale.", default = false}
off   = {type = "flag", description = "Remove the stub, restoring the default Any-typed arg access.",   default = false}

[runspec.commands.test]
description = "Smoke-test installed runnables: spec smoke + entry-point --help"
autonomy    = "autonomous"
output      = "json"

examples = [
  {cmd = "runspec test",                   description = "Test all installed runnables (CI gate)"},
  {cmd = "runspec test --format json",     description = "Machine-readable results for CI"},
  {cmd = "runspec test --runnable deploy", description = "Test a single runnable"},
]

[runspec.commands.test.args]
format   = {type = "choice", description = "Output format", options = ["text", "json"], short = "-f", default = "text"}
runnable = {type = "str",    description = "Filter to a single runnable by name", short = "-r", required = false}

[runspec.commands.serve]
description = "Start an MCP stdio server exposing all installed runnables as tools"

examples = [
  {cmd = "runspec serve", description = "Serve all runspec-aware runnables installed in this venv"},
]

# No args — runnables are discovered via importlib.metadata. Install with
# `pip install -e .` to make a package visible.

[runspec.commands.env]
description = "Show the resolved .runspec_env file path and its contents"
autonomy    = "autonomous"

examples = [
  {cmd = "runspec env",             description = "Show the default .runspec_env file"},
  {cmd = "runspec env myrunnable",  description = "Show the env file for a specific runnable"},
]

[runspec.commands.env.args]
runnable = {type = "str", description = "Runnable name to show env file for", position = 1, required = false}

[runspec.commands.deny]
description = "Disable runnables in this venv (kill switch) via runspec_denylist.toml"
autonomy    = "confirm"

examples = [
  {cmd = "runspec deny list",                                   description = "Show the current denylist (mode + rules)"},
  {cmd = "runspec deny add --runnable deploy",                  description = "Disable one runnable for all users/hosts"},
  {cmd = "runspec deny add --runnable deploy --user svc-batch --host 'prod-*'", description = "Disable deploy for svc-batch on prod hosts"},
  {cmd = "runspec deny all --reason 'change freeze'",           description = "Disable every runnable in this venv"},
  {cmd = "runspec deny mode warn",                              description = "Warn instead of refusing (enforce | warn | off)"},
  {cmd = "runspec deny clear",                                  description = "Remove the denylist — re-enable everything"},
]

[runspec.commands.deny.args]
action   = {type = "str", description = "add | all | list | clear | mode", position = 1, required = false}
setting  = {type = "str", description = "Value for 'mode': enforce | warn | off", position = 2, required = false}
runnable = {type = "str", description = "Runnable name glob to deny (repeatable; default '*')", short = "-r", multiple = true, required = false}
user     = {type = "str", description = "Username glob to deny (repeatable; default '*')", short = "-u", multiple = true, required = false}
host     = {type = "str", description = "Hostname glob to deny (repeatable; default '*')", short = "-H", multiple = true, required = false}
reason   = {type = "str", description = "Reason recorded and shown on refusal", required = false}
json     = {type = "flag", description = "Emit the denylist as JSON (list/show)", default = false}

[runspec.commands.jump]
description = "List tools on a remote host or run a tool via SSH+MCP"
autonomy    = "confirm"

examples = [
  {cmd = "runspec jump user@prod.example.com",                      description = "List tools available on the remote"},
  {cmd = "runspec jump user@prod.example.com deploy -- --env prod", description = "Run 'deploy' with --env prod"},
  {cmd = "runspec jump user@prod.example.com --bin /opt/venv/bin/runspec", description = "Use a specific runspec path on the remote"},
]

[runspec.commands.jump.args]
host      = {type = "str",    description = "SSH connection string (e.g. user@host or host)",  position = 1, required = false}
tool      = {type = "str",    description = "Tool to run on the remote host",                  position = 2, required = false}
bin       = {type = "str",    description = "Path to runspec binary on the remote",            required = false}
format    = {type = "choice", description = "Output format when listing", options = ["text", "json"], short = "-f", default = "text"}
tool-args = {type = "rest",   description = "Args passed to the remote tool"}

[runspec.commands.logs]
description = "View, status, prune, or compact per-invocation audit logs (store = 'per-run')"
autonomy    = "autonomous"

examples = [
  {cmd = "runspec logs deploy",                          description = "Merged view of every invocation, as one stream"},
  {cmd = "runspec logs deploy --since 1h --user alice",  description = "Filter by recency and operator"},
  {cmd = "runspec logs deploy --follow",                 description = "Live tail across invocations"},
  {cmd = "runspec logs deploy --json",                   description = "Raw JSON lines (for jq)"},
  {cmd = "runspec logs status",                          description = "Per-runnable file count + disk usage inventory"},
  {cmd = "runspec logs status --json",                   description = "Inventory as JSON (consumed by the console Logs tab)"},
  {cmd = "runspec logs compact --older-than 7d --gzip",  description = "Roll runs older than 7 days into a gzip archive"},
  {cmd = "runspec logs prune --older-than 90d",          description = "Delete files older than 90 days"},
  {cmd = "runspec logs prune deploy --max-files 50 --dry-run", description = "Preview keeping only the newest 50 files"},
]

[runspec.commands.logs.args]
target         = {type = "str",  description = "Runnable to view, or a verb: 'status' / 'prune' / 'compact'", position = 1, required = false}
runnable       = {type = "str",  description = "Runnable to status/prune/compact (default: all in the venv)", position = 2, required = false}
follow         = {type = "flag", description = "Live tail across invocations (view)", short = "-f", default = false}
since          = {type = "str",  description = "Only show records newer than this (view), e.g. 1h, 30m, 7d", required = false}
user           = {type = "str",  description = "Only show runs launched by this user (view)", short = "-u", required = false}
run            = {type = "str",  description = "Only show one invocation by run_id (view)", required = false}
json           = {type = "flag", description = "Emit JSON instead of formatted text (view / status / prune / compact)", default = false}
older-than     = {type = "str",  description = "Age threshold for prune/compact, e.g. 7d, 90d, 24h", required = false}
max-files      = {type = "int",  description = "Keep only the newest N files per runnable (prune)", required = false}
max-total-size = {type = "str",  description = "Cap total managed size; delete oldest over budget (prune), e.g. 5GB", required = false}
gzip           = {type = "flag", description = "Gzip the archive (compact)", default = false}
dry-run        = {type = "flag", description = "Show what would change without deleting/archiving (prune/compact)", default = false}
