#:schema https://runspec.app/runspec.schema.json

# runspec itself is a developer CLI, not an agent tool. Suppress autonomy
# inference so --help doesn't display a meaningless autonomy level on the
# top-level menu or on `serve` (which is a server, not an action).
[config]
autonomy-default = ""
# The control-plane CLI runs as whoever invokes it — every account must be able
# to read history, inspect logs and so on in a shared environment — rather than
# the library default "@owner". (Owner-only verbs such as `logs share` and
# `history sweep` check for themselves and drop to the owner when run as root.)
run_as = ""

[runspec]
description = "Interface specification for anything runnable"

examples = [
  {cmd = "runspec init",                   description = "Scaffold a new runnable in this directory"},
  {cmd = "runspec local",                  description = "Discover and validate runnables"},
  {cmd = "runspec test",                   description = "Smoke-test every installed runnable (CI gate)"},
  {cmd = "runspec emit --rundeck",         description = "Emit Rundeck job definitions (JSON) per runnable"},
  {cmd = "runspec serve",                  description = "Start the MCP stdio server"},
  {cmd = "runspec jump user@host",          description = "List tools available on a remote host"},
  {cmd = "runspec env",                    description = "Show the resolved .runspec_env file"},
  {cmd = "runspec logs deploy",            description = "View merged per-invocation logs for a runnable"},
  {cmd = "runspec history",                description = "Recent runs from the venv's runs index (+ what's running)"},
  {cmd = "runspec deny add --runnable deploy", description = "Disable a runnable in this venv (kill switch)"},
]

[runspec.commands.init]
description = "Scaffold a new runnable — creates runspec.toml and a code stub"
autonomy    = "confirm"

examples = [
  {cmd = "runspec init",                                              description = "Scaffold using current directory name"},
  {cmd = "runspec init --name deploy",                                description = "Scaffold a runnable called 'deploy'"},
  {cmd = "runspec init --example",                                    description = "Generate worked example (clean + scan)"},
  {cmd = "runspec init --example --write-project",                    description = "Also generate pyproject.toml in parent dir"},
  {cmd = "runspec init --write-project --project-dir /tmp/myproject", description = "Write project files to a specific path"},
  {cmd = "runspec init --name myapp --lang typescript",               description = "Use TypeScript code stub"},
]

[runspec.commands.init.args]
name          = {type = "str",    description = "Runnable name (defaults to package directory name)", short = "-n", required = false}
lang          = {type = "choice", description = "Language for the generated code stub", options = ["python", "typescript", "javascript"], default = "python"}
example       = {type = "flag",   description = "Generate a worked example (clean + scan runnables)", short = "-e", default = false}
write-project = {type = "flag",   description = "Generate pyproject.toml, __init__.py, .gitignore, and CLAUDE.md", short = "-w", default = false}
project-dir   = {type = "str",    description = "Where to write project files (default: parent directory)", short = "-d", required = false}
force         = {type = "flag",   description = "Override the cwd safety check (don't refuse when pyproject.toml is present in cwd)", default = false}

[runspec.commands.local]
description = "List installed runnables or emit their tool schemas"
autonomy    = "autonomous"
output      = "json"

examples = [
  {cmd = "runspec local",                                description = "Discover runnables and validate setup"},
  {cmd = "runspec local --format mcp",                   description = "Emit MCP tool schemas"},
  {cmd = "runspec local --format mcp --runnable deploy", description = "Emit schema for one runnable"},
  {cmd = "runspec local --format json",                  description = "Full spec as JSON"},
]

[runspec.commands.local.args]
format   = {type = "choice", description = "Output format", options = ["text", "json", "mcp", "openai", "anthropic"], short = "-f", default = "text"}
runnable = {type = "str",    description = "Filter output to a single runnable by name", short = "-r", required = false}

[runspec.commands.stubs]
description = "Generate typings/runspec/__init__.pyi so parse() is precisely typed per runnable"
autonomy    = "autonomous"

examples = [
  {cmd = "runspec stubs",         description = "Generate/refresh the type stub from installed runnables"},
  {cmd = "runspec stubs --check", description = "Exit non-zero if the stub is missing or stale (CI/pre-commit)"},
  {cmd = "runspec stubs --off",   description = "Disable typing: remove the stub (arg access back to Any)"},
]

[runspec.commands.stubs.args]
check = {type = "flag", description = "Verify the stub is up to date; do not write. Exit 1 if stale.", default = false}
off   = {type = "flag", description = "Remove the stub, restoring the default Any-typed arg access.",   default = false}

[runspec.commands.emit]
description = "Emit orchestration artefacts from installed runnables (Rundeck job JSON / Ansible modules)"
autonomy    = "autonomous"

examples = [
  {cmd = "runspec emit --rundeck",                            description = "Write a Rundeck job JSON per runnable to jobs/"},
  {cmd = "runspec emit --rundeck --venv /opt/app/.venv",      description = "Invoke via that venv's bin/ in the job scripts"},
  {cmd = "runspec emit --rundeck --node-filter 'tags: web'",  description = "Dispatch to a node set (random subset=1 load-balance)"},
  {cmd = "runspec emit --rundeck --venv /opt/app/.venv --run-as svc", description = "Run each job's command as the svc service account"},
  {cmd = "runspec emit --ansible --venv /opt/app/.venv",      description = "Write an Ansible module per runnable to library/"},
  {cmd = "runspec emit --ansible --runnable deploy",          description = "Emit only the 'deploy' runnable"},
  {cmd = "runspec emit --rundeck --check",                    description = "Verify emitted jobs are up to date (CI); no write"},
  {cmd = "runspec emit --rundeck --stdout | rd jobs load -F json -p prod", description = "Pipe the combined job array straight to rd"},
]

[runspec.commands.emit.args]
rundeck     = {type = "flag", description = "Emit Rundeck job definitions (JSON) to jobs/", default = false}
ansible     = {type = "flag", description = "Emit Ansible modules (Python) to library/", default = false}
venv        = {type = "str",  description = "Venv whose bin/ holds the runnable binaries (invocation path)", required = false}
output-dir  = {type = "str",  description = "Directory to write into (default: {git_root}/jobs or /library)", short = "-d", required = false}
runnable    = {type = "str",  description = "Emit only this runnable", short = "-r", required = false}
group       = {type = "str",  description = "Rundeck job group (default: runspec)", required = false}
node-filter = {type = "str",  description = "Rundeck node filter; enables orchestrator random-subset=1 load-balancing", required = false}
project     = {type = "str",  description = "Rundeck project name (used for stable job UUIDs)", required = false}
run-as      = {type = "str",  description = "Rundeck: run the job script's command as this account, @owner (the venv's owner, the default) or \"\" (no sudo); values ride stdin", required = false}
check       = {type = "flag", description = "Verify emitted files are up to date; write nothing. Exit 1 if stale (CI).", default = false}
stdout      = {type = "flag", description = "Rundeck: print the combined JSON array to stdout instead of writing files", default = false}

[runspec.commands.rebrand]
description = "Republish a runnable package wheel under your own distribution name (private index / Nexus)"
autonomy    = "confirm"

examples = [
  {cmd = "runspec rebrand runspec-linux==0.14.0 --name mycorp-linux",  description = "Download from pip's configured index and write dist/mycorp_linux-0.14.0-*.whl"},
  {cmd = "runspec rebrand runspec_windows-0.9.0-py3-none-any.whl --name mycorp-windows", description = "Rebrand a wheel already on disk"},
  {cmd = "runspec rebrand runspec-linux --name mycorp-linux --rename-dep runspec-linux-core=mycorp-linux-core", description = "Latest release, re-pointing a core dependency at your rebranded core"},
]

[runspec.commands.rebrand.args]
source      = {type = "str",  description = "A .whl path, or a requirement to download (e.g. runspec-linux==0.14.0)", position = 1}
name        = {type = "str",  description = "New distribution name (e.g. mycorp-linux)", short = "-n"}
rename-dep  = {type = "str",  description = "OLD=NEW: re-point a dependency at another rebranded package (repeatable)", multiple = true, required = false}
set-version = {type = "str",  description = "Override the version (default: keep upstream's — recommended)", required = false}
out         = {type = "str",  description = "Output directory", short = "-o", default = "dist"}

[runspec.commands.test]
description = "Smoke-test installed runnables: spec smoke + entry-point --help"
autonomy    = "autonomous"
output      = "json"

examples = [
  {cmd = "runspec test",                   description = "Test all installed runnables (CI gate)"},
  {cmd = "runspec test --format json",     description = "Machine-readable results for CI"},
  {cmd = "runspec test --runnable deploy", description = "Test a single runnable"},
]

[runspec.commands.test.args]
format   = {type = "choice", description = "Output format", options = ["text", "json"], short = "-f", default = "text"}
runnable = {type = "str",    description = "Filter to a single runnable by name", short = "-r", required = false}

[runspec.commands.serve]
description = "Start an MCP stdio server exposing all installed runnables as tools"

examples = [
  {cmd = "runspec serve", description = "Serve all runspec-aware runnables installed in this venv"},
]

# No args — runnables are discovered via importlib.metadata. Install with
# `pip install -e .` to make a package visible.

[runspec.commands.env]
description = "Show the resolved .runspec_env file path and its contents"
autonomy    = "autonomous"

examples = [
  {cmd = "runspec env",             description = "Show the default .runspec_env file"},
  {cmd = "runspec env myrunnable",  description = "Show the env file for a specific runnable"},
]

[runspec.commands.env.args]
runnable = {type = "str", description = "Runnable name to show env file for", position = 1, required = false}

[runspec.commands.deny]
description = "Disable runnables in this venv (kill switch) via runspec_denylist.toml"
autonomy    = "confirm"

examples = [
  {cmd = "runspec deny list",                                   description = "Show the current denylist (mode + rules)"},
  {cmd = "runspec deny add --runnable deploy",                  description = "Disable one runnable for all users/hosts"},
  {cmd = "runspec deny add --runnable deploy --user svc-batch --host 'prod-*'", description = "Disable deploy for svc-batch on prod hosts"},
  {cmd = "runspec deny all --reason 'change freeze'",           description = "Disable every runnable in this venv"},
  {cmd = "runspec deny mode warn",                              description = "Warn instead of refusing (enforce | warn | off)"},
  {cmd = "runspec deny remove 2",                               description = "Remove rule 2 (as numbered by `deny list`)"},
  {cmd = "runspec deny remove -r deploy",                       description = "Remove the rule(s) added with the same -r/-u/-H lists"},
  {cmd = "runspec deny enable",                                 description = "Undo `deny all` — keep the rules"},
  {cmd = "runspec deny clear",                                  description = "Remove the denylist — re-enable everything"},
]

[runspec.commands.deny.args]
action   = {type = "str", description = "add | all | list | remove | enable | clear | mode", position = 1, required = false}
setting  = {type = "str", description = "Value for 'mode' (enforce | warn | off), or the rule number for 'remove'", position = 2, required = false}
runnable = {type = "str", description = "Runnable name glob to deny / remove (repeatable; default '*')", short = "-r", multiple = true, required = false}
user     = {type = "str", description = "Username glob to deny (repeatable; default '*')", short = "-u", multiple = true, required = false}
host     = {type = "str", description = "Hostname glob to deny (repeatable; default '*')", short = "-H", multiple = true, required = false}
reason   = {type = "str", description = "Reason recorded and shown on refusal", required = false}
json     = {type = "flag", description = "Emit the denylist as JSON (list/show)", default = false}

[runspec.commands.audit]
description = "Record, list or verify append-only audit events (the venv's hash-chained ledger + OS log)"
autonomy    = "confirm"

examples = [
  {cmd = "runspec audit record payment.refund --outcome succeeded --target order=A-1043", description = "Record an event from a shell script"},
  {cmd = "runspec audit record deploy.start --strict",                description = "Fail (exit 1) if the event couldn't be recorded anywhere"},
  {cmd = "runspec audit list",                                        description = "Show the newest events in this venv's ledger"},
  {cmd = "runspec audit list --json --limit 500",                     description = "Raw JSON records (for jq)"},
  {cmd = "runspec audit verify",                                      description = "Check the ledger's hash chain (exit 1 if broken)"},
]

[runspec.commands.audit.args]
action  = {type = "choice", description = "record | list | verify", options = ["record", "list", "verify"], position = 1, default = "list"}
event   = {type = "str",  description = "Event name for 'record' (lowercase, dotted — e.g. payment.refund)", position = 2, required = false}
outcome = {type = "str",  description = "Outcome for 'record' (e.g. started, succeeded, failed)", short = "-o", required = false}
target  = {type = "str",  description = "What was acted on, as key=value (repeatable)", short = "-t", multiple = true, required = false}
detail  = {type = "str",  description = "Extra context, as key=value (repeatable)", short = "-d", multiple = true, required = false}
strict  = {type = "flag", description = "Exit 1 if no sink (ledger, OS log) took the event", default = false}
file    = {type = "path", description = "Ledger file to list/verify, or directory to record into (default: this venv's logs/audit.jsonl)", short = "-f", required = false}
limit   = {type = "int",  description = "Newest events to show for 'list'", short = "-n", default = 50}
json    = {type = "flag", description = "Emit JSON (list: one record per line; verify: the result object)", default = false}

[runspec.commands.mock]
description = "Record, list, play back or check mock responses — RUNSPEC_MOCK=1 makes a runnable answer from them without running its code"
autonomy    = "confirm"

examples = [
  {cmd = "runspec mock record jira -- get-issue --key OPS-1",          description = "Run 'jira get-issue' for real and save its response"},
  {cmd = "runspec mock record jira --redact 'acme\\.com' -- search --jql 'project = OPS'", description = "Save a response with a pattern scrubbed out"},
  {cmd = "runspec mock list",                                          description = "Every recorded response in this venv, where it lives, how big"},
  {cmd = "runspec mock play jira -- get-issue --key OPS-1",            description = "Play back a response (the same as RUNSPEC_MOCK=1 jira get-issue --key OPS-1)"},
  {cmd = "runspec mock check",                                         description = "Check every recorded response still fits its runnable's spec (exit 1 if not)"},
]

[runspec.commands.mock.args]
action        = {type = "choice", description = "record | list | play | check", options = ["record", "list", "play", "check"], position = 1, default = "list"}
runnable      = {type = "str",  description = "Runnable name (required for record and play; list/check default to every installed runnable)", position = 2, required = false}
to            = {type = "str",  description = "Where 'record' saves: package (the spec's mocks/ folder), venv (this venv's runspec_mocks/), or a directory. Default: package for a source checkout, else venv", required = false}
redact        = {type = "str",  description = "Regular expression to replace with «redacted» in a recorded response (repeatable)", multiple = true, required = false}
note          = {type = "str",  description = "Note saved with a recorded response", required = false}
timeout       = {type = "int",  description = "Seconds 'record' waits for the runnable before giving up", default = 300}
strict        = {type = "flag", description = "'play': exact argument match only (RUNSPEC_MOCK=strict)", default = false}
json          = {type = "flag", description = "Emit JSON (list, check)", default = false}
runnable-args = {type = "rest", description = "The runnable's subcommand and args (after --)"}

[runspec.commands.jump]
description = "List tools on a remote host or run a tool via SSH+MCP"
autonomy    = "confirm"

examples = [
  {cmd = "runspec jump user@prod.example.com",                      description = "List tools available on the remote"},
  {cmd = "runspec jump user@prod.example.com deploy -- --env prod", description = "Run 'deploy' with --env prod"},
  {cmd = "runspec jump user@prod.example.com --bin /opt/venv/bin/runspec", description = "Use a specific runspec path on the remote"},
]

[runspec.commands.jump.args]
host      = {type = "str",    description = "SSH connection string (e.g. user@host or host)",  position = 1, required = false}
tool      = {type = "str",    description = "Tool to run on the remote host",                  position = 2, required = false}
bin       = {type = "str",    description = "Path to runspec binary on the remote",            required = false}
format    = {type = "choice", description = "Output format when listing", options = ["text", "json"], short = "-f", default = "text"}
tool-args = {type = "rest",   description = "Args passed to the remote tool"}

[runspec.commands.exec]
description = "Run an installed runnable and record it end-to-end — observed exit code, captured output, skips — in the runs index + audit log"
autonomy    = "confirm"

examples = [
  {cmd = "runspec exec backup -- --target prod",                              description = "Run 'backup', recording its exit code and output"},
  {cmd = "runspec exec --label nightly --lock ~/.cache/nightly.lock backup",  description = "Skip (recorded) if the previous run still holds the lock"},
  {cmd = "runspec exec --skip-if-running --timeout 600 report",               description = "Skip if already running per the runs index; kill after 10 min"},
  {cmd = "runspec exec cron -- list",                                         description = "Everything after -- is passed through, incl. subcommands"},
]

[runspec.commands.exec.args]
runnable        = {type = "str",  description = "Name of a runnable installed in this venv", position = 1, required = true}
label           = {type = "str",  description = "Tag recorded on the run (e.g. sched:nightly) — filter with `runspec history list --label`", required = false}
trigger         = {type = "str",  description = "Provenance recorded on the run and passed as RUNSPEC_TRIGGER (default: inherit)", required = false}
lock            = {type = "str",  description = "Lock file (POSIX): if another run holds it, record a 'skipped' run and exit 0", required = false}
skip-if-running = {type = "flag", description = "Record a 'skipped' run and exit 0 when the runs index shows one with the same label (else runnable) running", default = false}
capture-bytes   = {type = "int",  description = "Bytes of each of stdout/stderr to keep (the tail) in the run's log; 0 = no capture", default = 65536}
timeout         = {type = "int",  description = "Kill the run after this many seconds (exit 124, recorded failed)", required = false}
runnable-args   = {type = "rest", description = "Args passed to the runnable (after --)"}

[runspec.commands.logs]
description = "View, status, prune, compact, or share per-invocation audit logs (store = 'per-run'); share --inbox sets up the shared-venv logs inbox"
autonomy    = "autonomous"

examples = [
  {cmd = "runspec logs deploy",                          description = "Merged view of every invocation, as one stream"},
  {cmd = "runspec logs deploy --since 1h --user alice",  description = "Filter by recency and operator"},
  {cmd = "runspec logs deploy --run 3f2a9c1e",           description = "One invocation, by the run id prefix shown after run="},
  {cmd = "runspec logs deploy --follow",                 description = "Live tail across invocations"},
  {cmd = "runspec logs deploy --json",                   description = "Raw JSON lines (for jq)"},
  {cmd = "runspec logs status",                          description = "Per-runnable file count + disk usage inventory"},
  {cmd = "runspec logs status --json",                   description = "Inventory as JSON (consumed by the console Logs tab)"},
  {cmd = "runspec logs compact --older-than 7d --gzip",  description = "Roll runs older than 7 days into a gzip archive"},
  {cmd = "runspec logs prune --older-than 90d",          description = "Delete files older than 90 days (this venv's logs only)"},
  {cmd = "runspec logs prune deploy --max-files 50 --dry-run", description = "Preview keeping only the newest 50 files"},
  {cmd = "runspec logs prune --older-than 90d --scope home",   description = "Prune the shared ~/logs fallback instead of this venv's dir"},
  {cmd = "runspec logs share --inbox",                   description = "Set up the logs inbox so every account's runs reach this venv's history (run as the venv owner)"},
  {cmd = "runspec logs share --group consoles",          description = "Make this venv's logs dir group-writable (POSIX; setgid + chgrp)"},
  {cmd = "runspec logs share --acl-user alice",          description = "Also grant alice write via a POSIX ACL (no group change / root)"},
]

[runspec.commands.logs.args]
target         = {type = "str",  description = "Runnable to view, or a verb: 'status' / 'prune' / 'compact' / 'share'", position = 1, required = false}
runnable       = {type = "str",  description = "Runnable to status/prune/compact (default: all in the venv)", position = 2, required = false}
follow         = {type = "flag", description = "Live tail across invocations (view)", short = "-f", default = false}
since          = {type = "str",  description = "Only show records newer than this (view), e.g. 1h, 30m, 7d", required = false}
user           = {type = "str",  description = "Only show runs launched by this user (view)", short = "-u", required = false}
run            = {type = "str",  description = "Only show one invocation (view): its run id, or a unique prefix of it such as the 8 characters after run= in the output", required = false}
json           = {type = "flag", description = "Emit JSON instead of formatted text (view / status / prune / compact / share)", default = false}
older-than     = {type = "str",  description = "Age threshold for prune/compact, e.g. 7d, 90d, 24h", required = false}
max-files      = {type = "int",  description = "Keep only the newest N files per runnable (prune)", required = false}
max-total-size = {type = "str",  description = "Cap total managed size; delete oldest over budget (prune), e.g. 5GB", required = false}
gzip           = {type = "flag", description = "Gzip the archive (compact)", default = false}
dry-run        = {type = "flag", description = "Show what would change without deleting/archiving (prune/compact)", default = false}
scope          = {options = ["venv", "home", "all"], description = "Which logs dir(s) to act on: 'venv' ({sys.prefix}/logs, this venv's own), 'home' (~/logs, the shared home fallback), or 'all' (both). Default: prune/compact/share act on 'venv' only — never the shared ~/logs; status/view show 'all'.", required = false}
group          = {type = "str",  description = "Unix group to chgrp the logs dir + runs index to (share; POSIX only). Default: leave the group unchanged, just make it group-writable + setgid.", required = false}
acl-user       = {type = "str",  description = "Also grant this OS user rwX on the dir via a POSIX ACL (repeatable; share). Lets an account that isn't in the dir's group still write there — no group change or root needed. Best-effort: needs setfacl + an ACL-capable filesystem.", multiple = true, required = false}
inbox          = {type = "flag", description = "Set up the logs inbox (share; POSIX): a sticky 01777 logs/inbox other accounts drop their per-run files into, swept into the runs index by the venv owner — no group, ACL or sudo rule. Run as the venv owner (root drops to the owner). Leaves logs/'s own mode alone unless --group/--acl-user are also given.", default = false}
no-inbox       = {type = "flag", description = "Opt this venv out of the logs inbox (share): writes a logs/.no-inbox marker; other accounts fall back to their own ~/logs.", default = false}
owner-only     = {type = "flag", description = "Make logs/ owner-only, 0755 (share) — with --inbox, nobody but the owner needs to write it.", default = false}

[runspec.commands.history]
description = "Query or maintain the per-venv runs index (runspec_runs.db)"
autonomy    = "autonomous"

examples = [
  {cmd = "runspec history",                                    description = "Recent runs, newest first"},
  {cmd = "runspec history running",                            description = "What's running right now (live, pid-checked)"},
  {cmd = "runspec history list --runnable deploy --limit 20",  description = "Recent runs of one runnable"},
  {cmd = "runspec history list --failed --json",               description = "Failed/crashed runs as JSON lines (for jq)"},
  {cmd = "runspec history prune --older-than 30d",             description = "Drop index rows older than 30 days (this venv)"},
  {cmd = "runspec history reindex",                            description = "Rebuild the index from the audit logs"},
  {cmd = "runspec history reap",                               description = "Mark crashed any 'running' row whose process is gone"},
  {cmd = "runspec history list --label sched:nightly",         description = "Runs recorded by `runspec exec --label sched:nightly`"},
  {cmd = "runspec history stats --json",                       description = "Index health: rows by status, size, age span, stale rows, the logs inbox"},
  {cmd = "runspec history sweep",                              description = "Index finished runs from the logs inbox and move them into logs/ (venv owner)"},
]

[runspec.commands.history.args]
verb       = {type = "str", description = "list (default) / running / stats / prune / reindex / reap / sweep", position = 1, required = false}
runnable   = {type = "str", description = "Filter to one runnable (list)", required = false}
status     = {options = ["running", "completed", "failed", "crashed", "skipped"], description = "Filter by status (list)", required = false}
label      = {type = "str", description = "Filter to runs with this `runspec exec --label` (list)", required = false}
since      = {type = "str", description = "Only runs newer than this, e.g. 1h, 7d (list)", required = false}
limit      = {type = "int", description = "Max rows to show (list / running)", default = 50}
failed     = {type = "flag", description = "Only failed/crashed runs (list)", default = false}
older-than = {type = "str", description = "Age threshold for prune (day-granular), e.g. 30d, 90d", required = false}
max-rows   = {type = "int", description = "Keep only the newest N rows (prune)", required = false}
json       = {type = "flag", description = "Emit JSON instead of text (list / running: one row per line; stats / prune / reindex / reap / sweep: one result object)", default = false}
scope      = {options = ["venv", "home", "all"], description = "Which logs dir(s): 'venv' ({sys.prefix}/logs), 'home' (~/logs), or 'all'. Reads (list/running/stats) default to all; prune/reindex/reap default to 'venv'.", required = false}
