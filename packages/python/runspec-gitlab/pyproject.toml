[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runspec-gitlab"
version = "0.2.1"
requires-python = ">=3.10"
description = "GitLab read runnable for runspec — issues, merge requests, pipelines, and repository reads, ported from the GitLab MCP server"
readme = "README.md"
keywords = ["runspec", "runnable", "gitlab", "mcp"]
dependencies = [
    # 0.44.0 surfaces inherited args (the global --env) on each leaf subcommand's
    # MCP tool via `runspec serve`.
    "runspec>=0.44.0",
    "runspec-gitlab-core>=0.2.0",
]

[project.urls]
Documentation = "https://runspec.app/"
Source        = "https://github.com/jasonfinestone/runspec/tree/main/packages/python/runspec-gitlab"
Changelog     = "https://github.com/jasonfinestone/runspec/blob/main/packages/python/runspec-gitlab/CHANGELOG.md"
Issues        = "https://github.com/jasonfinestone/runspec/issues"

[project.scripts]
# Entry point name MUST match the runnable name in runspec.toml (`gitlab`).
gitlab = "runspec_gitlab.cli:main"

[project.optional-dependencies]
dev = [
    "ruff==0.15.20",
    "mypy",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
