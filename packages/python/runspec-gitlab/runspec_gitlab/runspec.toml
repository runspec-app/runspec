#:schema https://runspec.app/runspec.schema.json

# runspec-gitlab — GitLab reads and writes as a runspec runnable, ported from the
# GitLab MCP server: https://docs.gitlab.com/user/model_context_protocol/mcp_server/
#
# One runnable, `gitlab`, with a verb per tool. Reads are `autonomous`; every
# write (create/update/comment/merge/commit/pipeline control) is `confirm`; the
# deletes are `manual` — an agent can never run them, only a person can. `runspec serve` re-expands
# each verb into its own leaf MCP tool (gitlab_get-issue, gitlab_list-pipelines,
# …), so a runspec-console agent calls them individually — over SSH on any fleet
# host.
#
# The tools are PORTED onto the GitLab REST API (v4), not proxied from GitLab's
# hosted MCP server, so no extra process is involved. Auth is env-var driven:
#   GITLAB_URL  (default https://gitlab.com) + GITLAB_TOKEN or GITLAB_PAT  (a
#   personal access token). Both are declared as env aliases on --gitlab-url /
#   --gitlab-token, so a runspec-console credential labelled GitLab applies. Per-environment overrides use a GITLAB_<ENV>_ prefix (e.g.
#   GITLAB_UAT_TOKEN), selected with the global --env (dev/uat/prod) arg.
#
# `project` accepts a numeric id or a URL-path (`group/subgroup/project`); it
# falls back to GITLAB_PROJECT when omitted.

[config]
autonomy-default = "confirm"

[config.logging]
store = "per-run"

[gitlab]
description = "Read and update GitLab issues, merge requests, pipelines, and repository files (over the REST API)"
output = "json"
require-command = true
examples = [
  {cmd = "gitlab whoami", description = "Verify the token and show the authenticated user"},
  {cmd = "gitlab list-issues --project group/app --state opened", description = "List a project's open issues"},
  {cmd = "gitlab get-merge-request-diffs --project 42 --mr-iid 17", description = "Show a merge request's diffs"},
  {cmd = "gitlab get-job-log --project group/app --job-id 9001 --tail 100", description = "Tail the last 100 lines of a CI job log"},
  {cmd = "gitlab get-file --project group/app --file-path src/main.py --ref main", description = "Read a repository file at a ref"},
  {cmd = "gitlab create-issue --project group/app --title 'Login fails' --label bug", description = "Open an issue"},
  {cmd = "gitlab create-merge-request --project group/app --source-branch fix --target-branch main --title 'Fix login'", description = "Open a merge request"},
  {cmd = "gitlab retry-pipeline --project group/app --pipeline-id 9000", description = "Retry a pipeline's failed jobs"},
]

# ── global args (inherited by every verb) ──────────────────────────────────
[gitlab.args]
env = {type = "choice", options = ["dev", "uat", "prod"], short = "-e", required = false, env = "GITLAB_ENV", description = "Target environment (selects GITLAB_<ENV>_* vars)"}
gitlab-url = {type = "str", required = false, env = "GITLAB_URL", description = "GitLab base URL; overrides GITLAB_URL (default https://gitlab.com). Set it once per venv in .runspec_env (GITLAB_URL, or GITLAB_<ENV>_URL with --env)"}
gitlab-token = {type = "password", required = false, env = ["GITLAB_TOKEN", "GITLAB_PAT"], description = "Personal access token; overrides GITLAB_TOKEN. Supplied via the runspec-console credential/secret channel (RUNSPEC_GITLAB_ARG_GITLAB_TOKEN), never on the command line."}

# ── identity / projects ────────────────────────────────────────────────────

[gitlab.commands.whoami]
description = "Return the authenticated user for the configured token (a quick identity/token check)"
autonomy = "autonomous"

[gitlab.commands.get-project]
description = "Fetch a single project's metadata by numeric id or namespace/project path"
autonomy = "autonomous"
[gitlab.commands.get-project.args]
project = {type = "str", short = "-p", required = false, description = "Project id or path (falls back to GITLAB_PROJECT)"}

[gitlab.commands.search-projects]
description = "Search projects by name or group/namespace path, or list your own projects (omit --search)"
autonomy = "autonomous"
[gitlab.commands.search-projects.args]
search = {type = "str", required = false, description = "Text to match against project name, path or group/namespace path. Omit to list the projects you are a member of. Under 3 characters matches exact names only"}
membership = {type = "flag", default = false, description = "Only projects the token's user is a member of (always on when --search is omitted)"}
owned = {type = "flag", default = false, description = "Only projects the token's user owns"}
per-page = {type = "int", default = 20, description = "Results per page (GitLab caps at 100)"}
page = {type = "int", default = 1, description = "Page number"}

# ── issues ─────────────────────────────────────────────────────────────────

[gitlab.commands.list-issues]
description = "List a project's issues, optionally filtered by state/labels/search"
autonomy = "autonomous"
[gitlab.commands.list-issues.args]
project = {type = "str", short = "-p", required = false, description = "Project id or path (falls back to GITLAB_PROJECT)"}
state = {type = "choice", options = ["opened", "closed", "all"], required = false, description = "Issue state filter"}
labels = {type = "str", required = false, description = "Comma-separated label list to filter by"}
search = {type = "str", required = false, description = "Match title/description text"}
per-page = {type = "int", default = 20, description = "Results per page (GitLab caps at 100)"}
page = {type = "int", default = 1, description = "Page number"}

[gitlab.commands.get-issue]
description = "Fetch a single issue by its project-scoped internal id (iid)"
autonomy = "autonomous"
[gitlab.commands.get-issue.args]
project = {type = "str", short = "-p", required = false, description = "Project id or path (falls back to GITLAB_PROJECT)"}
issue-iid = {type = "int", required = true, description = "Issue internal id (the #N shown in the UI)"}

# ── merge requests ─────────────────────────────────────────────────────────

[gitlab.commands.list-merge-requests]
description = "List a project's merge requests, optionally filtered by state"
autonomy = "autonomous"
[gitlab.commands.list-merge-requests.args]
project = {type = "str", short = "-p", required = false, description = "Project id or path (falls back to GITLAB_PROJECT)"}
state = {type = "choice", options = ["opened", "closed", "merged", "locked", "all"], required = false, description = "Merge request state filter"}
per-page = {type = "int", default = 20, description = "Results per page (GitLab caps at 100)"}
page = {type = "int", default = 1, description = "Page number"}

[gitlab.commands.get-merge-request]
description = "Fetch a single merge request by its project-scoped internal id (iid)"
autonomy = "autonomous"
[gitlab.commands.get-merge-request.args]
project = {type = "str", short = "-p", required = false, description = "Project id or path (falls back to GITLAB_PROJECT)"}
mr-iid = {type = "int", required = true, description = "Merge request internal id (the !N shown in the UI)"}

[gitlab.commands.get-merge-request-diffs]
description = "List a merge request's file diffs (the canonical get_merge_request_diffs tool)"
autonomy = "autonomous"
[gitlab.commands.get-merge-request-diffs.args]
project = {type = "str", short = "-p", required = false, description = "Project id or path (falls back to GITLAB_PROJECT)"}
mr-iid = {type = "int", required = true, description = "Merge request internal id (the !N shown in the UI)"}
per-page = {type = "int", default = 20, description = "Results per page (GitLab caps at 100)"}
page = {type = "int", default = 1, description = "Page number"}

[gitlab.commands.get-merge-request-commits]
description = "List the commits on a merge request (canonical get_merge_request_commits)"
autonomy = "autonomous"
[gitlab.commands.get-merge-request-commits.args]
project = {type = "str", short = "-p", required = false, description = "Project id or path (falls back to GITLAB_PROJECT)"}
mr-iid = {type = "int", required = true, description = "Merge request internal id (the !N shown in the UI)"}
per-page = {type = "int", default = 20, description = "Results per page (GitLab caps at 100)"}
page = {type = "int", default = 1, description = "Page number"}

[gitlab.commands.get-merge-request-notes]
description = "List a merge request's notes/comments (canonical get_merge_request_notes)"
autonomy = "autonomous"
[gitlab.commands.get-merge-request-notes.args]
project = {type = "str", short = "-p", required = false, description = "Project id or path (falls back to GITLAB_PROJECT)"}
mr-iid = {type = "int", required = true, description = "Merge request internal id (the !N shown in the UI)"}
sort = {type = "choice", options = ["asc", "desc"], required = false, description = "Sort order by created date"}
per-page = {type = "int", default = 20, description = "Results per page (GitLab caps at 100)"}
page = {type = "int", default = 1, description = "Page number"}

[gitlab.commands.get-merge-request-pipelines]
description = "List the pipelines run for a merge request (canonical get_merge_request_pipelines)"
autonomy = "autonomous"
[gitlab.commands.get-merge-request-pipelines.args]
project = {type = "str", short = "-p", required = false, description = "Project id or path (falls back to GITLAB_PROJECT)"}
mr-iid = {type = "int", required = true, description = "Merge request internal id (the !N shown in the UI)"}
per-page = {type = "int", default = 20, description = "Results per page (GitLab caps at 100)"}
page = {type = "int", default = 1, description = "Page number"}

[gitlab.commands.get-merge-request-conflicts]
# Best-effort: GitLab has no public /api/v4 conflicts endpoint — this relays
# the non-public web-UI endpoint (/{project}/-/merge_requests/:iid/conflicts),
# so the response shape is GitLab's and may change between versions.
description = "Fetch a merge request's conflict files (best-effort; relays GitLab's non-public web conflicts endpoint)"
autonomy = "autonomous"
[gitlab.commands.get-merge-request-conflicts.args]
project = {type = "str", short = "-p", required = false, description = "Project id or path (falls back to GITLAB_PROJECT)"}
mr-iid = {type = "int", required = true, description = "Merge request internal id (the !N shown in the UI)"}

# ── pipelines / jobs ───────────────────────────────────────────────────────

[gitlab.commands.list-pipelines]
description = "List a project's CI/CD pipelines, optionally filtered by ref/status"
autonomy = "autonomous"
[gitlab.commands.list-pipelines.args]
project = {type = "str", short = "-p", required = false, description = "Project id or path (falls back to GITLAB_PROJECT)"}
ref = {type = "str", required = false, description = "Branch or tag to filter by"}
status = {type = "choice", options = ["created", "waiting_for_resource", "preparing", "pending", "running", "success", "failed", "canceled", "skipped", "manual", "scheduled"], required = false, description = "Pipeline status filter"}
per-page = {type = "int", default = 20, description = "Results per page (GitLab caps at 100)"}
page = {type = "int", default = 1, description = "Page number"}

[gitlab.commands.get-pipeline-jobs]
description = "List the jobs of a pipeline (by pipeline id)"
autonomy = "autonomous"
[gitlab.commands.get-pipeline-jobs.args]
project = {type = "str", short = "-p", required = false, description = "Project id or path (falls back to GITLAB_PROJECT)"}
pipeline-id = {type = "int", required = true, description = "Pipeline id (not the iid)"}
per-page = {type = "int", default = 20, description = "Results per page (GitLab caps at 100)"}
page = {type = "int", default = 1, description = "Page number"}

[gitlab.commands.get-job-log]
description = "Fetch a CI job's log (trace) as text; pass --tail to return only the last N lines"
autonomy = "autonomous"
[gitlab.commands.get-job-log.args]
project = {type = "str", short = "-p", required = false, description = "Project id or path (falls back to GITLAB_PROJECT)"}
job-id = {type = "int", required = true, description = "Job id"}
tail = {type = "int", required = false, description = "Return only the last N lines (logs are large — usually pass this)"}

# ── repository ─────────────────────────────────────────────────────────────

[gitlab.commands.get-file]
description = "Read a single repository file at a ref (base64 is decoded; non-UTF-8 files are flagged binary)"
autonomy = "autonomous"
[gitlab.commands.get-file.args]
project = {type = "str", short = "-p", required = false, description = "Project id or path (falls back to GITLAB_PROJECT)"}
file-path = {type = "str", required = true, description = "Path within the repository (e.g. src/main.py)"}
ref = {type = "str", default = "HEAD", description = "Branch, tag, or commit (default HEAD = the default branch tip)"}

[gitlab.commands.list-tree]
description = "List a repository tree at a path/ref; --recursive walks subdirectories"
autonomy = "autonomous"
[gitlab.commands.list-tree.args]
project = {type = "str", short = "-p", required = false, description = "Project id or path (falls back to GITLAB_PROJECT)"}
path = {type = "str", required = false, description = "Subdirectory to list (default: repository root)"}
ref = {type = "str", required = false, description = "Branch, tag, or commit (default: the default branch)"}
recursive = {type = "flag", default = false, description = "Walk subdirectories recursively"}
per-page = {type = "int", default = 20, description = "Results per page (GitLab caps at 100)"}
page = {type = "int", default = 1, description = "Page number"}

# ── issue writes ───────────────────────────────────────────────────────────

[gitlab.commands.create-issue]
description = "Create an issue (canonical create_issue)"
autonomy = "confirm"
[gitlab.commands.create-issue.args]
project = {type = "str", short = "-p", required = false, description = "Project id or path (falls back to GITLAB_PROJECT)"}
title = {type = "str", required = true, description = "Issue title"}
description = {type = "str", required = false, description = "Issue body (Markdown)"}
label = {type = "str", multiple = true, required = false, description = "Label to apply (repeat --label)"}
assignee = {type = "str", multiple = true, required = false, description = "Username to assign (repeat --assignee)"}
milestone-id = {type = "int", required = false, description = "Milestone id"}
due-date = {type = "str", ui = "date", required = false, description = "Due date (YYYY-MM-DD)"}
confidential = {type = "flag", default = false, description = "Create the issue as confidential"}

[gitlab.commands.update-issue]
description = "Edit an issue's title, description, labels, assignees, milestone or due date, or close/reopen it"
autonomy = "confirm"
[gitlab.commands.update-issue.args]
project = {type = "str", short = "-p", required = false, description = "Project id or path (falls back to GITLAB_PROJECT)"}
issue-iid = {type = "int", required = true, description = "Issue internal id (the #N shown in the UI)"}
title = {type = "str", required = false, description = "New title"}
description = {type = "str", required = false, description = "New body (Markdown; replaces the old one)"}
add-label = {type = "str", multiple = true, required = false, description = "Label to add (repeat)"}
remove-label = {type = "str", multiple = true, required = false, description = "Label to remove (repeat)"}
assignee = {type = "str", multiple = true, required = false, description = "Username to assign; replaces the current assignees (repeat)"}
milestone-id = {type = "int", required = false, description = "Milestone id"}
due-date = {type = "str", ui = "date", required = false, description = "Due date (YYYY-MM-DD)"}
state = {type = "choice", options = ["close", "reopen"], required = false, description = "Close or reopen the issue"}

[gitlab.commands.add-issue-note]
description = "Comment on an issue"
autonomy = "confirm"
[gitlab.commands.add-issue-note.args]
project = {type = "str", short = "-p", required = false, description = "Project id or path (falls back to GITLAB_PROJECT)"}
issue-iid = {type = "int", required = true, description = "Issue internal id (the #N shown in the UI)"}
body = {type = "str", required = true, description = "Comment text (Markdown)"}
internal = {type = "flag", default = false, description = "Post as an internal note (project members only)"}

# ── merge request writes ───────────────────────────────────────────────────

[gitlab.commands.create-merge-request]
description = "Open a merge request (canonical create_merge_request)"
autonomy = "confirm"
[gitlab.commands.create-merge-request.args]
project = {type = "str", short = "-p", required = false, description = "Project id or path (falls back to GITLAB_PROJECT)"}
source-branch = {type = "str", required = true, description = "Branch with the changes"}
target-branch = {type = "str", required = true, description = "Branch to merge into (e.g. main)"}
title = {type = "str", required = true, description = "Merge request title"}
description = {type = "str", required = false, description = "Merge request body (Markdown)"}
draft = {type = "flag", default = false, description = "Open as a draft (prefixes the title with 'Draft: ')"}
label = {type = "str", multiple = true, required = false, description = "Label to apply (repeat)"}
assignee = {type = "str", multiple = true, required = false, description = "Username to assign (repeat)"}
reviewer = {type = "str", multiple = true, required = false, description = "Username to request review from (repeat)"}
remove-source-branch = {type = "flag", default = false, description = "Delete the source branch when merged"}
squash = {type = "flag", default = false, description = "Squash commits when merged"}

[gitlab.commands.update-merge-request]
description = "Edit a merge request's title, description, target branch, labels, assignees or reviewers, or close/reopen it"
autonomy = "confirm"
[gitlab.commands.update-merge-request.args]
project = {type = "str", short = "-p", required = false, description = "Project id or path (falls back to GITLAB_PROJECT)"}
mr-iid = {type = "int", required = true, description = "Merge request internal id (the !N shown in the UI)"}
title = {type = "str", required = false, description = "New title"}
description = {type = "str", required = false, description = "New body (Markdown; replaces the old one)"}
target-branch = {type = "str", required = false, description = "New target branch"}
add-label = {type = "str", multiple = true, required = false, description = "Label to add (repeat)"}
remove-label = {type = "str", multiple = true, required = false, description = "Label to remove (repeat)"}
assignee = {type = "str", multiple = true, required = false, description = "Username to assign; replaces the current assignees (repeat)"}
reviewer = {type = "str", multiple = true, required = false, description = "Username to request review from; replaces the current reviewers (repeat)"}
state = {type = "choice", options = ["close", "reopen"], required = false, description = "Close or reopen the merge request"}

[gitlab.commands.add-merge-request-note]
description = "Comment on a merge request"
autonomy = "confirm"
[gitlab.commands.add-merge-request-note.args]
project = {type = "str", short = "-p", required = false, description = "Project id or path (falls back to GITLAB_PROJECT)"}
mr-iid = {type = "int", required = true, description = "Merge request internal id (the !N shown in the UI)"}
body = {type = "str", required = true, description = "Comment text (Markdown)"}
internal = {type = "flag", default = false, description = "Post as an internal note (project members only)"}

[gitlab.commands.merge-merge-request]
description = "Merge a merge request, or set it to merge when its pipeline succeeds"
autonomy = "confirm"
[gitlab.commands.merge-merge-request.args]
project = {type = "str", short = "-p", required = false, description = "Project id or path (falls back to GITLAB_PROJECT)"}
mr-iid = {type = "int", required = true, description = "Merge request internal id (the !N shown in the UI)"}
sha = {type = "str", required = false, description = "Only merge if the source branch head is still this commit"}
when-pipeline-succeeds = {type = "flag", default = false, description = "Merge automatically once the pipeline passes instead of now"}
squash = {type = "flag", default = false, description = "Squash commits (default: the merge request's own setting)"}
remove-source-branch = {type = "flag", default = false, description = "Delete the source branch (default: the merge request's own setting)"}
merge-commit-message = {type = "str", required = false, description = "Custom merge commit message"}

# ── repository writes ──────────────────────────────────────────────────────

[gitlab.commands.create-branch]
description = "Create a branch from a branch, tag, or commit"
autonomy = "confirm"
[gitlab.commands.create-branch.args]
project = {type = "str", short = "-p", required = false, description = "Project id or path (falls back to GITLAB_PROJECT)"}
branch = {type = "str", required = true, description = "New branch name"}
ref = {type = "str", required = true, description = "Branch, tag, or commit SHA to branch from"}

[gitlab.commands.write-file]
description = "Commit a text file to a branch, creating it or replacing its content"
autonomy = "confirm"
[gitlab.commands.write-file.args]
project = {type = "str", short = "-p", required = false, description = "Project id or path (falls back to GITLAB_PROJECT)"}
file-path = {type = "str", required = true, description = "Path within the repository (e.g. src/main.py)"}
branch = {type = "str", required = true, description = "Branch to commit to"}
commit-message = {type = "str", required = true, description = "Commit message"}
content = {type = "str", required = false, description = "New file content"}
content-file = {type = "path", required = false, description = "Local file whose text becomes the new content"}
start-branch = {type = "str", required = false, description = "Create --branch from this branch first (for a new branch)"}
last-commit-id = {type = "str", required = false, description = "Only update if the file's last commit is still this one"}
[gitlab.commands.write-file.groups.content-source]
exactly-one = true
args = ["content", "content-file"]

# ── pipeline / job writes ──────────────────────────────────────────────────

[gitlab.commands.create-pipeline]
description = "Start a new pipeline on a branch or tag"
autonomy = "confirm"
[gitlab.commands.create-pipeline.args]
project = {type = "str", short = "-p", required = false, description = "Project id or path (falls back to GITLAB_PROJECT)"}
ref = {type = "str", required = true, description = "Branch or tag to run the pipeline on"}
variable = {type = "str", multiple = true, required = false, description = "Pipeline variable as KEY=VALUE (repeat)"}

[gitlab.commands.retry-pipeline]
description = "Retry a pipeline's failed or canceled jobs"
autonomy = "confirm"
[gitlab.commands.retry-pipeline.args]
project = {type = "str", short = "-p", required = false, description = "Project id or path (falls back to GITLAB_PROJECT)"}
pipeline-id = {type = "int", required = true, description = "Pipeline id (not the iid)"}

[gitlab.commands.cancel-pipeline]
description = "Cancel a pipeline's running jobs"
autonomy = "confirm"
[gitlab.commands.cancel-pipeline.args]
project = {type = "str", short = "-p", required = false, description = "Project id or path (falls back to GITLAB_PROJECT)"}
pipeline-id = {type = "int", required = true, description = "Pipeline id (not the iid)"}

[gitlab.commands.retry-job]
description = "Retry a single CI job"
autonomy = "confirm"
[gitlab.commands.retry-job.args]
project = {type = "str", short = "-p", required = false, description = "Project id or path (falls back to GITLAB_PROJECT)"}
job-id = {type = "int", required = true, description = "Job id"}

[gitlab.commands.cancel-job]
description = "Cancel a single running CI job"
autonomy = "confirm"
[gitlab.commands.cancel-job.args]
project = {type = "str", short = "-p", required = false, description = "Project id or path (falls back to GITLAB_PROJECT)"}
job-id = {type = "int", required = true, description = "Job id"}

[gitlab.commands.play-job]
description = "Run a manual CI job"
autonomy = "confirm"
[gitlab.commands.play-job.args]
project = {type = "str", short = "-p", required = false, description = "Project id or path (falls back to GITLAB_PROJECT)"}
job-id = {type = "int", required = true, description = "Job id of the manual job"}
variable = {type = "str", multiple = true, required = false, description = "Job variable as KEY=VALUE (repeat)"}

# ── deletes (manual: a person runs these, never an agent) ──────────────────

[gitlab.commands.delete-issue]
description = "Permanently delete an issue (project owners and admins only)"
autonomy = "manual"
[gitlab.commands.delete-issue.args]
project = {type = "str", short = "-p", required = false, description = "Project id or path (falls back to GITLAB_PROJECT)"}
issue-iid = {type = "int", required = true, description = "Issue internal id (the #N shown in the UI)"}

[gitlab.commands.delete-branch]
description = "Delete a branch (GitLab refuses protected and default branches)"
autonomy = "manual"
[gitlab.commands.delete-branch.args]
project = {type = "str", short = "-p", required = false, description = "Project id or path (falls back to GITLAB_PROJECT)"}
branch = {type = "str", required = true, description = "Branch to delete"}

[gitlab.commands.delete-file]
description = "Delete a repository file from a branch in one commit"
autonomy = "manual"
[gitlab.commands.delete-file.args]
project = {type = "str", short = "-p", required = false, description = "Project id or path (falls back to GITLAB_PROJECT)"}
file-path = {type = "str", required = true, description = "Path within the repository (e.g. src/old.py)"}
branch = {type = "str", required = true, description = "Branch to commit the delete to"}
commit-message = {type = "str", required = true, description = "Commit message"}
last-commit-id = {type = "str", required = false, description = "Only delete if the file's last commit is still this one"}

[gitlab.commands.delete-pipeline]
description = "Delete a pipeline with its jobs, logs and artifacts (project owners only)"
autonomy = "manual"
[gitlab.commands.delete-pipeline.args]
project = {type = "str", short = "-p", required = false, description = "Project id or path (falls back to GITLAB_PROJECT)"}
pipeline-id = {type = "int", required = true, description = "Pipeline id (not the iid)"}
