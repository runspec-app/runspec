[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runspec-wireshark-core"
version = "0.1.0"
requires-python = ">=3.10"
readme = "README.md"
description = "Pure-Python tshark (Wireshark) helpers — the importable core behind runspec-wireshark (no runspec dependency, no runnables)"
keywords = ["wireshark", "tshark", "pcap", "packet-capture", "network"]
# stdlib only: everything shells out to tshark / capinfos / mergecap.
dependencies = []

[project.urls]
Documentation = "https://runspec.app/"
Source        = "https://github.com/runspec-app/runspec/tree/main/packages/python/runspec-wireshark-core"
Changelog     = "https://github.com/runspec-app/runspec/blob/main/packages/python/runspec-wireshark-core/CHANGELOG.md"
Issues        = "https://github.com/runspec-app/runspec/issues"

[project.optional-dependencies]
dev = [
    "ruff==0.15.20",
    "mypy",
    "pytest>=8.0",
]

[tool.hatch.build.targets.sdist]
exclude = ["tests/data"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
