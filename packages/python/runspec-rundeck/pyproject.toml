[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runspec-rundeck"
version = "0.1.0"
requires-python = ">=3.10"
description = "Sync runspec runnables to Rundeck as jobs — a JVM-free `rd jobs load` for CI, plus push/list over the REST API"
readme = "README.md"
keywords = ["runspec", "runnable", "rundeck", "ci", "mcp"]
dependencies = [
    # 0.52.0 ships `runspec emit --rundeck --stdout`, which `sync` shells out to.
    "runspec>=0.52.0",
    "runspec-rundeck-core>=0.1.0",
]

[project.urls]
Documentation = "https://runspec.app/"
Source        = "https://github.com/jasonfinestone/runspec/tree/main/packages/python/runspec-rundeck"
Changelog     = "https://github.com/jasonfinestone/runspec/blob/main/packages/python/runspec-rundeck/CHANGELOG.md"
Issues        = "https://github.com/jasonfinestone/runspec/issues"

[project.scripts]
# Entry point name MUST match the runnable name in runspec.toml (`rundeck`).
rundeck = "runspec_rundeck.cli:main"

[project.optional-dependencies]
dev = [
    "ruff==0.15.20",
    "mypy",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
