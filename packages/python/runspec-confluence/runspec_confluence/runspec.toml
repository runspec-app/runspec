#:schema https://runspec.app/runspec.schema.json

# runspec-confluence — a Confluence runnable ported from the Atlassian MCP
# server (sooperset/mcp-atlassian), onto atlassian-python-api.
#
# One runnable, `confluence`, with a verb per tool. `runspec serve` re-expands
# each verb into its own leaf MCP tool (confluence_get-page, confluence_create-page,
# …), so a runspec-console agent calls them individually — over SSH on any fleet
# host, with no second server process.
#
# Cloud and Server/Data Center. Auth is env-var driven:
#   CONFLUENCE_URL + (CONFLUENCE_PERSONAL_TOKEN | CONFLUENCE_USERNAME + CONFLUENCE_API_TOKEN)
# Per-environment overrides use a CONFLUENCE_<ENV>_ prefix, selected with the
# global --env (dev/uat/prod) arg. Cloud vs Server/DC is set by CONFLUENCE_CLOUD,
# else inferred from a .atlassian.net host.
#
# Reads are autonomous; writes require confirmation. Page bodies are passed in a
# Confluence representation via --content-format (storage XHTML by default, or
# wiki/editor/markdown; markdown is converted to storage client-side on write).
# `get-page --markdown` renders a fetched body back to Markdown (read side),
# with macros rendered readably (code fences, panels, diagram placeholders).
# `list-macros` / `get-diagram` / `download-diagram` read draw.io and Gliffy
# diagrams, which live as page attachments. `add-diagram` writes a diagram from
# text (Mermaid, PlantUML, Graphviz …): it attaches a PNG the caller already
# rendered (--image, e.g. from runspec-console's render_diagram tool). Without
# --image it uses a renderer the operator opted into on the host: a Kroki server
# (CONFLUENCE_KROKI_URL) or a Mermaid/PlantUML app macro
# (CONFLUENCE_DIAGRAM_MODE=macro). With neither set it refuses and asks for --image.
#
# Proxy + private-CA support is env-driven (no CLI flags): CONFLUENCE_PROXY_URL
# routes requests through a proxy, and CONFLUENCE_VERIFY_SSL may be a CA-bundle
# path (or a false-y value to disable verification).

[config]
autonomy-default = "confirm"

[config.logging]
store = "per-run"

[confluence]
description = "Read and manage Confluence pages, spaces, comments, and labels (Cloud or Server/Data Center)"
output = "json"
require-command = true
examples = [
  {cmd = "confluence get-page --page-id 12345 --expand body.storage", description = "Fetch a page with its storage body"},
  {cmd = "confluence search --cql 'space = DOCS AND text ~ onboarding'", description = "Search content with CQL"},
  {cmd = "confluence create-page --space DOCS --title 'Runbook' --content '<p>Steps</p>'", description = "Create a page"},
  {cmd = "confluence add-comment --page-id 12345 --text 'Reviewed'", description = "Comment on a page"},
]

# ── global args (inherited by every verb) ──────────────────────────────────
[confluence.args]
env = {type = "choice", options = ["dev", "uat", "prod"], short = "-e", required = false, env = "CONFLUENCE_ENV", description = "Target environment (selects CONFLUENCE_<ENV>_* vars, falling back to CONFLUENCE_*)"}
confluence-pat = {type = "password", required = false, env = ["CONFLUENCE_PERSONAL_TOKEN", "CONFLUENCE_PAT", "CONFLUENCE_TOKEN"], description = "Confluence Personal Access Token (Server/DC). Optional; overrides CONFLUENCE_PERSONAL_TOKEN. Supplied via the runspec-console credential/secret channel (RUNSPEC_CONFLUENCE_ARG_CONFLUENCE_PAT), never on the command line."}
confluence-url = {type = "str", required = false, env = "CONFLUENCE_URL", description = "Confluence base URL; overrides CONFLUENCE_URL. Set it once per venv in .runspec_env (CONFLUENCE_URL, or CONFLUENCE_<ENV>_URL with --env)"}
confluence-user = {type = "str", required = false, env = ["CONFLUENCE_USERNAME", "CONFLUENCE_USER"], description = "Basic-auth username (Cloud: account email), with --confluence-password; overrides CONFLUENCE_USERNAME"}
confluence-password = {type = "password", required = false, env = ["CONFLUENCE_API_TOKEN", "CONFLUENCE_PASSWORD"], description = "Basic-auth password or Cloud API token; overrides CONFLUENCE_API_TOKEN. Supplied via the runspec-console credential/secret channel (RUNSPEC_CONFLUENCE_ARG_CONFLUENCE_PASSWORD), never on the command line."}

# ── reads → autonomous ─────────────────────────────────────────────────────

[confluence.commands.search]
description = "Search content with CQL (Confluence Query Language); returns one page of results"
autonomy = "autonomous"
[confluence.commands.search.args]
cql = {type = "str", required = true, description = "CQL query, e.g. 'type = page AND space = DOCS AND text ~ \"onboarding\"'"}
limit = {type = "int", default = 25, description = "Max results"}
start = {type = "int", default = 0, description = "Pagination offset"}
expand = {type = "str", required = false, description = "Comma-separated expand sections"}

[confluence.commands.search-text]
description = "Search content by plain text (wrapped as a siteSearch CQL); pass an already-CQL query to use it verbatim"
autonomy = "autonomous"
[confluence.commands.search-text.args]
query = {type = "str", required = true, description = "Plain-text query (or a full CQL expression, used verbatim)"}
space = {type = "str", required = false, description = "Restrict to this space key"}
content-type = {type = "str", required = false, description = "Restrict to a content type, e.g. page or blogpost"}
limit = {type = "int", default = 25, description = "Max results"}
start = {type = "int", default = 0, description = "Pagination offset"}

[confluence.commands.search-by-label]
description = "Find content tagged with a label (optionally within one space)"
autonomy = "autonomous"
[confluence.commands.search-by-label.args]
label = {type = "str", required = true, description = "Label to search for"}
space = {type = "str", required = false, description = "Restrict to this space key"}
limit = {type = "int", default = 25, description = "Max results"}
start = {type = "int", default = 0, description = "Pagination offset"}

[confluence.commands.whoami]
description = "Show the authenticated user for the configured credentials"
autonomy = "autonomous"
[confluence.commands.whoami.args]

[confluence.commands.list-spaces]
description = "List spaces (one page of results)"
autonomy = "autonomous"
[confluence.commands.list-spaces.args]
space-type = {type = "choice", options = ["global", "personal"], required = false, description = "Filter to global or personal spaces"}
limit = {type = "int", default = 25, description = "Max results"}
start = {type = "int", default = 0, description = "Pagination offset"}

[confluence.commands.get-page]
description = "Fetch a page by id, or by space + title"
autonomy = "autonomous"
[confluence.commands.get-page.args]
page-id = {type = "str", required = false, description = "Page id"}
space = {type = "str", required = false, description = "Space key (with --title; falls back to CONFLUENCE_SPACE)"}
title = {type = "str", required = false, description = "Page title (with --space)"}
expand = {type = "str", required = false, description = "Comma-separated expand sections, e.g. body.storage,version"}
markdown = {type = "flag", default = false, description = "Also render the page body to Markdown as a 'markdown' field (forces body.storage expand when --expand is unset)"}

[confluence.commands.get-page-children]
description = "List a page's immediate children of a given type (one page of results)"
autonomy = "autonomous"
[confluence.commands.get-page-children.args]
page-id = {type = "str", required = true, description = "Parent page id"}
child-type = {type = "choice", options = ["page", "comment", "attachment"], default = "page", description = "Child content type to list"}
limit = {type = "int", default = 25, description = "Max results"}
start = {type = "int", default = 0, description = "Pagination offset"}

[confluence.commands.get-page-ancestors]
description = "List a page's ancestor pages (breadcrumb, root first)"
autonomy = "autonomous"
[confluence.commands.get-page-ancestors.args]
page-id = {type = "str", required = true, description = "Page id"}

[confluence.commands.get-page-history]
description = "Return a page's content history (created/last-updated, versions)"
autonomy = "autonomous"
[confluence.commands.get-page-history.args]
page-id = {type = "str", required = true, description = "Page id"}

[confluence.commands.get-labels]
description = "List a page's labels"
autonomy = "autonomous"
[confluence.commands.get-labels.args]
page-id = {type = "str", required = true, description = "Page id"}

[confluence.commands.get-comments]
description = "List a page's comments (rendered bodies)"
autonomy = "autonomous"
[confluence.commands.get-comments.args]
page-id = {type = "str", required = true, description = "Page id"}
limit = {type = "int", default = 25, description = "Max comments"}
start = {type = "int", default = 0, description = "Pagination offset"}

[confluence.commands.get-page-restrictions]
description = "Return the view/edit restrictions on a page"
autonomy = "autonomous"
[confluence.commands.get-page-restrictions.args]
page-id = {type = "str", required = true, description = "Page id"}

[confluence.commands.get-space]
description = "Fetch a space's metadata"
autonomy = "autonomous"
[confluence.commands.get-space.args]
space-key = {type = "str", required = true, description = "Space key"}

[confluence.commands.get-space-pages]
description = "List pages in a space (one page of results)"
autonomy = "autonomous"
[confluence.commands.get-space-pages.args]
space = {type = "str", required = true, description = "Space key"}
limit = {type = "int", default = 50, description = "Max results"}
start = {type = "int", default = 0, description = "Pagination offset"}

# ── writes → confirm ───────────────────────────────────────────────────────

[confluence.commands.create-page]
description = "Create a page. --content is in the --content-format representation."
autonomy = "confirm"
[confluence.commands.create-page.args]
space = {type = "str", required = true, description = "Space key"}
title = {type = "str", required = true, description = "Page title"}
content = {type = "str", required = true, description = "Page body in the --content-format representation"}
parent-id = {type = "str", required = false, description = "Parent page id"}
content-format = {type = "choice", options = ["storage", "wiki", "editor", "markdown"], default = "storage", description = "Body representation (storage = Confluence XHTML; markdown is converted to storage client-side)"}

[confluence.commands.update-page]
description = "Update a page. --title is required by the API even when only the body changes."
autonomy = "confirm"
[confluence.commands.update-page.args]
page-id = {type = "str", required = true, description = "Page id"}
title = {type = "str", required = true, description = "Page title (pass the current title if unchanged)"}
content = {type = "str", required = false, description = "New body in the --content-format representation"}
parent-id = {type = "str", required = false, description = "New parent page id"}
content-format = {type = "choice", options = ["storage", "wiki", "editor", "markdown"], default = "storage", description = "Body representation (markdown is converted to storage client-side)"}
version-comment = {type = "str", required = false, description = "Version comment for the edit"}
minor-edit = {type = "flag", default = false, description = "Mark as a minor edit (no notifications)"}

[confluence.commands.delete-page]
description = "Delete a page (and, with --recursive, its descendants)"
autonomy = "confirm"
[confluence.commands.delete-page.args]
page-id = {type = "str", required = true, description = "Page id"}
recursive = {type = "flag", default = false, description = "Also delete descendant pages"}

[confluence.commands.move-page]
description = "Move a page relative to a target (append under it, or above/below)"
autonomy = "confirm"
[confluence.commands.move-page.args]
space = {type = "str", required = true, description = "Space key of the page"}
page-id = {type = "str", required = true, description = "Page id to move"}
target-id = {type = "str", required = false, description = "Target page id"}
target-title = {type = "str", required = false, description = "Target page title (alternative to --target-id)"}
position = {type = "choice", options = ["append", "above", "below"], default = "append", description = "Placement relative to the target"}

[confluence.commands.add-label]
description = "Add a label to a page"
autonomy = "confirm"
[confluence.commands.add-label.args]
page-id = {type = "str", required = true, description = "Page id"}
label = {type = "str", required = true, description = "Label to add"}

[confluence.commands.add-comment]
description = "Add a comment to a page"
autonomy = "confirm"
[confluence.commands.add-comment.args]
page-id = {type = "str", required = true, description = "Page id"}
text = {type = "str", required = true, description = "Comment text"}

# ── attachments ────────────────────────────────────────────────────────────

[confluence.commands.get-attachments]
description = "List a page's attachments (optionally filtered by filename)"
autonomy = "autonomous"
[confluence.commands.get-attachments.args]
page-id = {type = "str", required = true, description = "Page id"}
limit = {type = "int", default = 50, description = "Max attachments"}
start = {type = "int", default = 0, description = "Pagination offset"}
filename = {type = "str", required = false, description = "Only attachments with this filename"}

[confluence.commands.download-attachments]
description = "Download all of a page's attachments into a directory on this host"
autonomy = "confirm"
[confluence.commands.download-attachments.args]
page-id = {type = "str", required = true, description = "Page id"}
dest = {type = "path", required = true, description = "Destination directory to write the attachments into"}

[confluence.commands.upload-attachment]
description = "Upload a local file as an attachment on a page"
autonomy = "confirm"
[confluence.commands.upload-attachment.args]
page-id = {type = "str", required = true, description = "Page id"}
file = {type = "path", required = true, description = "Local file to upload"}
name = {type = "str", required = false, description = "Attachment name (defaults to the file's name)"}
content-type = {type = "str", required = false, description = "MIME type (e.g. application/pdf)"}
comment = {type = "str", required = false, description = "Version comment for the attachment"}

[confluence.commands.delete-attachment]
description = "Delete a page attachment by filename"
autonomy = "confirm"
[confluence.commands.delete-attachment.args]
page-id = {type = "str", required = true, description = "Page id"}
filename = {type = "str", required = true, description = "Attachment filename to delete"}

# ── macros + diagrams ──────────────────────────────────────────────────────

[confluence.commands.list-macros]
description = "List the macros on a page (code, panels, expand, draw.io, Gliffy, PlantUML, Mermaid, …) with their parameters; draw.io/Gliffy entries name the attachments that hold the diagram"
autonomy = "autonomous"
[confluence.commands.list-macros.args]
page-id = {type = "str", required = true, description = "Page id"}

[confluence.commands.get-diagram]
description = "Read a draw.io or Gliffy diagram on a page as text: its shapes (with labels and containing groups) and connectors (source -> target, with labels)"
autonomy = "autonomous"
[confluence.commands.get-diagram.args]
page-id = {type = "str", required = true, description = "Page the diagram is shown on"}
name = {type = "str", required = false, description = "Diagram name; required when the page has more than one (see list-macros)"}
include-source = {type = "flag", default = false, description = "Also return the decoded diagram source (draw.io XML / Gliffy JSON)"}

[confluence.commands.download-diagram]
description = "Save a draw.io or Gliffy diagram's source file (.drawio / .gliffy) and its PNG preview into a directory on this host"
autonomy = "confirm"
[confluence.commands.download-diagram.args]
page-id = {type = "str", required = true, description = "Page the diagram is shown on"}
dest = {type = "path", required = true, description = "Destination directory"}
name = {type = "str", required = false, description = "Diagram name; required when the page has more than one (see list-macros)"}

[confluence.commands.add-diagram]
description = "Add a diagram to a page as an image with its text source in a collapsed block below it. Render the diagram to a PNG first (runspec-console: render_diagram) and pass it as --image; without --image this only works when the operator has set up a renderer on this host (Kroki or a Mermaid/PlantUML app macro). Re-adding with the same name replaces the image"
autonomy = "confirm"
[confluence.commands.add-diagram.args]
page-id = {type = "str", required = true, description = "Page to add the diagram to"}
kind = {type = "choice", options = ["mermaid", "plantuml", "c4plantuml", "graphviz", "d2", "ditaa", "erd", "nomnoml", "bpmn", "structurizr"], required = true, description = "Diagram language of --source"}
source = {type = "str", required = true, description = "The diagram text, with real line breaks, e.g. Mermaid 'graph TD' then 'A-->B' on the next line. Kept under the image so the diagram can be edited and re-rendered"}
name = {type = "str", required = true, description = "Diagram name; names the PNG attachment (Order flow -> order-flow.png)"}
image = {type = "path", required = false, description = "PNG of the diagram, already rendered (e.g. by runspec-console's render_diagram); a path on the host this runs on"}
position = {type = "choice", options = ["append", "prepend"], default = "append", description = "Add at the end or the start of the page"}
caption = {type = "str", required = false, description = "Caption under the image"}
