[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runspec-linux-root"
version = "0.1.0"
requires-python = ">=3.10"
description = "Linux admin runnables that need root (packages, reboot, sysctl) for runspec"
readme = "README.md"
keywords = ["runspec", "runnable", "linux", "sysadmin", "root", "packages"]
dependencies = [
    "runspec>=0.68.0",
    "runspec-linux-core>=0.13.0",
]

[project.urls]
Documentation = "https://runspec.app/"
Source        = "https://github.com/jasonfinestone/runspec/tree/main/packages/python/runspec-linux-root"
Changelog     = "https://github.com/jasonfinestone/runspec/blob/main/packages/python/runspec-linux-root/CHANGELOG.md"
Issues        = "https://github.com/jasonfinestone/runspec/issues"

[project.scripts]
list-upgrades       = "runspec_linux_root.packages:main_list_upgrades"
upgrade-packages    = "runspec_linux_root.packages:main_upgrade_packages"
install-package     = "runspec_linux_root.packages:main_install_package"
remove-package      = "runspec_linux_root.packages:main_remove_package"
autoremove-packages = "runspec_linux_root.packages:main_autoremove_packages"
set-sysctl          = "runspec_linux_root.perf:main_set_sysctl"
reboot-host         = "runspec_linux_root.power:main_reboot_host"
enable-passwordless-sudo = "runspec_linux_root.sudoers:main_enable_passwordless_sudo"

[project.optional-dependencies]
dev = [
    "ruff==0.15.20",
    "mypy",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
