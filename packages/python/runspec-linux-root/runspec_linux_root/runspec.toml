# runspec-linux-root — Linux admin tools that need root.
#
# Install into a ROOT-OWNED venv (e.g. sudo python3 -m venv /opt/venvs/admin):
# root runs this code, so only root may be able to change it. Every tool declares
# run_as = "root"; sudoers decides who may run them.

[config]
autonomy-default = "confirm"

[config.logging]
store = "per-run"

# ── Packages ──────────────────────────────────────────────────────────────────

[list-upgrades]
serve       = ["local"]
description = "List packages with an available upgrade (refreshes the package index first)"
autonomy    = "autonomous"
output      = "json"
run_as      = "root"

[list-upgrades.args.no-refresh]
type        = "flag"
description = "Skip refreshing the package index — list from the cached index (faster)"
default     = false

[upgrade-packages]
serve       = ["local"]
description = "Refresh the package index and upgrade all installed packages (needs root)"
autonomy    = "confirm"
output      = "json"
run_as      = "root"

[install-package]
serve       = ["local"]
description = "Install one or more packages by name (needs root)"
autonomy    = "confirm"
output      = "json"
run_as      = "root"

[install-package.args.package]
type        = "str"
short       = "-p"
description = "Package name to install (space-separated for several)"

[remove-package]
serve       = ["local"]
description = "Remove one or more packages by name (needs root)"
autonomy    = "confirm"
output      = "json"
run_as      = "root"

[remove-package.args.package]
type        = "str"
short       = "-p"
description = "Package name to remove (space-separated for several)"

[remove-package.args.purge]
type        = "flag"
description = "Also delete the packages' configuration files (apt purge / pacman -Rn; a plain remove on dnf/yum/zypper)"
default     = false

[autoremove-packages]
serve       = ["local"]
description = "Remove packages nothing depends on any more, e.g. old kernels (apt autoremove and equivalents; needs root)"
autonomy    = "confirm"
output      = "json"
run_as      = "root"

[autoremove-packages.args.purge]
type        = "flag"
description = "Also delete the removed packages' configuration files (apt --purge / pacman -n)"
default     = false

[autoremove-packages.args.dry-run]
type        = "flag"
description = "Only list what would be removed; remove nothing (not supported on yum). list-autoremovable does the same without needing approval"
default     = false

# ── Package repositories ──────────────────────────────────────────────────────

# One call carries the apt and the rpm details; each host uses the pair for its
# own package manager, so one call (or one group fan-out from runspec-console)
# covers a mixed Debian/RHEL/SUSE fleet.
[package-repo]
serve           = ["local"]
description     = "Manage package repositories (apt, dnf/yum, zypper) and their signing keys: list, add, remove"
output          = "json"
run_as          = "root"
require-command = true
examples = [
  {cmd = "package-repo list", description = "List the repositories configured on this host"},
  {cmd = "package-repo add grafana --apt-url https://apt.grafana.com --apt-key https://apt.grafana.com/gpg-full.key --rpm-url https://rpm.grafana.com --rpm-key https://rpm.grafana.com/gpg.key", description = "Add Grafana's repository (for Alloy) on an apt, dnf, yum or zypper host"},
  {cmd = "package-repo add grafana <same args> --key-fingerprint <fingerprint>,<fingerprint>", description = "Only trust the key file if every key in it is one you listed (a first add prints them)"},
  {cmd = "package-repo remove grafana", description = "Remove the repository and its key file"},
]

[package-repo.commands.list]
description = "List the package repositories configured on this host (file, URLs, enabled, signing key, and whether package-repo added it)"
autonomy    = "autonomous"
[package-repo.commands.list.args]
filter = {type = "str", required = false, description = "Only repositories whose name, id or URL contains this text"}

[package-repo.commands.add]
description = "Add or update a package repository: download its signing key, write the repo file (key trusted for this repo only), then refresh just that repo — undone if the refresh fails. Same values again changes nothing"
autonomy    = "confirm"
[package-repo.commands.add.args]
name            = {type = "str", position = 1, pattern = "[A-Za-z0-9][A-Za-z0-9_.-]{0,63}", description = "Repository name, used for the file names (e.g. grafana → /etc/apt/sources.list.d/grafana.list or /etc/yum.repos.d/grafana.repo)"}
apt-url         = {type = "str", required = false, description = "apt hosts: the repository URL (e.g. https://apt.grafana.com)"}
apt-key         = {type = "str", required = false, description = "apt hosts: the signing key — an https:// URL or a file path on the host (e.g. https://apt.grafana.com/gpg-full.key)"}
apt-suite       = {type = "str", default = "stable", description = "apt hosts: the suite / distribution (e.g. stable, bookworm, noble). A flat repo ends in '/'"}
apt-components  = {type = "str", default = "main", description = "apt hosts: space-separated components (e.g. main, or 'main contrib')"}
rpm-url         = {type = "str", required = false, description = "dnf, yum and zypper hosts: the repository baseurl (e.g. https://rpm.grafana.com; $releasever and $basearch are allowed)"}
rpm-key         = {type = "str", required = false, description = "dnf, yum and zypper hosts: the signing key — an https:// URL or a file path on the host (e.g. https://rpm.grafana.com/gpg.key)"}
key-fingerprint = {type = "str", multiple = true, delimiter = ",", required = false, description = "Refuse the key file unless every key in it is listed here (full fingerprints; repeat the flag or separate with commas). The output of a first add shows them"}
unsigned-metadata = {type = "flag", default = false, description = "dnf/yum/zypper: the repository's metadata isn't signed (repo_gpgcheck=0). Packages are still checked (gpgcheck=1)"}
replace         = {type = "flag", default = false, description = "Overwrite a same-named repository file that package-repo didn't add (e.g. one set up by hand)"}
no-refresh      = {type = "flag", default = false, description = "Write the files but don't refresh the repository (nothing is checked or undone)"}
proxy           = {type = "str", required = false, description = "Proxy for downloading the key (http://host:port), or 'direct' for none. Default: the proxy environment variables. The package manager uses its own proxy settings"}
ca-bundle       = {type = "str", required = false, description = "PEM file of CA certificates for downloading the key from a server with a private CA"}

[package-repo.commands.remove]
description = "Remove a package repository by name (as shown by list) and the key file it uses, if no other repository uses it. Keys already in the rpm database stay. Removing one that isn't there is not an error"
autonomy    = "confirm"
[package-repo.commands.remove.args]
name = {type = "str", position = 1, description = "Repository name (the file name without .list/.sources/.repo, as shown by list)"}

# ── Services ──────────────────────────────────────────────────────────────────

# runspec-linux's restart-service never runs as root; this is the root version,
# for system services (e.g. starting and enabling alloy after installing it).
[system-service]
serve           = ["local"]
description     = "Start, stop, restart, reload, enable or disable a systemd system service (needs root)"
output          = "json"
run_as          = "root"
autonomy        = "confirm"
require-command = true
examples = [
  {cmd = "system-service enable alloy --now", description = "Start alloy now and at every boot"},
  {cmd = "system-service restart alloy", description = "Restart alloy (e.g. after changing its config)"},
]

[system-service.commands.start]
description = "Start a service"
[system-service.commands.start.args]
service = {type = "str", position = 1, description = "Service name (e.g. alloy or alloy.service)"}

[system-service.commands.stop]
description = "Stop a service"
[system-service.commands.stop.args]
service = {type = "str", position = 1, description = "Service name (e.g. alloy or alloy.service)"}

[system-service.commands.restart]
description = "Restart a service"
[system-service.commands.restart.args]
service = {type = "str", position = 1, description = "Service name (e.g. alloy or alloy.service)"}

[system-service.commands.reload]
description = "Ask a service to reload its configuration (not every service supports it)"
[system-service.commands.reload.args]
service = {type = "str", position = 1, description = "Service name (e.g. alloy or alloy.service)"}

[system-service.commands.enable]
description = "Start a service at boot; --now also starts it now"
[system-service.commands.enable.args]
service = {type = "str", position = 1, description = "Service name (e.g. alloy or alloy.service)"}
now     = {type = "flag", default = false, description = "Also start it now"}

[system-service.commands.disable]
description = "Stop starting a service at boot; --now also stops it now"
[system-service.commands.disable.args]
service = {type = "str", position = 1, description = "Service name (e.g. alloy or alloy.service)"}
now     = {type = "flag", default = false, description = "Also stop it now"}

# ── Config files ──────────────────────────────────────────────────────────────

# The narrow root version of `filesystem write-file`/`edit-file`: only paths in
# the venv's root-owned allowlist ({venv}/runspec_root_files.conf), never a
# fixed set of sensitive files, no move/delete/list/search. Adding a path to the
# allowlist is `manual`: a person runs it, never an agent.
[config-file]
serve           = ["local"]
description     = "Write, edit or read a config file as root, only at paths in this venv's allowlist (e.g. /etc/alloy/*). Text may hold {{secret:<credential>}} placeholders"
output          = "json"
run_as          = "root"
require-command = true
examples = [
  {cmd = "config-file allowed", description = "Show which paths may be written (and the ones that never are)"},
  {cmd = "config-file allow '/etc/alloy/*'", description = "Let config-file write files directly in /etc/alloy (a person runs this, never an agent)"},
  {cmd = "config-file write /etc/alloy/config.alloy --content '…password = \"{{secret:grafana-cloud}}\"…' --group alloy --mode 0640", description = "Write Alloy's config with a saved credential filled in on the host, readable by the alloy group"},
  {cmd = "config-file edit /etc/alloy/config.alloy --old-text 'scrape_interval = \"60s\"' --new-text 'scrape_interval = \"30s\"'", description = "Change one setting; the output is a diff"},
]

[config-file.commands.allowed]
description = "List the allowlist patterns (from {venv}/runspec_root_files.conf) and the files that are never written"
autonomy    = "autonomous"

[config-file.commands.read]
description = "Read an allowlisted file (UTF-8 text, up to 1 MB) with its owner, group and mode. Root can read files you can't, so this is confirm-gated"
autonomy    = "confirm"
[config-file.commands.read.args]
path = {type = "str", position = 1, description = "Absolute path of the file"}

[config-file.commands.write]
description = "Create or replace an allowlisted file. Atomic; the old file is backed up to {venv}/root_file_backups first; the output is a diff. Text may hold {{secret:<credential id>}} (or {{secret:<id>.username}}) placeholders: the value is filled in on the host and shown as the placeholder in the output. An existing file keeps its owner, group and mode unless given; a new one is root:root 0644, or 0600 when it holds a secret"
autonomy    = "confirm"
[config-file.commands.write.args]
path      = {type = "str", position = 1, description = "Absolute path of the file"}
content   = {type = "str", description = "The whole file content (may hold {{secret:<credential id>}} placeholders)"}
owner     = {type = "str", required = false, description = "User to own the file (e.g. root)"}
group     = {type = "str", required = false, description = "Group to own the file, e.g. alloy for a service that reads it through its group (pair with --mode 0640)"}
mode      = {type = "str", required = false, pattern = "^0?[0-7]{3,4}$", description = "Octal permissions, e.g. 0640. setuid/setgid/sticky bits are refused"}
make-dirs = {type = "flag", default = false, description = "Create missing parent folders (root:root 0755); the file's path must still be allowlisted"}
dry-run   = {type = "flag", default = false, description = "Show the diff without writing"}

[config-file.commands.edit]
description = "Replace text in an existing allowlisted file: pair each --old-text with a --new-text by position; each old text must appear exactly once. Backed up first; the output is a diff. New text may hold {{secret:<credential id>}} placeholders"
autonomy    = "confirm"
[config-file.commands.edit.args]
path     = {type = "str", position = 1, description = "Absolute path of the file"}
old-text = {type = "str", multiple = true, description = "Text to find, exactly once in the file (repeat; paired with --new-text)"}
new-text = {type = "str", multiple = true, description = "Replacement text (repeat; paired with --old-text)"}
owner    = {type = "str", required = false, description = "User to own the file"}
group    = {type = "str", required = false, description = "Group to own the file"}
mode     = {type = "str", required = false, pattern = "^0?[0-7]{3,4}$", description = "Octal permissions, e.g. 0640"}
dry-run  = {type = "flag", default = false, description = "Show the diff without writing"}

[config-file.commands.allow]
description = "Add a path pattern to the allowlist: absolute, '*' matches within one folder, '**' any depth (e.g. /etc/alloy/*). Run by a person only"
autonomy    = "manual"
[config-file.commands.allow.args]
pattern = {type = "str", position = 1, description = "Path pattern, e.g. /etc/alloy/* or /etc/systemd/system/alloy.service.d/*"}

[config-file.commands.disallow]
description = "Remove a path pattern from the allowlist. Run by a person only"
autonomy    = "manual"
[config-file.commands.disallow.args]
pattern = {type = "str", position = 1, description = "The pattern exactly as `config-file allowed` lists it"}

# ── Kernel ────────────────────────────────────────────────────────────────────

[set-sysctl]
serve       = ["local"]
description = "Set a kernel parameter (sysctl -w), optionally persisting it under /etc/sysctl.d (needs root)"
autonomy    = "confirm"
output      = "json"
run_as      = "root"

[set-sysctl.args.key]
type        = "str"
short       = "-k"
description = "Dotted sysctl key (e.g. net.core.somaxconn)"

[set-sysctl.args.value]
type        = "str"
description = "New value to set"

[set-sysctl.args.persist]
type        = "flag"
description = "Also append the setting to /etc/sysctl.d/99-runspec.conf so it survives a reboot"
default     = false

# ── Power ─────────────────────────────────────────────────────────────────────

[reboot-host]
serve       = ["local"]
description = "Reboot the host, optionally after a delay in minutes (needs root)"
autonomy    = "confirm"
output      = "json"
run_as      = "root"

[reboot-host.args.delay-minutes]
type        = "int"
short       = "-d"
description = "Minutes to wait before rebooting (0 = immediately)"
default     = 0

# ── Privilege bootstrap ───────────────────────────────────────────────────────

# One-time setup so the run_as="root" runnables above need no password. Itself
# escalates with the supplied password via `sudo -S` (read from stdin, never
# argv), so it runs as the invoker (run_as = ""). Validated with visudo before +
# after install and rolled back on failure.
[enable-passwordless-sudo]
serve       = ["local"]
description = "Install a validated /etc/sudoers.d drop-in so run_as='root' runnables need no password (one-time bootstrap)"
autonomy    = "confirm"
output      = "json"
run_as      = ""

[enable-passwordless-sudo.args.password]
type        = "password"
description = "Your sudo password — sent over the secret channel and piped to 'sudo -S'; never appears in argv, ps, or logs"

[enable-passwordless-sudo.args.user]
type        = "str"
short       = "-u"
description = "User to grant passwordless sudo (defaults to the current login user)"
required    = false

[enable-passwordless-sudo.args.scope]
type        = "choice"
options     = ["scoped", "all"]
default     = "scoped"
description = "scoped = NOPASSWD only for the programs in this venv's bin/ (direct runs, and runspec-console / MCP gateway runs built on runspec >= 0.70.0); all = NOPASSWD: ALL"
