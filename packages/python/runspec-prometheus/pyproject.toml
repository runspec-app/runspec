[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runspec-prometheus"
version = "0.2.0"
requires-python = ">=3.10"
description = "Prometheus runnable for runspec — PromQL queries, alerts, rules, targets, and server status, ported from the official Prometheus MCP server"
readme = "README.md"
keywords = ["runspec", "runnable", "prometheus", "promql", "monitoring", "mcp"]
dependencies = [
    # 0.44.0 surfaces inherited args (the globals) on each leaf subcommand's
    # MCP tool via `runspec serve`.
    "runspec>=0.44.0",
    "runspec-prometheus-core>=0.2.0",
]

[project.urls]
Documentation = "https://runspec.app/"
Source        = "https://github.com/runspec-app/runspec/tree/main/packages/python/runspec-prometheus"
Changelog     = "https://github.com/runspec-app/runspec/blob/main/packages/python/runspec-prometheus/CHANGELOG.md"
Issues        = "https://github.com/runspec-app/runspec/issues"

[project.scripts]
# Entry point name MUST match the runnable name in runspec.toml (`prometheus`).
prometheus = "runspec_prometheus.cli:main"

[project.optional-dependencies]
dev = [
    "ruff==0.15.20",
    "mypy",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
