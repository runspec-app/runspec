[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runspec-confluence-core"
version = "0.7.1"
requires-python = ">=3.10"
description = "Pure-Python Confluence helpers (over atlassian-python-api) — the importable core behind runspec-confluence (no runspec dependency, no runnables)"
dependencies = [
    "atlassian-python-api>=3.41",
    # Markdown → Confluence storage (XHTML) conversion for --content-format markdown (writes).
    "markdown>=3.4",
    # Confluence HTML → Markdown conversion for read-side summarise.html_to_markdown.
    "markdownify>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.20",
    "mypy",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"

# `markdown` / `markdownify` ship no type stubs; we only call the top-level API.
# `truststore` is an optional runtime detection helper, imported lazily.
[[tool.mypy.overrides]]
module = ["markdown", "markdownify", "truststore"]
ignore_missing_imports = true

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
