[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runspec-confluence-core"
version = "0.4.0"
requires-python = ">=3.10"
description = "Pure-Python Confluence helpers (over atlassian-python-api) — the importable core behind runspec-confluence (no runspec dependency, no runnables)"
dependencies = [
    "atlassian-python-api>=3.41",
    # Markdown → Confluence storage (XHTML) conversion for --content-format markdown.
    "markdown>=3.4",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.20",
    "mypy",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"

# `markdown` ships no type stubs; we only call markdown.markdown().
[[tool.mypy.overrides]]
module = ["markdown"]
ignore_missing_imports = true

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
