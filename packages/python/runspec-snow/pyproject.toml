[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runspec-snow"
version = "0.1.1"
requires-python = ">=3.10"
description = "ServiceNow ITSM runnables for runspec"
readme = "README.md"
keywords = ["runspec", "runnable", "servicenow", "itsm"]
dependencies = [
    "runspec>=0.27.0",
    "httpx",
]

[project.urls]
Documentation = "https://runspec.app/"
Source        = "https://github.com/jasonfinestone/runspec/tree/main/packages/python/runspec-snow"
Changelog     = "https://github.com/jasonfinestone/runspec/blob/main/packages/python/runspec-snow/CHANGELOG.md"
Issues        = "https://github.com/jasonfinestone/runspec/issues"

[project.scripts]
snow-create-record      = "runspec_snow.records:main_create_record"
snow-get-record         = "runspec_snow.records:main_get_record"
snow-add-comment        = "runspec_snow.comments:main_add_comment"
snow-list-states        = "runspec_snow.states:main_list_states"
snow-update-state       = "runspec_snow.states:main_update_state"
snow-set-field          = "runspec_snow.fields:main_set_field"
snow-list-catalog-items = "runspec_snow.catalog:main_list_catalog_items"
snow-list-variables     = "runspec_snow.catalog:main_list_variables"

[project.optional-dependencies]
dev = [
    "ruff==0.15.20",
    "mypy",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
