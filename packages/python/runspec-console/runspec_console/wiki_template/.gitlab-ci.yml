# Team wiki CI: lint every change, publish GitLab Pages from release tags.
# Set PIP_INDEX_URL as a CI variable if runners can only reach an internal mirror.

stages: [check, publish]

default:
  image: python:3.12-slim

lint:
  stage: check
  script:
    - python tools/okf_lint.py .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

pages:
  stage: publish
  script:
    - pip install --quiet "mkdocs<2" mkdocs-material
    - python tools/build_site.py --out public
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
