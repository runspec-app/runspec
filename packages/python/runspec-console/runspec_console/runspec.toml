[config.logging]

# The console is a long-lived *application*, not a runnable invocation — it calls
# runspec.parse("runspec-console") once at startup for arg-parsing + logging and
# then stays resident for the whole session. With the runs index on (the default)
# that would write a `running` row for the console's own pid that only finalizes
# in atexit — which the app deliberately skips (os._exit on shutdown) — so the
# console would show as perpetually "running" in the History tab's live strip.
# Opt the console's own process out of the runs index; runnables launched *by* the
# console still index normally (each has its own [config]).
[config.history]
db = false

[runspec-console]
description = "Desktop console for runspec — run, schedule and monitor runnables"
autonomy    = "confirm"

[runspec-console.args.dev]
type        = "flag"
description = "Point pywebview at the Vite dev server (http://localhost:5173) instead of bundled dist"

[runspec-console.args.port]
type        = "int"
default     = 5173
description = "Vite dev server port (only used with --dev)"

[runspec-console.args.devtools]
type        = "flag"
description = "Enable the Chromium inspector (right-click → Inspect / F12) in production builds"

[runspec-console.args.config-dir]
type        = "path"
required    = false
description = "Use this directory for all console state (hosts, credentials, triggers, config.toml) instead of the default %APPDATA%/runspec-console — handy for testing against an isolated config"

[runspec-console.args.profile-startup]
type        = "flag"
description = "Print cumulative + per-phase startup timings to stderr and the log (same as setting RUNSPEC_STARTUP_PROFILE=1) — for diagnosing a slow launch"

[generate-ssh-key]
description = "Generate or rotate the runspec-console SSH key pair"
autonomy    = "confirm"

[generate-ssh-key.args.rotate]
type        = "flag"
description = "Back up any existing key before generating a new one"
