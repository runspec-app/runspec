[config.logging]

[runspec-console]
description = "Desktop console for runspec — run, schedule and monitor runnables"
autonomy    = "confirm"

[runspec-console.args.dev]
type        = "flag"
description = "Point pywebview at the Vite dev server (http://localhost:5173) instead of bundled dist"

[runspec-console.args.port]
type        = "int"
default     = 5173
description = "Vite dev server port (only used with --dev)"

[runspec-console.args.devtools]
type        = "flag"
description = "Enable the Chromium inspector (right-click → Inspect / F12) in production builds"

[generate-ssh-key]
description = "Generate or rotate the runspec-console SSH key pair"
autonomy    = "confirm"

[generate-ssh-key.args.rotate]
type        = "flag"
description = "Back up any existing key before generating a new one"
