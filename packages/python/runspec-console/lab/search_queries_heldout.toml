# Held-out queries for lab/search_bench.py, written separately from the
# ranking change: from the runspec.toml files only, in everyday ops wording
# (synonyms, no copied phrases, no runnable names). See search_queries.toml.

[[query]]
q = "see output of the failed CI build step"
expect = ["gitlab"]

[[query]]
q = "rerun the broken CI jobs on main"
expect = ["gitlab"]

[[query]]
q = "open a code review request for my branch"
expect = ["gitlab"]

[[query]]
