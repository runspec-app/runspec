# Queries for lab/search_bench.py — how well search_runnables finds the right
# runnable, over every runspec.toml shipped in this repo.
#
# Each [[query]] is something an agent might pass to search_runnables, and
# `expect` lists the runnable names that count as a correct find (more than one
# when two runnables genuinely answer it). Queries are phrased as tasks, the way
# an operator asks, not as runnable names — a name query is already easy.

[[query]]
q = "add a cron job"
expect = ["cron"]

[[query]]
q = "schedule a nightly backup in the crontab"
expect = ["cron"]

[[query]]
q = "remove a crontab entry"
expect = ["cron"]

[[query]]
q = "create a merge request"
expect = ["gitlab"]

[[query]]
