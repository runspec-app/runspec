# Agent-lab variants: what to compare. Each variant runs every scenario.
#
#   config — merged into the console's config.toml for the run
#   env    — environment for the run (the fake runnables read FAKE_JIRA_SHAPE)
#   patch  — module attributes to override, for options that exist only as a
#            code constant today ({"package.module.NAME" = value})
#
# [workspace] spill_threshold sets the spill point in either direction (a
# value below the 32 KB default needs console 0.350.1+).
#
# API-side features (context editing, server-side tool-result clearing) are
# deliberately absent: many LLM proxies and gateways don't pass them through,
# so every variant here works with any provider. Each result is scored with prompt
# caching on and off.

[[variant]]
name = "baseline"
description = "Today's defaults: spill above 32 KB, raw Jira output"

[[variant]]
name = "spill-16k"
description = "Spill above 16 KB"
config = { workspace = { spill_threshold = 16384 } }

[[variant]]
name = "spill-8k"
description = "Spill above 8 KB"
config = { workspace = { spill_threshold = 8192 } }

[[variant]]
name = "spill-4k"
description = "Spill above 4 KB"
config = { workspace = { spill_threshold = 4096 } }

[[variant]]
name = "compact"
description = "Runnables return compact output by default (--include for more)"
env = { FAKE_JIRA_SHAPE = "compact" }

[[variant]]
name = "compact+spill-16k"
description = "Compact output and spill above 16 KB"
config = { workspace = { spill_threshold = 16384 } }
env = { FAKE_JIRA_SHAPE = "compact" }

[[variant]]
name = "compact+spill-8k"
description = "Compact output and spill above 8 KB"
config = { workspace = { spill_threshold = 8192 } }
env = { FAKE_JIRA_SHAPE = "compact" }

# Search mode: the agent gets discovery tools (search_runnables /
# describe_runnable / run_runnable) and a one-line-per-runnable catalogue
# instead of one tool per runnable, and rarely used built-ins move behind
# use_tool. The scripted model describes a runnable the first time it uses it
# in a chat, then runs it through run_runnable.

[[variant]]
name = "search"
description = "tool_mode = search, raw Jira output"
config = { llm = { tool_mode = "search" } }

[[variant]]
name = "search+compact"
description = "tool_mode = search and compact Jira output"
config = { llm = { tool_mode = "search" } }
env = { FAKE_JIRA_SHAPE = "compact" }
