[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runspec-console"
version = "0.10.0"
requires-python = ">=3.11"
dependencies = [
    "pywebview>=5.0",
    "runspec>=0.21.0",
    "pywin32>=306",
    "cryptography>=42.0",
    "paramiko>=3.0",
    # Surfaces the Windows system-admin + Microsoft 365 runnables in the console
    # UI automatically (discovered via `runspec local`). Windows-only — the
    # marker keeps it off non-Windows installs and CI.
    "runspec-windows[graph]>=0.1.0 ; sys_platform == 'win32'",
]

[tool.hatch.build.targets.wheel]
packages = ["runspec_console"]

[tool.hatch.build.targets.wheel.force-include]
"runspec_console/runspec.toml" = "runspec_console/runspec.toml"
# Vite build output — generated by `npm run build` in packages/console-ui
# gitignored but force-included so `pip install` gets the full UI
"runspec_console/dist" = "runspec_console/dist"

[project.scripts]
runspec-console = "runspec_console.app:main"
generate-ssh-key = "runspec_console.tools.generate_ssh_key:main"

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
openai    = ["openai>=1.0.0"]
bedrock   = ["anthropic[bedrock]>=0.40.0"]
dev = [
    "ruff",
    "mypy",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
mypy_path = "../runspec"

[[tool.mypy.overrides]]
module = ["paramiko.*", "win32gui", "win32con", "win32api", "pywintypes", "webview.*", "openai.*", "anthropic.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true
