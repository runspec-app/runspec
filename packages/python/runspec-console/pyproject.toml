[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runspec-console"
version = "0.240.0"
requires-python = ">=3.11"
dependencies = [
    "pywebview>=5.0",
    "runspec>=0.42.0",
    "pywin32>=306 ; sys_platform == 'win32'",
    "cryptography>=42.0",
    "paramiko>=3.0",
    "tomli-w>=1.0",  # config.toml serialisation (valid TOML for nested/array tables)
    # Surfaces the Windows system-admin + cross-platform web/TLS runnables in the
    # console UI automatically (discovered via `runspec local`). Windows-only —
    # the marker keeps it off non-Windows installs and CI. The Microsoft 365 /
    # Graph runnables are NOT pulled in (they moved to the standalone
    # `runspec-o365` package, which the console deliberately does not depend on so
    # a Graph-blocked fleet doesn't carry unusable tools — `pip install
    # runspec-o365` to opt in).
    "runspec-windows>=0.5.0 ; sys_platform == 'win32'",
]

[tool.hatch.build.targets.wheel]
packages = ["runspec_console"]

# Rebuild the Vite UI into runspec_console/dist before packing the wheel, so a
# built wheel never ships a stale frontend (see hatch_build.py). No-op when the
# bundle is already fresh; skipped for non-wheel targets.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel.force-include]
"runspec_console/runspec.toml" = "runspec_console/runspec.toml"
# Vite build output — generated by `npm run build` in packages/console-ui
# gitignored but force-included so `pip install` gets the full UI
"runspec_console/dist" = "runspec_console/dist"

[project.scripts]
runspec-console = "runspec_console.app:main"
generate-ssh-key = "runspec_console.tools.generate_ssh_key:main"

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
openai    = ["openai>=1.0.0"]
bedrock   = ["anthropic[bedrock]>=0.40.0"]
langserve = ["httpx>=0.27"]
# Named credentials: secret values are stored in the OS keychain (Windows
# Credential Manager / macOS Keychain / Secret Service) via keyring; metadata
# stays in runspec_credentials.toml. The feature reports itself unavailable
# until installed.
credentials = ["keyring>=24"]
# Config Sync: pull config.toml / runspec_hosts.toml / … from a git repo by tag
# (Settings → Config Sync). dulwich is a pure-Python git client, so a fresh
# install needs no system `git` binary; SSH repos go over the already-bundled
# paramiko. The feature reports itself unavailable until installed.
git-sync = ["dulwich>=0.22"]
# Scheduled triggers: a `source = "schedule"` trigger fires a runnable on a cron
# or interval timer, routed through the normal trigger gate. APScheduler provides
# the cron/interval engine. Cross-platform; the schedule source reports itself
# unavailable until installed.
schedule = ["apscheduler>=3.10"]
# Code sandbox: run_python_sandboxed / run_sql_sandboxed execute untrusted Python
# inside a WASM/WASI CPython interpreter under wasmtime — no network, no host
# filesystem beyond the session workspace, no subprocess. The ~20 MB WASI Python
# binary is fetched on first use into app-data (SHA-256 verified) or supplied via
# [sandbox] wasm_path for air-gapped installs. The tools report themselves
# unavailable (and are hidden from the agent) until this extra is installed.
sandbox = ["wasmtime>=20"]
# OpenTelemetry (OTLP) agent tracing (Settings → Telemetry / [telemetry]): export
# turn / LLM-call / tool-call spans to any OTel backend — LangSmith, Langfuse,
# Phoenix, Jaeger, Grafana Tempo. Opt-in ([telemetry] enabled=false by default);
# the feature reports itself unavailable until installed.
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
# External MCP servers ([mcp] / [[mcp.servers]]): let the chat agent connect to
# outside MCP servers (stdio / streamable-HTTP / SSE) and use their tools
# alongside the runnables. Opt-in — the console is inert unless servers are
# configured; the feature reports itself unavailable until this extra installs
# the MCP client SDK. See docs/console-mcp.md.
mcp = ["mcp>=1.0"]
# PyWinRT projection for two notification surfaces: *reading* system toasts (the
# listener trigger source — Teams / Slack / any toast, needs the `.Management`
# namespace + a user consent grant) and *sending* confirm toasts (notify.py —
# `.UI.Notifications` + `.Data.Xml.Dom`, no consent needed). Windows-only; both
# report themselves unavailable until installed. PyWinRT (winrt-*) ships wheels
# through current Python versions (3.13+), so this installs without a C toolchain.
notifications = [
    "winrt-runtime>=2.0 ; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.0 ; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=2.0 ; sys_platform == 'win32'",
    "winrt-Windows.Data.Xml.Dom>=2.0 ; sys_platform == 'win32'",
    "winrt-Windows.UI.Notifications>=2.0 ; sys_platform == 'win32'",
    "winrt-Windows.UI.Notifications.Management>=2.0 ; sys_platform == 'win32'",
    "winrt-Windows.ApplicationModel>=2.0 ; sys_platform == 'win32'",
]
# Convenience aggregate: every runtime feature extra in one name, so a downstream
# project can depend on `runspec-console[all]` and not track new extras itself.
# Recursive self-reference (resolved by pip/poetry); excludes `dev`. Win32-only
# deps inside `notifications` keep their markers, so `[all]` is safe on any OS.
all = [
    "runspec-console[anthropic,openai,bedrock,langserve,credentials,git-sync,notifications,schedule,otel,mcp]",
]
dev = [
    "ruff==0.15.20",
    "mypy",
    "pytest>=8.0",
    "httpx>=0.27",
    "dulwich>=0.22",
    "apscheduler>=3.10",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "mcp>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
mypy_path = "../runspec"

[[tool.mypy.overrides]]
module = ["paramiko.*", "win32gui", "win32con", "win32api", "pywintypes", "pythoncom", "win32com.*", "winrt.*", "webview.*", "openai.*", "anthropic.*", "boto3.*", "botocore.*", "apscheduler.*", "opentelemetry.*", "mcp.*", "wasmtime", "wasmtime.*"]
ignore_missing_imports = true
