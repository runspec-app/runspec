[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runspec-jira-core"
version = "0.7.0"
requires-python = ">=3.10"
description = "Pure-Python Jira + Service Desk helpers (over atlassian-python-api) — the importable core behind runspec-jira (no runspec dependency, no runnables)"
dependencies = [
    "atlassian-python-api>=3.41",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.20",
    "mypy",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"

# `deprecated` (pulled in by atlassian-python-api) ships a py.typed marker and
# Python 3.12-only syntax (`type X = …`), which mypy can't parse under
# python_version = "3.10". We never call it — don't analyse it.
[[tool.mypy.overrides]]
module = ["deprecated", "deprecated.*"]
follow_imports = "skip"

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
