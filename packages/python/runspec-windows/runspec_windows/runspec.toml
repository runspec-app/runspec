[config]
autonomy-default = "autonomous"

[config.logging]
# Per-invocation log files: one {runnable}.{utc-ts}.{run_id}.log per run.
# Multi-writer safe for shared venvs — no in-process rotation (use
# `runspec logs` to view/compact/prune). rotate/keep are inert under per-run.
store = "per-run"

# ── System monitoring ─────────────────────────────────────────────────────────

[system-info]
serve       = ["local"]
description = "Report hostname, OS edition and build, architecture, and uptime"
autonomy    = "autonomous"
output      = "json"

[disk-usage]
serve       = ["local"]
description = "Report free/used space for all local drives or a single path"
autonomy    = "autonomous"
output      = "json"

[disk-usage.args.path]
type        = "str"
short       = "-p"
description = "A specific drive or path to report (default: all local drives)"
required    = false

[check-memory]
serve       = ["local"]
description = "Report physical RAM and page-file usage in megabytes"
autonomy    = "autonomous"
output      = "json"

[uptime]
serve       = ["local"]
description = "Report system boot time and uptime in seconds"
autonomy    = "autonomous"
output      = "json"

# ── Processes ─────────────────────────────────────────────────────────────────

[list-processes]
serve       = ["local"]
description = "List running processes, optionally filtered by image name"
autonomy    = "autonomous"
output      = "json"

[list-processes.args.filter]
type        = "str"
short       = "-f"
description = "Only include processes whose image name contains this string"
required    = false

[list-processes.args.limit]
type        = "int"
short       = "-n"
description = "Maximum number of processes to return"
default     = 25

[process-info]
serve       = ["local"]
description = "Show details for a single process by PID"
autonomy    = "autonomous"
output      = "json"

[process-info.args.pid]
type        = "int"
description = "Process ID to look up"

[kill-process]
serve       = ["local"]
description = "Terminate a process by PID (taskkill /F)"
autonomy    = "confirm"
output      = "json"

[kill-process.args.pid]
type        = "int"
description = "Process ID to terminate"

# ── Services ──────────────────────────────────────────────────────────────────

[list-services]
serve       = ["local"]
description = "List Windows services and their status, optionally filtered by status"
autonomy    = "autonomous"
output      = "json"

[list-services.args.status]
type        = "choice"
options     = ["all", "running", "stopped"]
default     = "all"
description = "Filter services by status"

[check-service]
serve       = ["local"]
description = "Report the status and start type of a single Windows service"
autonomy    = "autonomous"
output      = "json"

[check-service.args.service]
type        = "str"
short       = "-s"
description = "Service name (e.g. Spooler or wuauserv)"

[restart-service]
serve       = ["local"]
description = "Restart a Windows service"
autonomy    = "confirm"
output      = "json"

[restart-service.args.service]
type        = "str"
short       = "-s"
description = "Service name to restart"

[stop-service]
serve       = ["local"]
description = "Stop a Windows service"
autonomy    = "confirm"
output      = "json"

[stop-service.args.service]
type        = "str"
short       = "-s"
description = "Service name to stop"

# ── Network ───────────────────────────────────────────────────────────────────

[ping-host]
serve       = ["local"]
description = "Ping a host and report reachability and packet loss"
autonomy    = "autonomous"
output      = "json"

[ping-host.args.host]
type        = "str"
short       = "-H"
description = "Hostname or IP address to ping"

[ping-host.args.count]
type        = "int"
short       = "-c"
description = "Number of echo requests to send"
default     = 4

[check-port]
serve       = ["local"]
description = "Check whether a TCP port is open on a host"
autonomy    = "autonomous"
output      = "json"

[check-port.args.host]
type        = "str"
short       = "-H"
description = "Hostname or IP address"

[check-port.args.port]
type        = "int"
short       = "-p"
description = "TCP port number"

[check-port.args.timeout]
type        = "float"
description = "Connection timeout in seconds"
default     = 3.0

[show-connections]
serve       = ["local"]
description = "Show active TCP connections and listening ports (netstat -ano)"
autonomy    = "autonomous"
output      = "json"

[show-connections.args.state]
type        = "choice"
options     = ["all", "established", "listening"]
default     = "all"
description = "Filter connections by state"

[list-adapters]
serve       = ["local"]
description = "List network adapters with their IPv4 addresses (ipconfig /all)"
autonomy    = "autonomous"
output      = "json"

[flush-dns]
serve       = ["local"]
description = "Flush the Windows DNS resolver cache"
autonomy    = "confirm"
output      = "json"

# ── Event log ─────────────────────────────────────────────────────────────────

[query-eventlog]
serve       = ["local"]
description = "Query a Windows event log (System/Application/Security) for recent entries"
autonomy    = "autonomous"
output      = "json"

[query-eventlog.args.log]
type        = "choice"
options     = ["System", "Application", "Security"]
default     = "System"
description = "Event log name to query"

[query-eventlog.args.level]
type        = "choice"
options     = ["all", "critical", "error", "warning", "information"]
default     = "all"
description = "Minimum severity to include"

[query-eventlog.args.count]
type        = "int"
short       = "-n"
description = "Maximum number of events to return"
default     = 20

[recent-errors]
serve       = ["local"]
description = "Show recent error and critical events from the System and Application logs"
autonomy    = "autonomous"
output      = "json"

[recent-errors.args.count]
type        = "int"
short       = "-n"
description = "Maximum number of events to return per log"
default     = 20

# ── Scheduled tasks ───────────────────────────────────────────────────────────

[list-scheduled-tasks]
serve       = ["local"]
description = "List Windows scheduled tasks and their state (schtasks)"
autonomy    = "autonomous"
output      = "json"

[list-scheduled-tasks.args.filter]
type        = "str"
short       = "-f"
description = "Only include tasks whose name contains this string"
required    = false

# ── Installed software ────────────────────────────────────────────────────────

[installed-software]
serve       = ["local"]
description = "List installed software from the registry uninstall keys"
autonomy    = "autonomous"
output      = "json"

[installed-software.args.filter]
type        = "str"
short       = "-f"
description = "Only include entries whose display name contains this string"
required    = false

# ── Sessions ──────────────────────────────────────────────────────────────────

[who]
serve       = ["local"]
description = "List interactive logon sessions on this machine (query user)"
autonomy    = "autonomous"
output      = "json"

[current-user]
serve       = ["local"]
description = "Report the current user, domain, and computer name"
autonomy    = "autonomous"
output      = "json"

# ── Microsoft Graph — account ─────────────────────────────────────────────────

[graph-login]
serve       = ["local"]
description = "Sign in to Microsoft 365 via device-code flow and cache the token"
autonomy    = "confirm"
output      = "json"

[graph-whoami]
serve       = ["local"]
description = "Report the signed-in Microsoft 365 user (Graph /me)"
autonomy    = "autonomous"
output      = "json"

# ── Microsoft Graph — Outlook ─────────────────────────────────────────────────

[outlook-unread]
serve       = ["local"]
description = "List unread Outlook messages from the inbox via Microsoft Graph"
autonomy    = "autonomous"
output      = "json"

[outlook-unread.args.count]
type        = "int"
short       = "-n"
description = "Maximum number of messages to return"
default     = 20

[outlook-search]
serve       = ["local"]
description = "Search Outlook messages by free-text query via Microsoft Graph"
autonomy    = "autonomous"
output      = "json"

[outlook-search.args.query]
type        = "str"
short       = "-q"
description = "Search terms (matched across subject, body, and sender)"

[outlook-search.args.count]
type        = "int"
short       = "-n"
description = "Maximum number of messages to return"
default     = 20

[outlook-folders]
serve       = ["local"]
description = "List Outlook mail folders with unread/total counts via Microsoft Graph"
autonomy    = "autonomous"
output      = "json"

# ── Microsoft Graph — Calendar ────────────────────────────────────────────────

[calendar-upcoming]
serve       = ["local"]
description = "List upcoming calendar events over the next N days via Microsoft Graph"
autonomy    = "autonomous"
output      = "json"

[calendar-upcoming.args.days]
type        = "int"
short       = "-d"
description = "Look-ahead window in days"
default     = 7

[calendar-upcoming.args.count]
type        = "int"
short       = "-n"
description = "Maximum number of events to return"
default     = 20

[calendar-today]
serve       = ["local"]
description = "List today's calendar events via Microsoft Graph"
autonomy    = "autonomous"
output      = "json"

[next-meeting]
serve       = ["local"]
description = "Show the next upcoming calendar event via Microsoft Graph"
autonomy    = "autonomous"
output      = "json"

# ── Microsoft Graph — OneDrive / Files ────────────────────────────────────────

[onedrive-recent]
serve       = ["local"]
description = "List recently used OneDrive/SharePoint files via Microsoft Graph"
autonomy    = "autonomous"
output      = "json"

[onedrive-recent.args.count]
type        = "int"
short       = "-n"
description = "Maximum number of files to return"
default     = 20

[onedrive-search]
serve       = ["local"]
description = "Search OneDrive/SharePoint files by name or content via Microsoft Graph"
autonomy    = "autonomous"
output      = "json"

[onedrive-search.args.query]
type        = "str"
short       = "-q"
description = "Search text"

[onedrive-search.args.count]
type        = "int"
short       = "-n"
description = "Maximum number of results to return"
default     = 20

[onedrive-list]
serve       = ["local"]
description = "List the contents of a OneDrive folder via Microsoft Graph"
autonomy    = "autonomous"
output      = "json"

[onedrive-list.args.path]
type        = "str"
short       = "-p"
description = "Folder path relative to the drive root (default: root)"
default     = "/"

# ── Microsoft Graph — Teams ───────────────────────────────────────────────────

[teams-list-chats]
serve       = ["local"]
description = "List the signed-in user's Teams chats via Microsoft Graph"
autonomy    = "autonomous"
output      = "json"

[teams-list-chats.args.count]
type        = "int"
short       = "-n"
description = "Maximum number of chats to return"
default     = 20

[teams-read-chat]
serve       = ["local"]
description = "Read recent messages from a Teams chat via Microsoft Graph"
autonomy    = "autonomous"
output      = "json"

[teams-read-chat.args.chat-id]
type        = "str"
description = "Chat id (from teams-list-chats)"

[teams-read-chat.args.count]
type        = "int"
short       = "-n"
description = "Maximum number of messages to return"
default     = 20

# ── Commands (cross-platform) ─────────────────────────────────────────────────

[which]
serve       = ["local"]
description = "Locate a command on the PATH and return its full path (like `which`/`where`) — handy for finding interpreter/binary paths to feed other runnables"
autonomy    = "autonomous"
output      = "json"

examples = [
  {cmd = "which python",            description = "Resolve a command to its full path"},
  {cmd = "which \"python pip git\"", description = "Resolve several commands at once (space-separated)"},
  {cmd = "which python --all",      description = "Show every match on the PATH, not just the first"},
]

[which.args.name]
type        = "str"
position    = 1
description = "Command name(s) to locate on the PATH (space-separated for several)"

[which.args.all]
type        = "flag"
short       = "-a"
description = "Return every match found on the PATH, not just the first"
default     = false

[which.args.path]
type        = "str"
description = "Override the search PATH to use (defaults to the host's %PATH%)"
required    = false

# ── Web / TLS probes (runspec-webops-core; cross-platform, read-only) ──────────

[cert-check]
serve       = ["local"]
description = "Inspect a host's TLS certificate — days-to-expiry, issuer, SANs, fingerprint, trust"
autonomy    = "autonomous"
output      = "json"

[cert-check.args.host]
type        = "str"
position    = 1
description = "Hostname to connect to"

[cert-check.args.port]
type        = "int"
short       = "-p"
description = "TLS port"
default     = 443

[cert-check.args.warn-days]
type        = "int"
short       = "-w"
description = "Report 'expiring' when fewer than N days remain"
default     = 30

[cert-check.args.timeout]
type        = "int"
short       = "-t"
description = "Connection timeout in seconds"
default     = 10

[cert-chain]
serve       = ["local"]
description = "Show the full TLS certificate chain (leaf -> intermediates -> root)"
autonomy    = "autonomous"
output      = "json"

[cert-chain.args.host]
type        = "str"
position    = 1
description = "Hostname to connect to"

[cert-chain.args.port]
type        = "int"
short       = "-p"
description = "TLS port"
default     = 443

[cert-chain.args.timeout]
type        = "int"
short       = "-t"
description = "Connection timeout in seconds"
default     = 10

[tls-info]
serve       = ["local"]
description = "Report the negotiated TLS protocol, cipher, and trust result for a host"
autonomy    = "autonomous"
output      = "json"

[tls-info.args.host]
type        = "str"
position    = 1
description = "Hostname to connect to"

[tls-info.args.port]
type        = "int"
short       = "-p"
description = "TLS port"
default     = 443

[tls-info.args.timeout]
type        = "int"
short       = "-t"
description = "Connection timeout in seconds"
default     = 10

[http-check]
serve       = ["local"]
description = "Probe an HTTP(S) URL — status code, response time, redirect target"
autonomy    = "autonomous"
output      = "json"

[http-check.args.url]
type        = "str"
position    = 1
description = "URL to request"

[http-check.args.timeout]
type        = "int"
short       = "-t"
description = "Request timeout in seconds"
default     = 10

[http-check.args.expect-status]
type        = "int"
short       = "-e"
description = "Exit non-zero unless the response status matches this code"
required    = false

[http-check.args.insecure]
type        = "flag"
short       = "-k"
description = "Skip TLS certificate verification"
default     = false

[http-headers]
serve       = ["local"]
description = "Fetch an endpoint's response headers and flag missing security headers"
autonomy    = "autonomous"
output      = "json"

[http-headers.args.url]
type        = "str"
position    = 1
description = "URL to request"

[http-headers.args.method]
type        = "choice"
options     = ["HEAD", "GET"]
short       = "-m"
description = "HTTP method to use for the header probe"
default     = "HEAD"

[http-headers.args.timeout]
type        = "int"
short       = "-t"
description = "Request timeout in seconds"
default     = 10

[http-headers.args.insecure]
type        = "flag"
short       = "-k"
description = "Skip TLS certificate verification"
default     = false

[redirect-trace]
serve       = ["local"]
description = "Follow an HTTP redirect chain and list each hop with status and Location"
autonomy    = "autonomous"
output      = "json"

[redirect-trace.args.url]
type        = "str"
position    = 1
description = "URL to start from"

[redirect-trace.args.timeout]
type        = "int"
short       = "-t"
description = "Per-request timeout in seconds"
default     = 10

[redirect-trace.args.max-hops]
type        = "int"
short       = "-n"
description = "Maximum number of redirects to follow"
default     = 10

[redirect-trace.args.insecure]
type        = "flag"
short       = "-k"
description = "Skip TLS certificate verification"
default     = false

[dns-lookup]
serve       = ["local"]
description = "Resolve a hostname (A/AAAA + canonical name), or reverse-resolve an IP"
autonomy    = "autonomous"
output      = "json"

[dns-lookup.args.host]
type        = "str"
position    = 1
description = "Hostname to resolve, or an IP address to reverse-resolve"

[dns-lookup.args.reverse]
type        = "flag"
short       = "-r"
description = "Also reverse-resolve (PTR) each resolved address"
default     = false

[api-spec]
serve       = ["local"]
description = "Summarise an OpenAPI/Swagger spec (URL or file) — operations, params, schemas — to help write/update runnables for an API"
autonomy    = "autonomous"
output      = "json"

examples = [
  {cmd = "api-spec https://api.internal/openapi.json",                       description = "Overview: info, servers, and every operation"},
  {cmd = "api-spec https://api.internal/openapi.json --tag orders",          description = "Only operations tagged 'orders'"},
  {cmd = "api-spec ./openapi.json --operation createOrder",                  description = "Full detail for one operation (params, body, responses)"},
  {cmd = "api-spec ./openapi.json --path /orders --method post",            description = "Drill into an operation by path + method"},
]

[api-spec.args.source]
type        = "str"
position    = 1
description = "OpenAPI/Swagger spec — an http(s) URL or a local file path (JSON always; YAML needs the pyyaml extra)"

[api-spec.args.operation]
type        = "str"
short       = "-o"
description = "operationId to describe in full (params, request body, responses)"
required    = false

[api-spec.args.path]
type        = "str"
description = "API path to describe in full (pair with --method); alternative to --operation"
required    = false

[api-spec.args.method]
type        = "str"
short       = "-X"
description = "HTTP method for --path (e.g. get, post)"
required    = false

[api-spec.args.tag]
type        = "str"
description = "Overview only: limit to operations carrying this tag"
required    = false

[api-spec.args.match]
type        = "str"
description = "Overview only: limit to operations whose path contains this substring"
required    = false

[api-spec.args.timeout]
type        = "int"
short       = "-t"
description = "Fetch timeout in seconds (URL sources)"
default     = 15

[api-spec.args.insecure]
type        = "flag"
short       = "-k"
description = "Skip TLS certificate verification when fetching the spec"
default     = false
