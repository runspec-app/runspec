[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runspec-windows"
version = "0.10.1"
requires-python = ">=3.10"
description = "Windows system admin + cross-platform web/TLS/API runnables for runspec"
readme = "README.md"
keywords = ["runspec", "runnable", "windows", "sysadmin", "ops", "tls"]
dependencies = [
    "runspec>=0.44.0",
    "runspec-webops-core>=0.3.0",
    "runspec-fs-core>=0.5.0",
]

[project.urls]
Documentation = "https://runspec.app/"
Source        = "https://github.com/jasonfinestone/runspec/tree/main/packages/python/runspec-windows"
Changelog     = "https://github.com/jasonfinestone/runspec/blob/main/packages/python/runspec-windows/CHANGELOG.md"
Issues        = "https://github.com/jasonfinestone/runspec/issues"

[project.optional-dependencies]
# Microsoft 365 / Graph runnables moved to the standalone `runspec-o365` package
# in 0.5.0 (so a console/fleet without Graph access doesn't carry them). The old
# `[graph]` extra no longer exists — `pip install runspec-o365` for those.
dev = [
    "ruff==0.15.20",
    "mypy",
    "pytest>=8.0",
]

[project.scripts]
# System monitoring
system-info          = "runspec_windows.system_info:main_system_info"
disk-usage           = "runspec_windows.system_info:main_disk_usage"
check-memory         = "runspec_windows.system_info:main_check_memory"
uptime               = "runspec_windows.system_info:main_uptime"
# Processes
list-processes       = "runspec_windows.processes:main_list_processes"
process-info         = "runspec_windows.processes:main_process_info"
kill-process         = "runspec_windows.processes:main_kill_process"
# Services
list-services        = "runspec_windows.services:main_list_services"
check-service        = "runspec_windows.services:main_check_service"
restart-service      = "runspec_windows.services:main_restart_service"
stop-service         = "runspec_windows.services:main_stop_service"
# Network
ping-host            = "runspec_windows.network:main_ping_host"
check-port           = "runspec_windows.network:main_check_port"
show-connections     = "runspec_windows.network:main_show_connections"
list-adapters        = "runspec_windows.network:main_list_adapters"
flush-dns            = "runspec_windows.network:main_flush_dns"
# Event log
query-eventlog       = "runspec_windows.eventlog:main_query_eventlog"
recent-errors        = "runspec_windows.eventlog:main_recent_errors"
# Scheduled tasks
list-scheduled-tasks = "runspec_windows.tasks:main_list_scheduled_tasks"
# Installed software
installed-software   = "runspec_windows.software:main_installed_software"
# Sessions
who                  = "runspec_windows.sessions:main_who"
current-user         = "runspec_windows.sessions:main_current_user"
# Commands
which                = "runspec_windows.commands:main_which"
# Corporate networking diagnostics (proxy / VPN / DNS / route / GPO / certs)
proxy-settings       = "runspec_windows.netdiag:main_proxy_settings"
vpn-status           = "runspec_windows.netdiag:main_vpn_status"
dns-config           = "runspec_windows.netdiag:main_dns_config"
test-connection      = "runspec_windows.netdiag:main_test_connection"
trace-route          = "runspec_windows.netdiag:main_trace_route"
route-table          = "runspec_windows.netdiag:main_route_table"
gpresult             = "runspec_windows.netdiag:main_gpresult"
list-certs           = "runspec_windows.netdiag:main_list_certs"
collect-diagnostics  = "runspec_windows.diagnostics:main_collect_diagnostics"
# Filesystem (folded from runspec-fs; backed by runspec-fs-core)
filesystem           = "runspec_windows.fs.cli:main"
# Web / TLS probes (runspec-webops-core; cross-platform)
cert-check           = "runspec_windows.webops:main_cert_check"
cert-chain           = "runspec_windows.webops:main_cert_chain"
tls-info             = "runspec_windows.webops:main_tls_info"
http-check           = "runspec_windows.webops:main_http_check"
http-headers         = "runspec_windows.webops:main_http_headers"
redirect-trace       = "runspec_windows.webops:main_redirect_trace"
dns-lookup           = "runspec_windows.webops:main_dns_lookup"
api-spec             = "runspec_windows.webops:main_api_spec"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
