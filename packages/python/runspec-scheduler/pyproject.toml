[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runspec-scheduler"
version = "0.10.2"
requires-python = ">=3.10"
description = "Cron-style scheduler service for runspec runnables installed in one venv"
keywords = ["runspec", "runnable", "scheduler", "cron"]
readme = "README.md"
license = "MIT"
dependencies = [
    # 0.82.0 for `runspec exec --env-file` (the venv's schedule-only env file).
    "runspec>=0.82.0",
    # APScheduler drives the cron/interval timing. This package's whole reason to
    # exist is scheduling, so it's a hard dependency (unlike runspec-console, which
    # keeps it optional under the [schedule] extra).
    "apscheduler>=3.10,<4",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Documentation = "https://runspec.app/"
Source        = "https://github.com/runspec-app/runspec/tree/main/packages/python/runspec-scheduler"
Changelog     = "https://github.com/runspec-app/runspec/blob/main/packages/python/runspec-scheduler/CHANGELOG.md"
Issues        = "https://github.com/runspec-app/runspec/issues"

[project.scripts]
# Entry point name MUST match the runnable name in runspec.toml.
runspec-scheduler = "runspec_scheduler.cli:main"

[project.optional-dependencies]
# supervisord inside the venv, for `install-service --manager supervisor`
# (a keeper with no root and no systemd --user).
supervisor = ["supervisor>=4.2"]
dev = [
    "ruff==0.15.20",
    "mypy",
    "pytest>=8.0",
    # the real-supervisord keeper test
    "supervisor>=4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "process: runs the daemon as a real background process (deselect with -m 'not process')",
    "packages: use the real scan of installed packages' schedules",
]

[tool.mypy]
python_version = "3.10"

[[tool.mypy.overrides]]
# APScheduler ships no type stubs; tomli is the 3.10-only TOML reader.
module = ["apscheduler.*", "tomli"]
ignore_missing_imports = true

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
