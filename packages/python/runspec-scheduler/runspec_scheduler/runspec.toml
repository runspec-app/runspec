#:schema https://runspec.app/runspec.schema.json

# runspec-scheduler — a cron-style scheduler *service* for runspec runnables.
#
# A single runnable, `runspec-scheduler`, with verbs (subcommands):
#
#   runspec-scheduler sync                    render the config into the OS crontab (recommended backend)
#   runspec-scheduler add     --id … …        add/replace a scheduled runnable in the config
#   runspec-scheduler remove  --id …          remove a schedule from the config
#   runspec-scheduler list                    print the configured schedules as JSON
#   runspec-scheduler status                  config + crontab + recent runs/output per schedule (JSON)
#   runspec-scheduler run-now --id …          fire one schedule immediately
#   runspec-scheduler run                     run the long-running daemon (legacy; being replaced by `sync`)
#   runspec-scheduler install-service         write + enable the per-venv systemd --user unit (legacy)
#
# The **cron backend** (`sync`) is the v1 shared-scheduler execution model
# (docs/design/cron-scheduler.md): each enabled cron schedule becomes a marked
# line in its run_as account's crontab, so the OS cron runs it — no daemon of
# ours. `add`/`remove` edit the config; `sync` applies it to the crontab. The
# `run` daemon + `install-service` remain for now and will be removed once the
# cron backend is validated in the wild.
#
# It is "cron, but limited to runnables installed in THIS venv". The daemon runs
# runnables from its own venv on a cron/interval cadence, independent of any
# desktop console. It is itself a runspec runnable (so runspec-console can detect
# and drive it over SSH), but `discoverable = false` keeps it out of the Forms
# tab / `runspec serve` MCP surface — it's an internal control-plane helper.

[config]
# Scheduling a runnable IS the authorization; the daemon fires non-interactively.
# The management verbs are deliberate admin actions (invoked by the operator or
# by runspec-console over SSH), so they default to autonomous too.
autonomy-default = "autonomous"

[runspec-scheduler]
description     = "Cron-style scheduler for runnables installed in this venv (long-running --user service)"
require-command = true
# Hidden from the Forms tab / `runspec serve`, but still runnable directly AND
# still listed by `runspec local --format json`, so the console can detect it.
discoverable    = false

examples = [
  {cmd = "runspec-scheduler add --id nightly-backup --runnable backup --cron '0 2 * * *'", description = "Add /backup at 02:00 to the config."},
  {cmd = "runspec-scheduler add --id tmp-usage --runnable filesystem --command directory-size --args '{\"path\": \"/tmp\"}' --cron '0 * * * *'", description = "Schedule a runnable's subcommand (verb) hourly."},
  {cmd = "runspec-scheduler sync", description = "Render the config's cron schedules into the OS crontab (the recommended backend)."},
  {cmd = "runspec-scheduler sync --dry-run", description = "Preview the crontab changes without writing."},
  {cmd = "runspec-scheduler list", description = "Print configured schedules as JSON."},
  {cmd = "runspec-scheduler status", description = "Per schedule: installed?, recent runs, last run's captured output (JSON)."},
  {cmd = "runspec-scheduler run", description = "Run the legacy daemon in the foreground (systemd ExecStart)."},
]

# ---- Global arguments (inherited by every subcommand) --------------------
[runspec-scheduler.args]
config = {type = "path", required = false, description = "Path to the scheduler config TOML. Overrides $RUNSPEC_SCHEDULER_CONFIG and the default {venv}/runspec_scheduler.toml."}

# ---- run: the long-running daemon ----------------------------------------
[runspec-scheduler.commands.run]
description = "Run the scheduler daemon: load config, build cron/interval jobs, exec runnables on fire. Hot-reloads on config change. This is the systemd ExecStart."

[runspec-scheduler.commands.run.args]
reload-interval = {type = "int", default = 5, description = "Seconds between config-file mtime checks for hot reload."}

# ---- add: add or replace a schedule --------------------------------------
[runspec-scheduler.commands.add]
description = "Add or replace a schedule (keyed by --id), then hot-reload the daemon"

[runspec-scheduler.commands.add.args]
id       = {type = "str",  required = true,  description = "Stable schedule id (the replace-in-place key)."}
runnable = {type = "str",  required = true,  description = "Name of a runnable installed in THIS venv to run on fire."}
command  = {type = "str",  required = false, description = "Subcommand path for a runnable with verbs, e.g. 'list-directory' or 'admin users' (space-separated). Required when the runnable requires a command; validated against its spec."}
cron     = {type = "str",  required = false, description = "5-field cron expression, e.g. '0 2 * * *'. Exactly one of --cron / --every."}
every    = {type = "str",  required = false, description = "Interval like 15m / 1h / 1d (number + s/m/h/d). Exactly one of --cron / --every."}
timezone = {type = "str",  required = false, description = "IANA timezone (e.g. Europe/London). Blank = host local time."}
args     = {type = "str",  required = false, description = "JSON object of arguments passed to the target runnable, e.g. '{\"level\":\"warn\"}'."}
enabled  = {type = "flag", default = true,  description = "Whether the schedule fires (add it paused with --no-enabled)."}
cred-vars = {type = "str", required = false, description = "JSON array of environment-variable NAMES to capture (from this process's env) into the schedule's run_as-protected env file. Values are injected by the caller; only names travel here."}

# ---- remove: delete a schedule -------------------------------------------
[runspec-scheduler.commands.remove]
description = "Remove a schedule by id (and its credential env file), then hot-reload"

[runspec-scheduler.commands.remove.args]
id = {type = "str", required = true, description = "Schedule id to remove."}

# ---- list: print schedules as JSON ---------------------------------------
[runspec-scheduler.commands.list]
description = "Print the configured schedules as JSON (read-only; what runspec-console reads to display + verify remote schedules)"
output      = "json"

# ---- status: config + crontab + runs index, joined per schedule -----------
[runspec-scheduler.commands.status]
description = "Per schedule: config, whether its crontab line is installed (exec vs legacy), its recent runs from the runs index (label sched:<id>), and the last run's captured output — JSON (read-only; what runspec-console's Shared schedules view reads)"
output      = "json"

[runspec-scheduler.commands.status.args]
runs = {type = "int", default = 5, description = "Recent runs to include per schedule."}

# ---- run-now: fire one schedule immediately ------------------------------
[runspec-scheduler.commands.run-now]
description = "Fire one schedule immediately by id (ignores enabled state), through `runspec exec` so it's recorded under the schedule's label"
output      = "json"

[runspec-scheduler.commands.run-now.args]
id = {type = "str", required = true, description = "Schedule id to fire now."}

# ---- sync: render the config into the OS crontab (recommended backend) ----
[runspec-scheduler.commands.sync]
description = "Reconcile the OS crontab to match the config's enabled cron schedules — each becomes a marked line in its run_as account's crontab (no daemon). Skips interval ('every'), disabled, and not-installed schedules."
output      = "json"

[runspec-scheduler.commands.sync.args]
dry-run = {type = "flag", default = false, description = "Report what would change without writing any crontab."}

# ---- install-service: systemd --user unit --------------------------------
[runspec-scheduler.commands.install-service]
description = "Write the per-venv systemd --user unit (runspec-scheduler-<venv>.service) and enable it"
autonomy    = "confirm"

[runspec-scheduler.commands.install-service.args]
enable = {type = "flag", default = true, description = "Run `systemctl --user enable --now` after writing the unit."}
