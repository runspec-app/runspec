#:schema https://runspec.app/runspec.schema.json

# runspec-scheduler — a cron-style scheduler *service* for runspec runnables.
#
# A single runnable, `runspec-scheduler`, with verbs (subcommands):
#
#   runspec-scheduler use cron|daemon         choose what fires this venv's schedules (one backend per venv)
#   runspec-scheduler settings [--timeout …]  show / change the daemon's [scheduler] durations
#   runspec-scheduler restart                 restart the daemon through its keeper (after an upgrade)
#   runspec-scheduler sync                    render the config into the OS crontab (the cron backend)
#   runspec-scheduler add     --id … …        add/replace a scheduled runnable in the config
#   runspec-scheduler remove  --id …          remove a schedule from the config
#   runspec-scheduler enable / disable --id … turn a schedule on or off (incl. ones packages offer)
#   runspec-scheduler list                    print the configured schedules
#   runspec-scheduler status                  config + crontab + recent runs/output per schedule
#   runspec-scheduler watch                   status kept on screen, redrawn every few seconds
#   runspec-scheduler run-now --id … [--detach] fire one schedule immediately
#   runspec-scheduler run                     run the daemon (the daemon backend) in the foreground
#   runspec-scheduler install-service         plan (or --write) what keeps the daemon running
#   runspec-scheduler hooks list|test|save|… webhooks: apps POST here, runnables run (see [hooks] below)
#
# Webhooks, for example:
#   runspec-scheduler hooks settings --set enabled=true --set port=8977
#   runspec-scheduler hooks save --new-token < alerts.toml   # prints the token once
#   runspec-scheduler hooks test --hook alerts < sample.json  # dry run, nothing runs
#   runspec-scheduler hooks approve --id 42 --note "checked the disk"
#
# Two backends, one per venv ([scheduler] backend in the config, switched with
# `use`), both running every fire through `runspec exec --label sched:<id>`:
#   cron   (default) each enabled cron schedule is a marked line in its run_as
#          account's crontab (docs/design/cron-scheduler.md); `sync` writes them.
#   daemon `runspec-scheduler run`, one process per venv as the venv owner, kept
#          alive by a keeper (install-service: systemd, supervisord or a cron
#          watchdog). Adds `every`
#          intervals, catch-up and a fire timeout (docs/design/venv-scheduler.md).
#
# It is "cron, but limited to runnables installed in THIS venv". The daemon runs
# runnables from its own venv on a cron/interval cadence, independent of any
# desktop console. It is itself a runspec runnable (so runspec-console can detect
# and drive it over SSH), but `discoverable = false` keeps it out of the Forms
# tab / `runspec serve` MCP surface — it's an internal control-plane helper.
#
# Package schedules: a runnable can declare schedules in its own runspec.toml
# ([<runnable>.meta.scheduler.<name>], id <runnable>.<name>). The venv's
# [scheduler] package_schedules says what happens to them: offer (default:
# listed, off until enabled), auto (on when installed) or off (ignored).
#
# Output: text when a person runs a verb in a terminal, JSON otherwise (pipes,
# scripts, runspec-console over SSH). --json gives JSON at a terminal too.

[config]
# Scheduling a runnable IS the authorization; the daemon fires non-interactively.
# The management verbs are deliberate admin actions (invoked by the operator or
# by runspec-console over SSH), so they default to autonomous too.
autonomy-default = "autonomous"

[runspec-scheduler]
description     = "Cron-style scheduler for runnables installed in this venv (long-running --user service)"
require-command = true
# Hidden from the Forms tab / `runspec serve`, but still runnable directly AND
# still listed by `runspec local --format json`, so the console can detect it.
discoverable    = false

examples = [
  {cmd = "runspec-scheduler add --id nightly-backup --runnable backup --cron '0 2 * * *'", description = "Add /backup at 02:00 to the config."},
  {cmd = "runspec-scheduler add --id tmp-usage --runnable filesystem --command directory-size --args '{\"path\": \"/tmp\"}' --cron '0 * * * *'", description = "Schedule a runnable's subcommand (verb) hourly."},
  {cmd = "runspec-scheduler sync", description = "Render the config's cron schedules into the OS crontab (the recommended backend)."},
  {cmd = "runspec-scheduler sync --dry-run", description = "Preview the crontab changes without writing."},
  {cmd = "runspec-scheduler list", description = "Print the configured schedules."},
  {cmd = "runspec-scheduler status", description = "Per schedule: installed?, next and last run, whether it is failing and who is on it."},
  {cmd = "runspec-scheduler watch", description = "Keep the status on screen, redrawn every 5 seconds (Ctrl+C to stop)."},
  {cmd = "runspec-scheduler status --json", description = "The full status as JSON, also at a terminal (what runspec-console reads)."},
  {cmd = "runspec-scheduler use daemon", description = "Fire this venv's schedules from the daemon instead of cron (removes the crontab lines)."},
  {cmd = "runspec-scheduler add --id poll --runnable http-check --every 30s --args '{\"url\": \"https://example.com\"}'", description = "An interval schedule (daemon backend only)."},
  {cmd = "runspec-scheduler run", description = "Run the daemon in the foreground (what a keeper starts)."},
  {cmd = "runspec-scheduler install-service", description = "Show which keeper suits this host and what installing it would change."},
  {cmd = "runspec-scheduler install-service --write", description = "Install that keeper and start the daemon."},
  {cmd = "runspec-scheduler restart", description = "Restart the daemon through its keeper (after upgrading runspec-scheduler)."},
  {cmd = "runspec-scheduler run-now --id nightly-backup --detach", description = "Fire a schedule now in the background, as a scheduled fire would run (recorded under sched:nightly-backup)."},
  {cmd = "runspec-scheduler settings --timeout 2h", description = "Kill a daemon fire still running after 2 hours (the daemon reloads by itself)."},
  {cmd = "runspec-scheduler install-service --remove --write", description = "Remove this venv's keepers and stop the daemon (before deleting the venv)."},
  {cmd = "runspec-scheduler enable --id cleanup-tmp.nightly", description = "Turn on a schedule an installed package offers (status lists them)."},
  {cmd = "runspec-scheduler disable --id nightly-backup", description = "Pause a schedule (or hide one a package offers)."},
  {cmd = "runspec-scheduler settings --timezone Australia/Sydney", description = "Fire schedules with no zone of their own on Sydney time, whatever the host's clock says."},
  {cmd = "runspec-scheduler settings --package-schedules auto", description = "Turn on the schedules packages declare as soon as they're installed."},
]

# ---- Global arguments (inherited by every subcommand) --------------------
[runspec-scheduler.args]
config = {type = "path", required = false, description = "Path to the scheduler config TOML. Overrides $RUNSPEC_SCHEDULER_CONFIG and the default {venv}/runspec_scheduler.toml."}
json   = {type = "flag", default = false, description = "Print JSON even at a terminal. Without it a verb prints text when stdout is a terminal and JSON otherwise."}

# ---- run: the long-running daemon ----------------------------------------
[runspec-scheduler.commands.run]
description = "Run the scheduler daemon for this venv in the foreground: one process per venv (a second start exits 0), firing every schedule through `runspec exec` when the backend is daemon. Reloads on config change or SIGHUP; writes a heartbeat to logs/scheduler_state.json. This is what a keeper (systemd, supervisord, cron) starts."

[runspec-scheduler.commands.run.args]
reload-interval = {type = "int", default = 5, description = "Seconds between heartbeats (logs/scheduler_state.json). The config is checked for changes every second."}
detach          = {type = "flag", default = false, description = "Start the daemon in the background and return (output to logs/scheduler.stdout.log). Exits 0 straight away when it is already running, so a crontab watchdog can run it every few minutes."}

# ---- add: add or replace a schedule --------------------------------------
[runspec-scheduler.commands.add]
description = "Add or replace a schedule (keyed by --id), then hot-reload the daemon"

[runspec-scheduler.commands.add.args]
id       = {type = "str",  required = true,  description = "Stable schedule id (the replace-in-place key)."}
runnable = {type = "str",  required = true,  description = "Name of a runnable installed in THIS venv to run on fire."}
command  = {type = "str",  required = false, description = "Subcommand path for a runnable with verbs, e.g. 'list-directory' or 'admin users' (space-separated). Required when the runnable requires a command; validated against its spec."}
cron     = {type = "str",  required = false, description = "5-field cron expression, e.g. '0 2 * * *'. Exactly one of --cron / --every."}
every    = {type = "str",  required = false, description = "Interval like 15m / 1h / 1d (number + s/m/h/d). Exactly one of --cron / --every. Daemon backend only."}
timezone = {type = "str",  required = false, description = "IANA timezone (e.g. Europe/London). Blank = host local time."}
args     = {type = "str",  required = false, description = "JSON object of arguments passed to the target runnable, e.g. '{\"level\":\"warn\"}'."}
enabled  = {type = "flag", default = true,  description = "Whether the schedule fires (add it paused with --no-enabled)."}
timeout  = {type = "str",  required = false, description = "Kill a fire still running after this long (seconds, or 90m / 6h / 1d); 0 = no limit. Unset = the [scheduler] default (6h) on the daemon, no limit on cron."}
catch-up = {type = "flag", default = false, description = "Daemon: if fires were missed while it was down, run once on start (several missed fires collapse into one). Default: skip them, as cron does."}
cred-vars = {type = "str", required = false, description = "JSON array of environment-variable NAMES to capture (from this process's env) into the schedule's run_as-protected env file. Values are injected by the caller; only names travel here."}

# ---- remove: delete a schedule -------------------------------------------
[runspec-scheduler.commands.remove]
description = "Remove a schedule by id (and its credential env file), then hot-reload. For a schedule a package declares, this drops the venv's changes to it (turn it off with disable)."

[runspec-scheduler.commands.remove.args]
id = {type = "str", required = true, description = "Schedule id to remove."}

# ---- enable / disable: turn a schedule on or off ------------------------
[runspec-scheduler.commands.enable]
description = "Turn a schedule on: one of the config's own, or one an installed package offers (for a package schedule only `enabled` is written, so the package keeps its time). On cron, run sync afterwards."

[runspec-scheduler.commands.enable.args]
id = {type = "str", required = true, description = "Schedule id (a package schedule's is <runnable>.<name>)."}

[runspec-scheduler.commands.disable]
description = "Turn a schedule off (pause it), or hide one a package offers. On cron, run sync afterwards."

[runspec-scheduler.commands.disable.args]
id = {type = "str", required = true, description = "Schedule id (a package schedule's is <runnable>.<name>)."}

# ---- list: print schedules as JSON ---------------------------------------
[runspec-scheduler.commands.list]
description = "Print the configured schedules: a table at a terminal, JSON otherwise (read-only; what runspec-console reads to display + verify remote schedules)"
output      = "json"

# ---- status: config + crontab + runs index, joined per schedule -----------
[runspec-scheduler.commands.status]
description = "Per schedule: config, whether its crontab line is installed (exec vs legacy), its recent runs from the runs index (label sched:<id>), and the last run's captured output: text at a terminal, JSON otherwise (read-only; what runspec-console's Schedules tab reads)"
output      = "json"

[runspec-scheduler.commands.status.args]
runs = {type = "int", default = 5, description = "Recent runs to include per schedule."}

# ---- watch: status kept on screen ----------------------------------------
[runspec-scheduler.commands.watch]
description = "Keep the status on screen, redrawn every --interval seconds, until Ctrl+C. Not at a terminal (or with --json) it prints one JSON status per line instead. Never returns by itself, so only a person runs it."
autonomy    = "manual"

[runspec-scheduler.commands.watch.args]
interval = {type = "int", default = 5, description = "Seconds between redraws."}
runs     = {type = "int", default = 3, description = "Recent runs to read per schedule."}

# ---- run-now: fire one schedule immediately ------------------------------
[runspec-scheduler.commands.run-now]
description = "Fire one schedule immediately by id (ignores enabled state), through `runspec exec` so it's recorded under the schedule's label"
output      = "json"

[runspec-scheduler.commands.run-now.args]
id = {type = "str", required = true, description = "Schedule id to fire now."}
detach = {type = "flag", default = false, description = "Start the fire in the background and return at once (as the account a scheduled fire runs as: the schedule's run_as on cron, the venv owner on the daemon). Its run is in the runs index under sched:<id>."}

# ---- sync: render the config into the OS crontab (recommended backend) ----
[runspec-scheduler.commands.sync]
description = "Reconcile the OS crontab to match the config's enabled cron schedules — each becomes a marked line in its run_as account's crontab (no daemon). Skips interval ('every'), disabled, and not-installed schedules. On a daemon-backend venv it writes no lines and removes any this venv left behind."
output      = "json"

[runspec-scheduler.commands.sync.args]
dry-run = {type = "flag", default = false, description = "Report what would change without writing any crontab."}

# ---- use: choose the backend ---------------------------------------------
[runspec-scheduler.commands.use]
description = "Choose what fires this venv's schedules: cron (marked crontab lines, written now) or daemon (removes the crontab lines; `runspec-scheduler run` fires them). Never both, so nothing fires twice."
output      = "json"
autonomy    = "confirm"

[runspec-scheduler.commands.use.args]
backend = {options = ["cron", "daemon"], position = 1, description = "The backend to use."}

# ---- settings: the [scheduler] durations --------------------------------
[runspec-scheduler.commands.settings]
description = "Show this venv's [scheduler] settings (backend, timeout, misfire_grace, catch_up_window, timezone, package_schedules), or change the ones given. A running daemon reloads the change by itself; switch the backend with `use`."
output      = "json"
autonomy    = "confirm"

[runspec-scheduler.commands.settings.args]
timeout         = {type = "str", required = false, description = "Kill a daemon fire still running after this long: seconds or 90m / 6h / 1d; 0 = no limit (default 6h)."}
misfire-grace   = {type = "str", required = false, description = "A daemon fire up to this late still runs; later ones are recorded as missed (default 5m)."}
catch-up-window = {type = "str", required = false, description = "How far back a catch_up schedule looks when the daemon starts (default 24h)."}
timezone        = {type = "str", required = false, description = "The zone schedules with no zone of their own fire on (\"local\" in a package schedule), e.g. Australia/Sydney for a host whose clock runs on UTC. 'host' goes back to the host's zone. On cron a zone other than the host's needs the daemon."}
package-schedules = {options = ["offer", "auto", "off"], required = false, description = "What the schedules installed packages declare do here: offer (listed, off until enabled; default), auto (on as soon as installed) or off (ignored)."}

# ---- restart: reload the daemon's code -----------------------------------
[runspec-scheduler.commands.restart]
description = "Restart (or start) this venv's daemon through the keeper it has (systemctl --user restart, supervisorctl restart, or stop + run --detach for the cron watchdog), e.g. after upgrading runspec-scheduler. Fires already running carry on and are still recorded. Config changes never need this."
output      = "json"
autonomy    = "confirm"

[runspec-scheduler.commands.restart.args]
dry-run = {type = "flag", default = false, description = "Print what would be done; change nothing."}
wait    = {type = "int", default = 15, description = "Seconds to wait for the restarted daemon's first heartbeat."}

# ---- install-service: the keeper ----------------------------------------
[runspec-scheduler.commands.install-service]
description = "Set up what keeps this venv's daemon running: a systemd --user unit, supervisord in the venv, a crontab watchdog, or a system unit for root to install. Prints the plan (files, crontab lines, commands, steps for root); --write carries it out. --remove undoes every keeper this venv has and stops the daemon."
output      = "json"
autonomy    = "confirm"

[runspec-scheduler.commands.install-service.args]
manager = {options = ["auto", "systemd", "systemd-user", "supervisor", "cron"], default = "auto", description = "Which keeper. auto: systemd-user when lingering is on and the --user manager works, else supervisor when supervisord is in the venv, else cron. systemd is a system unit root installs (only printed)."}
write   = {type = "flag", default = false, description = "Carry the plan out. Without it nothing changes."}
remove  = {type = "flag", default = false, description = "Plan removing this venv's keepers (all of them with auto) and stopping the daemon."}
system  = {type = "flag", default = false, description = "With --manager supervisor: print a program block for the host's system supervisord (run as the venv owner) instead of one in the venv."}

# ---- hooks: webhooks into this venv --------------------------------------
# The daemon listens on [hooks] port when [hooks] enabled = true (on either
# backend). Apps POST to {base_path}/hook/<name>; each request is checked
# (token or basic auth), spooled in {venv}/hooks/spool.sqlite, matched against
# the hook's rules, and either run here (autonomous runnables), held for an
# approval from a console (confirm/supervised), refused (manual) or passed to
# the consoles following this venv as an event. Hooks live in
# runspec_scheduler.toml ([[hook]], written by `hooks save`) and in
# {config dir}/hooks.d/*.toml (deployed, e.g. by Ansible; those win).
[runspec-scheduler.commands.hooks]
description     = "Webhooks into this venv: list hooks and the listener, test a hook against a body, approve or deny runs waiting for a person, mute hooks, follow events, and set hooks up."
require-command = true

[runspec-scheduler.commands.hooks.commands.list]
description = "The listener settings, every hook (console-made and deployed, with its address), who follows this venv, the mutes and the runs waiting for approval."
output      = "json"

[runspec-scheduler.commands.hooks.commands.deliveries]
description = "Recent webhook deliveries, newest first: what arrived, what it ran or why not, who decided."
output      = "json"

[runspec-scheduler.commands.hooks.commands.deliveries.args]
hook  = {type = "str", required = false, description = "Only this hook's deliveries."}
state = {type = "str", required = false, description = "Only deliveries in this state (pending, ran, denied, expired, refused, event, no-match, duplicate, error…)."}
limit = {type = "int", default = 50, description = "How many to show."}

[runspec-scheduler.commands.hooks.commands.show]
description = "One delivery in full: fields, rule, what it runs, its state, and the body as it was sent."
output      = "json"

[runspec-scheduler.commands.hooks.commands.show.args]
id = {type = "int", required = true, description = "Delivery id."}

[runspec-scheduler.commands.hooks.commands.check]
description = "Check a hook file (a hooks.d/*.toml or a copy of one) and print every problem. Exit 1 when there are any, so Ansible can use it as validate: \"{venv}/bin/runspec-scheduler hooks check %s\"."
output      = "json"

[runspec-scheduler.commands.hooks.commands.check.args]
file = {type = "path", position = 1, description = "The TOML file to check."}

[runspec-scheduler.commands.hooks.commands.test]
description = "Dry run: what a hook does with a body (piped in, or the last one it received, or a stored delivery): the fields it picks out, the rule that matches, what it would run with which args, and at which autonomy. Nothing runs and nothing is stored."
output      = "json"

[runspec-scheduler.commands.hooks.commands.test.args]
hook         = {type = "str", required = false, description = "The hook to test (may be left out with --file holding one hook)."}
id           = {type = "int", required = false, description = "Use this stored delivery's body instead of stdin."}
last         = {type = "flag", default = false, description = "Use the last body the hook received instead of stdin."}
file         = {type = "path", required = false, description = "Test the hook as written in this file (e.g. a hooks.d file before deploying it) instead of as set up."}
content-type = {type = "str", required = false, description = "The body's Content-Type (default: worked out from the body)."}
draft        = {type = "flag", default = false, description = "Test a hook that isn't saved: stdin is JSON {\"hook\": {…}, \"body\": \"…\", \"content_type\": \"…\"} (no body = the last one that hook received). For the console's hook editor."}

[runspec-scheduler.commands.hooks.commands.token]
description = "Make a new random token and print it with its SHA-256. Put the hash in a hook (token_sha256) and the token in the sending app. --basic makes a basic-auth password and its password_hash instead. Nothing is stored."
output      = "json"

[runspec-scheduler.commands.hooks.commands.token.args]
basic = {type = "flag", default = false, description = "Make a basic-auth password and its password_hash (a salted PBKDF2 hash) instead of a token."}

[runspec-scheduler.commands.hooks.commands.save]
description = "Add or replace a console-made hook from a JSON object or a TOML [[hook]] on stdin (checked first). --new-token makes a token and prints it once; only its hash is kept. A hook deployed in hooks.d can't be saved over."
output      = "json"
autonomy    = "confirm"

[runspec-scheduler.commands.hooks.commands.save.args]
new-token    = {type = "flag", default = false, description = "Make a new token for the hook (printed once)."}
new-password = {type = "flag", default = false, description = "Make a new basic-auth password for the hook's username (printed once)."}

[runspec-scheduler.commands.hooks.commands.remove]
description = "Remove a console-made hook. Deployed hooks are removed where they're deployed from."
output      = "json"
autonomy    = "confirm"

[runspec-scheduler.commands.hooks.commands.remove.args]
name = {type = "str", required = true, description = "Hook name."}

[runspec-scheduler.commands.hooks.commands.settings]
description = "Show the [hooks] and [smtp] settings, or change them: --set key=value for [hooks] (enabled, port, bind, base_path, cert, key, max_body, keep, rate_per_minute, trusted_proxies, approve_within, expect_claim_within, max_runs…), --smtp key=value for [smtp] (relay, port, from, to, starttls). An empty value puts the default back. The daemon picks the change up by itself."
output      = "json"
autonomy    = "confirm"

[runspec-scheduler.commands.hooks.commands.settings.args]
set  = {type = "str", multiple = true, required = false, description = "A [hooks] setting as key=value, e.g. enabled=true, port=8443, cert=/etc/pki/tls/certs/host.pem."}
smtp = {type = "str", multiple = true, required = false, description = "An [smtp] setting as key=value, e.g. relay=smtp.example.com, from=runspec@example.com, to=[\"ops@example.com\"]."}

[runspec-scheduler.commands.hooks.commands.approve]
description = "Approve a run waiting for a person. The first approval wins and the daemon runs it here; every console following the venv sees who approved it."
output      = "json"
autonomy    = "manual"

[runspec-scheduler.commands.hooks.commands.approve.args]
id   = {type = "int", required = true, description = "Delivery id."}
note = {type = "str", required = false, description = "A note kept with the decision."}

[runspec-scheduler.commands.hooks.commands.deny]
description = "Deny a run waiting for a person. It settles it for everyone (recorded with who denied it)."
output      = "json"
autonomy    = "manual"

[runspec-scheduler.commands.hooks.commands.deny.args]
id   = {type = "int", required = true, description = "Delivery id."}
note = {type = "str", required = false, description = "A note kept with the decision."}

[runspec-scheduler.commands.hooks.commands.mute]
description = "Stop counting yourself as watching a hook (or all hooks) for a while: other consoles see who muted what until when, and a waiting approval is mailed straight away when everyone following has muted it."
output      = "json"

[runspec-scheduler.commands.hooks.commands.mute.args]
hook   = {type = "str", required = false, description = "The hook to mute (default: all hooks)."}
for    = {type = "str", default = "1h", description = "How long: 30m, 2h, 1d."}
reason = {type = "str", required = false, description = "Shown to the others, e.g. off shift."}
who    = {type = "str", required = false, description = "Mute for this person (default: the person running the command, SUDO_USER under sudo)."}

[runspec-scheduler.commands.hooks.commands.unmute]
description = "Take a mute off again."
output      = "json"

[runspec-scheduler.commands.hooks.commands.unmute.args]
hook = {type = "str", required = false, description = "The hook (default: all of your mutes)."}
who  = {type = "str", required = false, description = "Whose mute (default: yours)."}

[runspec-scheduler.commands.hooks.commands.follow]
description = "Stream this venv's webhook events as JSON lines (what runspec-console runs over SSH): a hello line with what's waiting, then each new delivery and every change, until the reader goes away. Never returns by itself."
output      = "json"
autonomy    = "manual"

[runspec-scheduler.commands.hooks.commands.follow.args]
since  = {type = "int", required = false, description = "Resume after this event id (the last one seen)."}
replay = {type = "str", default = "15m", description = "Without --since: start this far back."}
who    = {type = "str", required = false, description = "Who is following (default: SUDO_USER, else this account)."}
once   = {type = "flag", default = false, description = "Print what's there now and stop (for scripts and tests)."}
