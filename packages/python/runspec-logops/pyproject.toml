[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runspec-logops"
version = "0.1.3"
requires-python = ">=3.10"
description = "Log-condensing + code-mapping runnables for runspec — cheap application-support triage from a log file"
keywords = ["runspec", "runnable", "logs", "triage", "observability"]
dependencies = [
    "runspec>=0.27.0",
    "runspec-logops-core>=0.3.1",
]

[project.urls]
Documentation = "https://runspec.app/"
Source        = "https://github.com/jasonfinestone/runspec/tree/main/packages/python/runspec-logops"
Changelog     = "https://github.com/jasonfinestone/runspec/blob/main/packages/python/runspec-logops/CHANGELOG.md"
Issues        = "https://github.com/jasonfinestone/runspec/issues"

[project.scripts]
summarize-log = "runspec_logops.digest:main_summarize_log"
map-trace     = "runspec_logops.codemap:main_map_trace"
bundle-digest = "runspec_logops.bundle:main_bundle_digest"

[project.optional-dependencies]
dev = [
    "ruff==0.15.20",
    "mypy",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
