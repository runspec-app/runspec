[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runspec-wireshark"
version = "0.1.0"
requires-python = ">=3.10"
description = "Wireshark runnable for runspec — read pcap files with tshark (summary, packets, decoded packets, conversations, followed streams, DNS/HTTP/TLS problems, expert info) and capture, filter, or merge them"
readme = "README.md"
keywords = ["runspec", "runnable", "wireshark", "tshark", "pcap", "packet-capture", "network", "troubleshooting", "mcp"]
dependencies = [
    # 0.74.0 plays back the shipped mocks (runspec_wireshark/mocks/pcap.json).
    "runspec>=0.74.0",
    "runspec-wireshark-core>=0.1.0",
]

[project.urls]
Documentation = "https://runspec.app/"
Source        = "https://github.com/jasonfinestone/runspec/tree/main/packages/python/runspec-wireshark"
Changelog     = "https://github.com/jasonfinestone/runspec/blob/main/packages/python/runspec-wireshark/CHANGELOG.md"
Issues        = "https://github.com/jasonfinestone/runspec/issues"

[project.scripts]
# Entry point name MUST match the runnable name in runspec.toml (`pcap`). Not
# `wireshark` / `tshark`, so it never shadows the real Wireshark binaries.
pcap = "runspec_wireshark.cli:main"

[project.optional-dependencies]
dev = [
    "ruff==0.15.20",
    "mypy",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
