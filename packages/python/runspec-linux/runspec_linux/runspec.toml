# ── Filesystem (folded from runspec-fs; backed by runspec-fs-core) ─────────────
# The filesystem is part of the OS, so the Linux pack ships the `fs` runnable
# directly. One verb per Filesystem MCP tool; `runspec serve` re-expands each
# verb into a leaf MCP tool (fs_read-text-file, fs_write-file, …), giving a
# runspec-console agent local AND remote filesystem access on every fleet host.
# No directory jail — access is bounded by the OS permissions of the invoking
# (or --run-as) user.

[fs]
serve = ["local"]
description = "Read and manipulate the filesystem on this host (local, or remote via runspec-console)"
output = "json"
require-command = true
examples = [
  {cmd = "fs list-directory --path .", description = "List the current directory"},
  {cmd = "fs read-text-file --path README.md --head 20", description = "Read the first 20 lines of a file"},
  {cmd = "fs search-files --path . --pattern '*.py'", description = "Find Python files recursively"},
  {cmd = "fs edit-file --path a.txt --old-text foo --new-text bar", description = "Replace 'foo' with 'bar'"},
  {cmd = "fs --run-as deploy read-text-file --path /home/deploy/app.log", description = "Run a verb as another OS user (chosen per invocation)"},
]

# ── global args (inherited by every verb) ──────────────────────────────────
# Per-invocation run-as: the user/agent picks which OS user each verb runs as,
# like runspec-linux's venv runnables. The operation is re-invoked as that user
# via sudo/su, so access is bounded by THAT user's OS permissions — no jail.
[fs.args]
run-as        = {type = "str",    required = false, description = "Run this operation as another OS user (via sudo -n -u / su, chosen per invocation). Access is then bounded by that user's OS permissions. POSIX only; needs passwordless sudo for the target user."}
become-method = {type = "choice", options = ["sudo", "su"], default = "sudo", description = "How to escalate to --run-as."}

# ── reads / metadata → autonomous ──────────────────────────────────────────

[fs.commands.read-text-file]
description = "Read a file as UTF-8 text; optionally only the first N (--head) or last N (--tail) lines"
autonomy = "autonomous"
[fs.commands.read-text-file.args]
path = {type = "path", required = true, description = "File to read"}
head = {type = "int", required = false, description = "Return only the first N lines"}
tail = {type = "int", required = false, description = "Return only the last N lines"}

[fs.commands.read-media-file]
description = "Read a binary/media file and return it base64-encoded with its MIME type"
autonomy = "autonomous"
[fs.commands.read-media-file.args]
path = {type = "path", required = true, description = "File to read"}

[fs.commands.read-multiple-files]
description = "Read several files at once; a failed read is reported per-file without aborting the batch"
autonomy = "autonomous"
[fs.commands.read-multiple-files.args]
paths = {type = "path", multiple = true, required = true, description = "Files to read (repeat --paths per file)"}

[fs.commands.list-directory]
description = "List a directory's immediate contents, each tagged file or directory"
autonomy = "autonomous"
[fs.commands.list-directory.args]
path = {type = "path", required = true, description = "Directory to list"}

[fs.commands.list-directory-with-sizes]
description = "List a directory's contents with per-entry sizes and totals"
autonomy = "autonomous"
[fs.commands.list-directory-with-sizes.args]
path = {type = "path", required = true, description = "Directory to list"}
sort-by = {type = "choice", options = ["name", "size"], default = "name", description = "Sort order (size is descending)"}

[fs.commands.directory-tree]
description = "Return a recursive JSON tree of a directory"
autonomy = "autonomous"
[fs.commands.directory-tree.args]
path = {type = "path", required = true, description = "Directory to walk"}
exclude = {type = "str", multiple = true, required = false, description = "Glob patterns to prune (repeat --exclude)"}

[fs.commands.search-files]
description = "Recursively find files/directories whose name matches a pattern (glob, or case-insensitive substring)"
autonomy = "autonomous"
[fs.commands.search-files.args]
path = {type = "path", required = true, description = "Directory to search under"}
pattern = {type = "str", required = true, description = "Glob (e.g. '*.py') or a case-insensitive substring"}
exclude = {type = "str", multiple = true, required = false, description = "Glob patterns to prune (repeat --exclude)"}

[fs.commands.get-file-info]
description = "Return detailed metadata for a file or directory (size, timestamps, permissions)"
autonomy = "autonomous"
[fs.commands.get-file-info.args]
path = {type = "path", required = true, description = "File or directory to stat"}

[fs.commands.list-allowed-directories]
description = "Report the effective user and starting directories (informational — no directory jail is enforced)"
autonomy = "autonomous"

# ── mutations → confirm ────────────────────────────────────────────────────

[fs.commands.write-file]
description = "Create a new file or overwrite an existing one with UTF-8 text"
autonomy = "confirm"
[fs.commands.write-file.args]
path = {type = "path", required = true, description = "File to write"}
content = {type = "str", required = true, description = "File contents"}

[fs.commands.edit-file]
description = "Apply ordered old→new substring replacements to a file; returns a unified diff. Pair each --old-text with a --new-text by position."
autonomy = "confirm"
[fs.commands.edit-file.args]
path = {type = "path", required = true, description = "File to edit"}
old-text = {type = "str", multiple = true, required = true, description = "Text to find (repeat --old-text; paired by position with --new-text)"}
new-text = {type = "str", multiple = true, required = true, description = "Replacement text (repeat --new-text; paired by position with --old-text)"}
dry-run = {type = "flag", default = false, description = "Compute and diff the edits without writing"}

[fs.commands.create-directory]
description = "Create a directory (and any missing parents); idempotent"
autonomy = "confirm"
[fs.commands.create-directory.args]
path = {type = "path", required = true, description = "Directory to create"}

[fs.commands.move-file]
description = "Move or rename a file/directory; fails if the destination already exists"
autonomy = "confirm"
[fs.commands.move-file.args]
source = {type = "path", required = true, description = "Path to move"}
destination = {type = "path", required = true, description = "New path (must not already exist)"}

# ── cron (crontab management; local, or remote via runspec-console) ──────────
[cron]
serve = ["local"]
description = "Manage a user's cron jobs (crontab): list, add, remove, clear. Local, or remote via runspec-console."
output = "json"
require-command = true
examples = [
  {cmd = "cron list", description = "List the current user's cron jobs"},
  {cmd = "cron add --schedule '0 3 * * *' --command '/opt/app/backup.sh' --comment 'nightly backup'", description = "Add a job that runs at 03:00 daily"},
  {cmd = "cron add --schedule @reboot --command '/opt/app/warmup.sh'", description = "Add a job with an @nickname schedule"},
  {cmd = "cron remove --match backup.sh", description = "Remove every job whose command contains 'backup.sh'"},
  {cmd = "cron --run-as deploy list", description = "Manage another OS user's crontab (chosen per invocation, via sudo -n -u / su)"},
]

# ── global args (inherited by every verb) ──────────────────────────────────
# Per-invocation run-as: the operator/agent picks WHOSE crontab each verb
# manages. The crontab command is escalated to that user via sudo -n -u / su,
# so "run as bob" == "manage bob's crontab". Empty = the caller's own crontab.
[cron.args]
run-as        = {type = "str",    required = false, description = "Manage this OS user's crontab instead of the caller's (via sudo -n -u / su, chosen per invocation). POSIX only; needs passwordless sudo for the target user."}
become-method = {type = "choice", options = ["sudo", "su"], default = "sudo", description = "How to escalate to --run-as."}

# ── read → autonomous ──────────────────────────────────────────────────────
[cron.commands.list]
description = "List the jobs in the crontab as structured records (schedule, command, and any attached comment). A user with no crontab is reported as empty, not an error."
autonomy = "autonomous"

# ── mutations → confirm ────────────────────────────────────────────────────
[cron.commands.add]
description = "Add a cron job (schedule + command) to the crontab. Idempotent: an identical schedule+command line is left as-is unless --allow-duplicate is set."
autonomy = "confirm"
[cron.commands.add.args]
schedule = {type = "str", required = true, description = "Cron schedule: five fields 'min hour day-of-month month day-of-week' (e.g. '0 3 * * *'), or an @nickname (@reboot, @daily, @hourly, ...)."}
command = {type = "str", required = true, description = "Command line cron runs (executed via /bin/sh)."}
comment = {type = "str", required = false, description = "Optional note written as a '# comment' line directly above the job (read back as the job's comment)."}
allow-duplicate = {type = "flag", default = false, description = "Add the job even if an identical schedule+command line already exists."}

[cron.commands.remove]
description = "Remove job(s) from the crontab, selected by --match (command substring or exact line) or --index (0-based position from `cron list`). Removing nothing is not an error."
autonomy = "confirm"
[cron.commands.remove.args]
match = {type = "str", required = false, description = "Remove every job whose command contains this substring, or whose full 'schedule command' line equals it."}
index = {type = "int", required = false, description = "Remove the job at this 0-based position among the crontab's jobs (the index shown by `cron list`)."}
[cron.commands.remove.groups.selector]
exactly-one = true
args = ["match", "index"]

[cron.commands.clear]
description = "Remove the user's entire crontab (crontab -r). A no-op when the user has no crontab."
autonomy = "confirm"
