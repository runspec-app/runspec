[config]
autonomy-default = "autonomous"

[config.logging]
# Per-invocation log files: one {runnable}.{utc-ts}.{run_id}.log per run.
# Multi-writer safe for shared venvs — no in-process rotation (use
# `runspec logs` to view/compact/prune). rotate/keep are inert under per-run.
store = "per-run"

# ── System monitoring ─────────────────────────────────────────────────────────

[system-info]
serve     = ["local"]
description = "Report hostname, OS, kernel version, uptime, load averages, and CPU count"
autonomy  = "autonomous"
output    = "json"

[disk-usage]
serve     = ["local"]
description = "Report disk usage for all mounted filesystems"
autonomy  = "autonomous"
output    = "json"

[check-memory]
serve     = ["local"]
description = "Report RAM and swap usage in megabytes"
autonomy  = "autonomous"
output    = "json"

[list-processes]
serve     = ["local"]
description = "List running processes, optionally filtered by name"
autonomy  = "autonomous"
output    = "json"

[list-processes.args.filter]
type        = "str"
short       = "-f"
description = "Filter processes whose command contains this string"
required    = false

[list-processes.args.limit]
type        = "int"
short       = "-n"
description = "Maximum number of processes to return"
default     = 20

# ── Services ──────────────────────────────────────────────────────────────────

[check-service]
serve       = ["local"]
description = "Check whether a systemd service is active and report its status"
autonomy    = "autonomous"
output      = "json"

[check-service.args.service]
type        = "str"
short       = "-s"
description = "Service name (e.g. nginx or nginx.service)"

[list-services]
serve       = ["local"]
description = "List all systemd service units and their active/sub state"
autonomy    = "autonomous"
output      = "json"

[list-services.args.state]
type        = "choice"
options     = ["all", "active", "failed", "inactive"]
default     = "all"
description = "Filter services by active state"

[restart-service]
serve       = ["local"]
description = "Restart a systemd service"
autonomy    = "confirm"
output      = "json"

[restart-service.args.service]
type        = "str"
short       = "-s"
description = "Service name to restart"

# Escalation: restarting a system service needs privilege.
[restart-service.args.run-as]
type        = "str"
description = "Run as this specific OS user (via sudo -n -u / su). Mutually exclusive with --sudo."
required    = false

[restart-service.args.sudo]
type        = "flag"
description = "Run as root (via sudo). Mutually exclusive with --run-as."
default     = false

[restart-service.args.become-method]
type        = "choice"
options     = ["sudo", "su"]
description = "How to escalate for --run-as/--sudo: sudo (passwordless, -n) or su."
default     = "sudo"

[restart-service.groups.escalation]
exclusive   = true
args        = ["run-as", "sudo"]

# ── Logs ──────────────────────────────────────────────────────────────────────

[tail-log]
serve       = ["local"]
description = "Return the last N lines of a log file"
autonomy    = "autonomous"
output      = "json"

[tail-log.args.file]
type        = "path"
short       = "-f"
description = "Path to the log file"

[tail-log.args.lines]
type        = "int"
short       = "-n"
description = "Number of lines to return"
default     = 50

# Escalation: read a root-owned / service-account-owned log (tail -n under sudo/su).
[tail-log.args.run-as]
type        = "str"
description = "Read as this specific OS user (via sudo -n -u / su). Mutually exclusive with --sudo."
required    = false

[tail-log.args.sudo]
type        = "flag"
description = "Read as root (via sudo). Mutually exclusive with --run-as."
default     = false

[tail-log.args.become-method]
type        = "choice"
options     = ["sudo", "su"]
description = "How to escalate for --run-as/--sudo: sudo (passwordless, -n) or su."
default     = "sudo"

[tail-log.groups.escalation]
exclusive   = true
args        = ["run-as", "sudo"]

[search-log]
serve       = ["local"]
description = "Search a log file for lines matching a pattern"
autonomy    = "autonomous"
output      = "json"

[search-log.args.file]
type        = "path"
short       = "-f"
description = "Path to the log file"

[search-log.args.pattern]
type        = "str"
short       = "-p"
description = "Search pattern (case-insensitive substring or regex)"

[search-log.args.limit]
type        = "int"
short       = "-n"
description = "Maximum number of matching lines to return"
default     = 100

# Escalation: search a root-owned / service-account-owned log (cat under sudo/su).
[search-log.args.run-as]
type        = "str"
description = "Read as this specific OS user (via sudo -n -u / su). Mutually exclusive with --sudo."
required    = false

[search-log.args.sudo]
type        = "flag"
description = "Read as root (via sudo). Mutually exclusive with --run-as."
default     = false

[search-log.args.become-method]
type        = "choice"
options     = ["sudo", "su"]
description = "How to escalate for --run-as/--sudo: sudo (passwordless, -n) or su."
default     = "sudo"

[search-log.groups.escalation]
exclusive   = true
args        = ["run-as", "sudo"]

[journalctl]
serve       = ["local"]
description = "Fetch recent journal entries for a systemd unit (systemd-only)"
autonomy    = "autonomous"
output      = "json"

[journalctl.args.unit]
type        = "str"
short       = "-u"
description = "Systemd unit name (e.g. nginx or nginx.service)"

[journalctl.args.lines]
type        = "int"
short       = "-n"
description = "Number of lines to return"
default     = 50

[journalctl.args.since]
type        = "str"
description = "Return entries since this time string (e.g. '1 hour ago', '2026-05-27 08:00')"
required    = false

# Escalation: read a protected unit's journal (outside the systemd-journal group).
[journalctl.args.run-as]
type        = "str"
description = "Read as this specific OS user (via sudo -n -u / su). Mutually exclusive with --sudo."
required    = false

[journalctl.args.sudo]
type        = "flag"
description = "Read as root (via sudo). Mutually exclusive with --run-as."
default     = false

[journalctl.args.become-method]
type        = "choice"
options     = ["sudo", "su"]
description = "How to escalate for --run-as/--sudo: sudo (passwordless, -n) or su."
default     = "sudo"

[journalctl.groups.escalation]
exclusive   = true
args        = ["run-as", "sudo"]

# ── Network ───────────────────────────────────────────────────────────────────

[ping-host]
serve       = ["local"]
description = "Ping a host and report reachability and packet loss"
autonomy    = "autonomous"
output      = "json"

[ping-host.args.host]
type        = "str"
short       = "-H"
description = "Hostname or IP address to ping"

[ping-host.args.count]
type        = "int"
short       = "-c"
description = "Number of ICMP packets to send"
default     = 4

[check-port]
serve       = ["local"]
description = "Check whether a TCP port is open on a host"
autonomy    = "autonomous"
output      = "json"

[check-port.args.host]
type        = "str"
short       = "-H"
description = "Hostname or IP address"

[check-port.args.port]
type        = "int"
short       = "-p"
description = "TCP port number"

[check-port.args.timeout]
type        = "float"
description = "Connection timeout in seconds"
default     = 3.0

[show-connections]
serve       = ["local"]
description = "Show active TCP/UDP connections (equivalent to ss or netstat)"
autonomy    = "autonomous"
output      = "json"

[show-connections.args.state]
type        = "choice"
options     = ["all", "established", "listening"]
default     = "all"
description = "Filter connections by state"

# ── Files ─────────────────────────────────────────────────────────────────────

[find-large-files]
serve       = ["local"]
description = "Find files larger than a threshold in a directory tree"
autonomy    = "autonomous"
output      = "json"

[find-large-files.args.path]
type        = "path"
short       = "-p"
description = "Directory to search"

[find-large-files.args.min-mb]
type        = "float"
description = "Minimum file size in megabytes"
default     = 100.0

[find-large-files.args.limit]
type        = "int"
short       = "-n"
description = "Maximum number of results to return (sorted by size, largest first)"
default     = 20

[backup-files]
serve       = ["local"]
description = "Create a timestamped tar.gz archive of a directory"
autonomy    = "confirm"
output      = "json"

[backup-files.args.source]
type        = "path"
short       = "-s"
description = "Directory to archive"

[backup-files.args.destination]
type        = "path"
short       = "-d"
description = "Directory where the archive will be written"
default     = "/tmp"

# ── Security ──────────────────────────────────────────────────────────────────

[last-logins]
serve       = ["local"]
description = "Show recent login history from the wtmp log"
autonomy    = "autonomous"
output      = "json"

[last-logins.args.limit]
type        = "int"
short       = "-n"
description = "Number of login records to return"
default     = 20

[who]
serve       = ["local"]
description = "List users currently logged in to the system"
autonomy    = "autonomous"
output      = "json"

# ── Containers ────────────────────────────────────────────────────────────────

[list-containers]
serve       = ["local"]
description = "List Docker containers (requires Docker)"
autonomy    = "autonomous"
output      = "json"

[list-containers.args.all]
type        = "flag"
short       = "-a"
description = "Include stopped containers"
default     = false

# Escalation: the Docker daemon socket is usually root/docker-group owned.
[list-containers.args.run-as]
type        = "str"
description = "Run docker as this specific OS user (via sudo -n -u / su). Mutually exclusive with --sudo."
required    = false

[list-containers.args.sudo]
type        = "flag"
description = "Run docker as root (via sudo). Mutually exclusive with --run-as."
default     = false

[list-containers.args.become-method]
type        = "choice"
options     = ["sudo", "su"]
description = "How to escalate for --run-as/--sudo: sudo (passwordless, -n) or su."
default     = "sudo"

[list-containers.groups.escalation]
exclusive   = true
args        = ["run-as", "sudo"]

[container-logs]
serve       = ["local"]
description = "Fetch recent log output from a Docker container"
autonomy    = "autonomous"
output      = "json"

[container-logs.args.container]
type        = "str"
short       = "-c"
description = "Container name or ID"

[container-logs.args.lines]
type        = "int"
short       = "-n"
description = "Number of lines to return"
default     = 50

# Escalation: the Docker daemon socket is usually root/docker-group owned.
[container-logs.args.run-as]
type        = "str"
description = "Run docker as this specific OS user (via sudo -n -u / su). Mutually exclusive with --sudo."
required    = false

[container-logs.args.sudo]
type        = "flag"
description = "Run docker as root (via sudo). Mutually exclusive with --run-as."
default     = false

[container-logs.args.become-method]
type        = "choice"
options     = ["sudo", "su"]
description = "How to escalate for --run-as/--sudo: sudo (passwordless, -n) or su."
default     = "sudo"

[container-logs.groups.escalation]
exclusive   = true
args        = ["run-as", "sudo"]

[restart-container]
serve       = ["local"]
description = "Restart a Docker container"
autonomy    = "confirm"
output      = "json"

[restart-container.args.container]
type        = "str"
short       = "-c"
description = "Container name or ID"

# Escalation: the Docker daemon socket is usually root/docker-group owned.
[restart-container.args.run-as]
type        = "str"
description = "Run docker as this specific OS user (via sudo -n -u / su). Mutually exclusive with --sudo."
required    = false

[restart-container.args.sudo]
type        = "flag"
description = "Run docker as root (via sudo). Mutually exclusive with --run-as."
default     = false

[restart-container.args.become-method]
type        = "choice"
options     = ["sudo", "su"]
description = "How to escalate for --run-as/--sudo: sudo (passwordless, -n) or su."
default     = "sudo"

[restart-container.groups.escalation]
exclusive   = true
args        = ["run-as", "sudo"]

# ── Packages ──────────────────────────────────────────────────────────────────

[list-packages]
serve       = ["local"]
description = "List installed packages (apt/dnf/yum/zypper/pacman), optionally filtered by name"
autonomy    = "autonomous"
output      = "json"

[list-packages.args.filter]
type        = "str"
short       = "-f"
description = "Only list packages whose name contains this string"
required    = false

[list-packages.args.limit]
type        = "int"
short       = "-n"
description = "Maximum number of packages to return (sorted by name)"
default     = 100

[list-upgrades]
serve       = ["local"]
description = "List packages with an available upgrade (refreshes the package index first)"
autonomy    = "autonomous"
output      = "json"
run_as      = "root"

[list-upgrades.args.no-refresh]
type        = "flag"
description = "Skip refreshing the package index — list from the cached index (faster)"
default     = false

[upgrade-packages]
serve       = ["local"]
description = "Refresh the package index and upgrade all installed packages (needs root)"
autonomy    = "confirm"
output      = "json"
run_as      = "root"

[install-package]
serve       = ["local"]
description = "Install one or more packages by name (needs root)"
autonomy    = "confirm"
output      = "json"
run_as      = "root"

[install-package.args.package]
type        = "str"
short       = "-p"
description = "Package name to install (space-separated for several)"

[remove-package]
serve       = ["local"]
description = "Remove one or more packages by name (needs root)"
autonomy    = "confirm"
output      = "json"
run_as      = "root"

[remove-package.args.package]
type        = "str"
short       = "-p"
description = "Package name to remove (space-separated for several)"

# ── Power ─────────────────────────────────────────────────────────────────────

[reboot-host]
serve       = ["local"]
description = "Reboot the host, optionally after a delay in minutes (needs root)"
autonomy    = "confirm"
output      = "json"
run_as      = "root"

[reboot-host.args.delay-minutes]
type        = "int"
short       = "-d"
description = "Minutes to wait before rebooting (0 = immediately)"
default     = 0

# ── Privilege bootstrap ───────────────────────────────────────────────────────

# One-time setup so the run_as="root" runnables above need no password. Itself
# escalates with the supplied password via `sudo -S` (read from stdin, never
# argv), so it must NOT declare run_as. Validated with visudo before + after
# install and rolled back on failure.
[enable-passwordless-sudo]
serve       = ["local"]
description = "Install a validated /etc/sudoers.d drop-in so run_as='root' runnables need no password (one-time bootstrap)"
autonomy    = "confirm"
output      = "json"

[enable-passwordless-sudo.args.password]
type        = "password"
description = "Your sudo password — sent over the secret channel and piped to 'sudo -S'; never appears in argv, ps, or logs"

[enable-passwordless-sudo.args.user]
type        = "str"
short       = "-u"
description = "User to grant passwordless sudo (defaults to the current login user)"
required    = false

[enable-passwordless-sudo.args.scope]
type        = "choice"
options     = ["scoped", "all"]
default     = "scoped"
description = "scoped = NOPASSWD only for the runspec venv runnables (manual/CLI runs); all = NOPASSWD: ALL (also covers agent-driven runs)"

# ── TCP interfaces (nc-command) ────────────────────────────────────────────────

[nc-command]
serve       = ["local"]
description = "Send a command over a plain TCP socket and return the response (nc-style)"
autonomy    = "autonomous"
output      = "json"

[nc-command.args.host]
type        = "str"
short       = "-H"
description = "Hostname or IP address"

[nc-command.args.port]
type        = "int"
short       = "-p"
description = "TCP port number"

[nc-command.args.command]
type        = "str"
short       = "-c"
description = "Command string to send (a newline is appended automatically)"

[nc-command.args.wait]
type        = "float"
short       = "-w"
description = "Seconds to keep the connection open after sending (allows server response to arrive)"
default     = 0.3

[nc-command.args.read-timeout]
type        = "float"
description = "Per-chunk socket read timeout in seconds"
default     = 0.1

# ── Commands ──────────────────────────────────────────────────────────────────

[which]
serve       = ["local"]
description = "Locate a command on the PATH and return its full path (like the `which` command) — handy for finding interpreter/binary paths to feed other runnables"
autonomy    = "autonomous"
output      = "json"

examples = [
  {cmd = "which python3",              description = "Resolve a command to its full path"},
  {cmd = "which \"python3 pip3 git\"", description = "Resolve several commands at once (space-separated)"},
  {cmd = "which python3 --all",        description = "Show every match on the PATH, not just the first"},
]

[which.args.name]
type        = "str"
position    = 1
description = "Command name(s) to locate on the PATH (space-separated for several)"

[which.args.all]
type        = "flag"
short       = "-a"
description = "Return every match found on the PATH, not just the first"
default     = false

[which.args.path]
type        = "str"
description = "Override the search PATH to use (defaults to the host's $PATH)"
required    = false

# ── Python venvs ──────────────────────────────────────────────────────────────

# These deliberately declare NO `run_as` key. The service account that owns a
# shared venv is chosen per invocation, so each runnable takes a `run-as`
# argument and escalates internally (`sudo -n -u <user>`, or `su` via
# `become-method`). An empty `run-as` runs as the SSH login user (personal venv).

[create-venv]
serve       = ["local"]
description = "Create a Python virtualenv (always --symlinks) from a specific interpreter, optionally as a service account, with a shared 2775 logs/ dir"
autonomy    = "confirm"
output      = "json"

[create-venv.args.python]
type        = "path"
description = "Path to the Python interpreter to build the venv from (browse to a real binary — not the system default)"

[create-venv.args.dest]
type        = "path"
short       = "-d"
description = "Full path of the venv to create (name and location are free)"

[create-venv.args.run-as]
type        = "str"
short       = "-u"
description = "Service account to create the venv as (escalates via sudo/su); empty = the SSH login user"
required    = false

[create-venv.args.become-method]
type        = "choice"
options     = ["sudo", "su"]
default     = "sudo"
description = "How to escalate to run-as: sudo (passwordless, -n) or su"

[create-venv.args.group]
type        = "str"
short       = "-g"
description = "Optional shared group to chgrp the venv to (e.g. consoles), so every connected console can read/write"
required    = false

[create-venv.args.system-site-packages]
type        = "flag"
description = "Give the venv access to the system site-packages"
default     = false

[create-venv.args.upgrade-deps]
type        = "flag"
description = "Upgrade pip/setuptools to the latest in the new venv (--upgrade-deps)"
default     = false

[create-venv.args.clear]
type        = "flag"
description = "Delete the contents of the venv directory if it already exists (--clear)"
default     = false

[create-venv.args.prompt]
type        = "str"
short       = "-p"
description = "Prompt prefix shown when the venv is activated (--prompt)"
required    = false

[install-into-venv]
serve       = ["local"]
description = "pip install named packages and/or a local project (pyproject dir or wheel/sdist) into an existing venv"
autonomy    = "confirm"
output      = "json"

[install-into-venv.args.venv]
type        = "path"
ui          = "directory"
short       = "-v"
description = "Path to the venv to install into (its bundled python runs pip)"

[install-into-venv.args.package]
type        = "str"
short       = "-p"
description = "Package spec(s) to install (space-separated for several)"
required    = false

[install-into-venv.args.project]
type        = "path"
description = "Path to a local project to install — a directory with pyproject.toml, or a wheel/sdist"
required    = false

[install-into-venv.args.editable]
type        = "flag"
short       = "-e"
description = "Install the project in editable mode (pip install -e); requires --project"
default     = false

[install-into-venv.args.upgrade]
type        = "flag"
short       = "-U"
description = "Upgrade packages to the newest available version (pip install -U)"
default     = false

[install-into-venv.args.no-cache-dir]
type        = "flag"
description = "Disable the pip cache for this install (--no-cache-dir)"
default     = false

[install-into-venv.args.force-reinstall]
type        = "flag"
description = "Reinstall packages even if already up to date (--force-reinstall)"
default     = false

[install-into-venv.args.run-as]
type        = "str"
short       = "-u"
description = "Service account that owns the venv (escalates via sudo/su); empty = the SSH login user"
required    = false

[install-into-venv.args.become-method]
type        = "choice"
options     = ["sudo", "su"]
default     = "sudo"
description = "How to escalate to run-as: sudo (passwordless, -n) or su"

[configure-pip]
serve       = ["local"]
description = "Write a pip.conf (index-url and friends) at user or venv scope for private-PyPI access"
autonomy    = "confirm"
output      = "json"

[configure-pip.args.index-url]
type        = "str"
short       = "-i"
description = "Primary package index URL (index-url)"

[configure-pip.args.extra-index-url]
type        = "str"
description = "Additional package index URL (extra-index-url)"
required    = false

[configure-pip.args.trusted-host]
type        = "str"
description = "Host to trust without TLS verification (trusted-host)"
required    = false

[configure-pip.args.cert]
type        = "str"
description = "Path to a CA bundle to verify the index's TLS certificate (cert)"
required    = false

[configure-pip.args.timeout]
type        = "int"
description = "Socket timeout in seconds (timeout)"
required    = false

[configure-pip.args.retries]
type        = "int"
description = "Number of retries for a failed connection (retries)"
required    = false

[configure-pip.args.proxy]
type        = "str"
description = "Proxy URL in [user:passwd@]proxy.server:port form (proxy)"
required    = false

[configure-pip.args.require-virtualenv]
type        = "flag"
description = "Refuse to install outside a virtualenv and silence the pip-version check (require-virtualenv + disable-pip-version-check)"
default     = false

[configure-pip.args.scope]
type        = "choice"
options     = ["user", "venv"]
default     = "user"
short       = "-s"
description = "Where to write pip.conf: user (~/.config/pip/pip.conf) or venv (<venv>/pip.conf)"

[configure-pip.args.venv]
type        = "path"
ui          = "directory"
description = "Venv path for --scope venv (the file is written to <venv>/pip.conf)"
required    = false

[configure-pip.args.run-as]
type        = "str"
short       = "-u"
description = "User who owns the target file (escalates via sudo/su); empty = the SSH login user"
required    = false

[configure-pip.args.become-method]
type        = "choice"
options     = ["sudo", "su"]
default     = "sudo"
description = "How to escalate to run-as: sudo (passwordless, -n) or su"

# ── Web / TLS probes (runspec-webops-core; cross-platform, read-only) ──────────

[cert-check]
serve       = ["local"]
description = "Inspect a host's TLS certificate — days-to-expiry, issuer, SANs, fingerprint, trust"
autonomy    = "autonomous"
output      = "json"

[cert-check.args.host]
type        = "str"
position    = 1
description = "Hostname to connect to"

[cert-check.args.port]
type        = "int"
short       = "-p"
description = "TLS port"
default     = 443

[cert-check.args.warn-days]
type        = "int"
short       = "-w"
description = "Report 'expiring' when fewer than N days remain"
default     = 30

[cert-check.args.timeout]
type        = "int"
short       = "-t"
description = "Connection timeout in seconds"
default     = 10

[cert-check.args.proxy]
type        = "str"
short       = "-x"
description = "Proxy override (host:port or http://host:port); 'direct' forces a direct connection. Default: auto-detect from proxy env vars and, on Windows, the system settings (WPAD/PAC), like the browsers"
required    = false

[cert-check.args.ca-bundle]
type        = "str"
description = "Path to a CA bundle (PEM) to verify TLS against — for a private/internal CA or a TLS-intercepting proxy. Ignored with --insecure"
required    = false

[cert-chain]
serve       = ["local"]
description = "Show the full TLS certificate chain (leaf -> intermediates -> root)"
autonomy    = "autonomous"
