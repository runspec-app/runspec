[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runspec-linux"
version = "0.20.0"
requires-python = ">=3.10"
description = "Linux system admin runnables for runspec"
readme = "README.md"
keywords = ["runspec", "runnable", "linux", "sysadmin", "ops", "ssh", "venv"]
dependencies = [
    "runspec>=0.50.1",
    "runspec-linux-core>=0.13.0",
    "runspec-webops-core>=0.3.0",
    "runspec-fs-core>=0.5.0",
]

[project.urls]
Documentation = "https://runspec.app/"
Source        = "https://github.com/jasonfinestone/runspec/tree/main/packages/python/runspec-linux"
Changelog     = "https://github.com/jasonfinestone/runspec/blob/main/packages/python/runspec-linux/CHANGELOG.md"
Issues        = "https://github.com/jasonfinestone/runspec/issues"

[project.scripts]
system-info       = "runspec_linux.system_info:main_system_info"
disk-usage        = "runspec_linux.system_info:main_disk_usage"
block-devices     = "runspec_linux.system_info:main_block_devices"
check-memory      = "runspec_linux.system_info:main_check_memory"
list-processes    = "runspec_linux.system_info:main_list_processes"
check-service     = "runspec_linux.services:main_check_service"
list-services     = "runspec_linux.services:main_list_services"
restart-service   = "runspec_linux.services:main_restart_service"
tail-log          = "runspec_linux.logs:main_tail_log"
search-log        = "runspec_linux.logs:main_search_log"
journalctl        = "runspec_linux.logs:main_journalctl"
ping-host         = "runspec_linux.network:main_ping_host"
check-port        = "runspec_linux.network:main_check_port"
show-connections  = "runspec_linux.network:main_show_connections"
trace-route       = "runspec_linux.network:main_trace_route"
route-table       = "runspec_linux.network:main_route_table"
socket-stats      = "runspec_linux.network:main_socket_stats"
dns-config        = "runspec_linux.network:main_dns_config"
network-interfaces = "runspec_linux.network:main_network_interfaces"
get-sysctl        = "runspec_linux.perf:main_get_sysctl"
cpu-info          = "runspec_linux.perf:main_cpu_info"
pressure          = "runspec_linux.perf:main_pressure"
service-detail    = "runspec_linux.investigate:main_service_detail"
open-ports        = "runspec_linux.investigate:main_open_ports"
owning-package    = "runspec_linux.investigate:main_owning_package"
failed-units      = "runspec_linux.investigate:main_failed_units"
find-large-files  = "runspec_linux.files:main_find_large_files"
backup-files      = "runspec_linux.files:main_backup_files"
last-logins       = "runspec_linux.security:main_last_logins"
who               = "runspec_linux.security:main_who"
list-containers   = "runspec_linux.containers:main_list_containers"
container-logs    = "runspec_linux.containers:main_container_logs"
restart-container = "runspec_linux.containers:main_restart_container"
list-packages     = "runspec_linux.packages:main_list_packages"
list-autoremovable  = "runspec_linux.packages:main_list_autoremovable"
nc-command        = "runspec_linux.nc_command:main"
which             = "runspec_linux.commands:main_which"
# Cron / crontab management (backed by runspec-linux-core)
cron              = "runspec_linux.cron:main"
# Filesystem (folded from runspec-fs; backed by runspec-fs-core)
filesystem        = "runspec_linux.fs.cli:main"
# Web / TLS probes (runspec-webops-core; cross-platform)
cert-check        = "runspec_linux.webops:main_cert_check"
cert-chain        = "runspec_linux.webops:main_cert_chain"
tls-info          = "runspec_linux.webops:main_tls_info"
http-check        = "runspec_linux.webops:main_http_check"
http-headers      = "runspec_linux.webops:main_http_headers"
redirect-trace    = "runspec_linux.webops:main_redirect_trace"
dns-lookup        = "runspec_linux.webops:main_dns_lookup"
api-spec          = "runspec_linux.webops:main_api_spec"

[project.optional-dependencies]
dev = [
    "ruff==0.15.20",
    "mypy",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
