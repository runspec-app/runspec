[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runspec-linux"
version = "0.5.0"
requires-python = ">=3.10"
description = "Linux system admin runnables for runspec"
dependencies = [
    "runspec>=0.27.0",
    "runspec-linux-core>=0.3.2",
    "runspec-webops-core>=0.1.0",
]

[project.scripts]
system-info       = "runspec_linux.system_info:main_system_info"
disk-usage        = "runspec_linux.system_info:main_disk_usage"
check-memory      = "runspec_linux.system_info:main_check_memory"
list-processes    = "runspec_linux.system_info:main_list_processes"
check-service     = "runspec_linux.services:main_check_service"
list-services     = "runspec_linux.services:main_list_services"
restart-service   = "runspec_linux.services:main_restart_service"
tail-log          = "runspec_linux.logs:main_tail_log"
search-log        = "runspec_linux.logs:main_search_log"
journalctl        = "runspec_linux.logs:main_journalctl"
ping-host         = "runspec_linux.network:main_ping_host"
check-port        = "runspec_linux.network:main_check_port"
show-connections  = "runspec_linux.network:main_show_connections"
find-large-files  = "runspec_linux.files:main_find_large_files"
backup-files      = "runspec_linux.files:main_backup_files"
last-logins       = "runspec_linux.security:main_last_logins"
who               = "runspec_linux.security:main_who"
list-containers   = "runspec_linux.containers:main_list_containers"
container-logs    = "runspec_linux.containers:main_container_logs"
restart-container = "runspec_linux.containers:main_restart_container"
list-packages     = "runspec_linux.packages:main_list_packages"
list-upgrades     = "runspec_linux.packages:main_list_upgrades"
upgrade-packages  = "runspec_linux.packages:main_upgrade_packages"
install-package   = "runspec_linux.packages:main_install_package"
remove-package    = "runspec_linux.packages:main_remove_package"
reboot-host       = "runspec_linux.power:main_reboot_host"
enable-passwordless-sudo = "runspec_linux.sudoers:main_enable_passwordless_sudo"
create-venv       = "runspec_linux.venvs:main_create_venv"
install-into-venv = "runspec_linux.venvs:main_install_into_venv"
configure-pip     = "runspec_linux.venvs:main_configure_pip"
nc-command        = "runspec_linux.nc_command:main"
# Web / TLS probes (runspec-webops-core; cross-platform)
cert-check        = "runspec_linux.webops:main_cert_check"
cert-chain        = "runspec_linux.webops:main_cert_chain"
tls-info          = "runspec_linux.webops:main_tls_info"
http-check        = "runspec_linux.webops:main_http_check"
http-headers      = "runspec_linux.webops:main_http_headers"
redirect-trace    = "runspec_linux.webops:main_redirect_trace"
dns-lookup        = "runspec_linux.webops:main_dns_lookup"
api-spec          = "runspec_linux.webops:main_api_spec"

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
