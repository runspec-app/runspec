[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "runspec-room"
version = "0.35.0"
description = "The runspec console chat-room server — a dumb message pipe with presence: console SSH-tunnel door + email-verify browser web door"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "runspec" }]
keywords = ["runspec", "chat", "room", "console", "ssh"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Chat",
]

# The browser door is a Starlette app (WebSocket + static frontend) run by
# uvicorn, with the email-verify sign-up flow gating it (signed sessions via
# itsdangerous). The console NDJSON door alone (`--ndjson-only`) needs none of
# these — they're imported lazily — but a normal install ships the full web server.
dependencies = [
    "starlette>=0.37",
    "uvicorn[standard]>=0.27",
    "itsdangerous>=2.1",
    # The TOML config loader uses stdlib tomllib on 3.11+; 3.10 needs tomli.
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# httpx is needed by Starlette's TestClient (the web-app tests); ruff + mypy back
# the CI quality jobs, matching the other packages' dev extras.
dev = ["pytest>=7", "httpx>=0.27", "ruff==0.15.20", "mypy"]

[project.scripts]
console-room = "console_room.server:main"

[tool.hatch.build.targets.wheel]
packages = ["console_room"]
# Ship the vanilla static frontend (non-Python assets) inside the wheel.
artifacts = ["console_room/web/frontend/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"

# Third-party web deps aren't always on mypy's path in CI and aren't part of this
# package's typed surface.
[[tool.mypy.overrides]]
module = ["starlette.*", "uvicorn", "uvicorn.*", "itsdangerous.*", "tomli"]
ignore_missing_imports = true
