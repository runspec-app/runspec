[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "runspec-room"
version = "0.5.1"
description = "The runspec console chat-room server — a dumb message pipe with presence: console SSH-tunnel door + OIDC-authenticated browser web door"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "runspec" }]
keywords = ["runspec", "chat", "room", "console", "ssh"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Chat",
]

# The browser door is a Starlette app (WebSocket + static frontend) run by
# uvicorn, with OIDC login via authlib (signed sessions via itsdangerous). The
# console NDJSON door alone (`--ndjson-only`) needs none of these — they're
# imported lazily — but a normal install ships the full, authenticated web server.
dependencies = [
    "starlette>=0.37",
    "uvicorn[standard]>=0.27",
    "authlib>=1.3",
    "itsdangerous>=2.1",
]

[project.optional-dependencies]
# httpx is needed by Starlette's TestClient (the web-app tests); ruff + mypy back
# the CI quality jobs, matching the other packages' dev extras.
dev = ["pytest>=7", "httpx>=0.27", "ruff", "mypy"]

[project.scripts]
console-room = "console_room.server:main"

[tool.hatch.build.targets.wheel]
packages = ["console_room"]
# Ship the vanilla static frontend (non-Python assets) inside the wheel.
artifacts = ["console_room/web/frontend/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"

# Third-party web deps aren't always on mypy's path in CI and aren't part of this
# package's typed surface.
[[tool.mypy.overrides]]
module = ["starlette.*", "uvicorn", "uvicorn.*", "authlib.*"]
ignore_missing_imports = true
