<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>runspec room</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <!-- Join gate. One room = one helpdesk = one queue, so there's no queue to
         pick — the visitor declares who they are and which team they're in. In a
         verified server (email-verify sign-up) the name + team come from the
         session and the fields are locked; in dev mode the browser declares both
         (?user= / ?team= on the link, or typed here). A ?room= deep-link still
         opens a legacy group-chat room. -->
    <form id="join" class="join">
      <h1>runspec room</h1>
      <label id="user-label">Your name <input id="user" autocomplete="off" placeholder="alice" /></label>
      <label id="team-label">Your team <input id="team" autocomplete="off" placeholder="sales" /></label>
      <label id="room-label" hidden>Room <input id="room" autocomplete="off" placeholder="ops" /></label>
      <p id="mode-hint" class="hint">Start a help desk request — an operator picks it up.</p>
      <button type="submit">Join the help desk</button>
      <p id="join-hint" class="hint">Dev mode — you're declaring your own name and team.</p>
    </form>

    <main id="app" hidden>
      <header>
        <span id="title"></span>
        <ul id="presence" class="presence-inline"></ul>
        <span class="spacer"></span>
        <span id="status" class="status"></span>
      </header>
      <!-- Self-service catalogue (helpdesk mode): a card grid across the top.
           Items come from /catalog?queue= (the on-shift consoles' published
           runnables); picking one opens a request form (modal) from its
           inputSchema. Hidden in group-chat mode. -->
      <section id="catalog-panel" class="catalog" hidden>
        <h2>Catalogue</h2>
        <input
          id="catalog-search"
          class="catalog-search"
          type="search"
          placeholder="Search the catalogue…"
          autocomplete="off"
          hidden
        />
        <ul id="catalog" class="catalog-grid"></ul>
      </section>
      <form id="reqform" hidden></form>
      <!-- The request thread: the visitor's messages, requests + their live
           status, and the operator's replies. -->
      <ul id="transcript" class="transcript"></ul>
      <form id="composer" class="composer">
        <input id="text" autocomplete="off" placeholder="Message…" />
        <button type="submit">Send</button>
      </form>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
