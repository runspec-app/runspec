<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>runspec room</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <!-- Join gate. In dev mode the browser declares its name; when the server has
         OIDC enabled the name comes from the session (and the field is locked).
         Fill a Room for group chat, or a Help desk queue for a private support
         thread — the queue wins if both are set. -->
    <form id="join" class="join">
      <h1>runspec room</h1>
      <label id="user-label">Your name <input id="user" autocomplete="off" placeholder="alice" /></label>
      <label id="queue-label">Help desk queue <input id="queue" autocomplete="off" placeholder="it-support" /></label>
      <label id="room-label" hidden>Room <input id="room" autocomplete="off" placeholder="ops" /></label>
      <p id="mode-hint" class="hint" hidden>Enter your help desk queue to start a request.</p>
      <button type="submit">Join</button>
      <p id="join-hint" class="hint">Dev login — single sign-on is used when configured.</p>
    </form>

    <main id="app" hidden>
      <header>
        <span id="title"></span>
        <ul id="presence" class="presence-inline"></ul>
        <span class="spacer"></span>
        <span id="status" class="status"></span>
        <a id="logout" class="logout" href="/logout" hidden>Sign out</a>
      </header>
      <!-- Self-service catalogue (helpdesk mode): a card grid across the top.
           Items come from /catalog?queue= (the on-shift consoles' published
           runnables); picking one opens a request form (modal) from its
           inputSchema. Hidden in group-chat mode. -->
      <section id="catalog-panel" class="catalog" hidden>
        <h2>Catalogue</h2>
        <ul id="catalog" class="catalog-grid"></ul>
      </section>
      <form id="reqform" hidden></form>
      <!-- The request thread: the visitor's messages, requests + their live
           status, and the operator's replies. -->
      <ul id="transcript" class="transcript"></ul>
      <form id="composer" class="composer">
        <input id="text" autocomplete="off" placeholder="Message…" />
        <button type="submit">Send</button>
      </form>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
