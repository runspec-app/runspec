version: 2
updates:
  - package-ecosystem: pip
    directory: /packages/python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /packages/node
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 is the native (Go) compiler. ts-jest (latest 29.4.15)
      # declares peer typescript ">=4.3 <7", so npm ci fails with ERESOLVE.
      # Drop this once a ts-jest release supports TypeScript 7.
      - dependency-name: typescript
        versions: [">=7"]
    groups:
      node-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
