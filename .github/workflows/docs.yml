name: Deploy docs

on:
  push:
    branches: [main]
  # Also build (strict, no deploy) on PRs that touch the docs, so a link
  # leaking an excluded/internal page is caught before merge — not at
  # deploy time after it has already landed on main.
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - "scripts/build_claude_marketplace.py"
      - "packages/python/runspec-mcp/runspec_mcp/plugin/**"
      - "packages/python/runspec-mcp/runspec_mcp/claudeplugin.py"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install mkdocs-material
      # --strict fails the build if a published page links to an excluded
      # (internal) or missing page — a guard against leaking design docs into
      # the public site via a stray link.
      - run: mkdocs build --strict
      # The runspec-mcp Claude Code marketplaces (runspec.app/marketplace.json +
      # marketplace-pip.json) and the plugin zip they point at — generated
      # together so the published checksum always matches the published zip.
      - run: python scripts/build_claude_marketplace.py --out site
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push'
        with:
          path: site/

  deploy:
    needs: build
    # PRs build for validation only; deploy to Pages happens on main pushes.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
