name: Webops Core Release

on:
  push:
    tags:
      - "webops-core-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. webops-core-v0.1.0)"
        required: true

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python/runspec-webops-core

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^webops-core-v[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.+-]*$ ]]; then
            echo "::error::Release tag '$RELEASE_TAG' is not well-formed — expected webops-core-v<x.y.z> (e.g. webops-core-v0.1.0). If you started this run manually, correct the 'tag' input: a hyphen before v, and no spaces."
            exit 1
          fi

      - name: Verify tag is on main
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          git merge-base --is-ancestor ${{ github.sha }} origin/main \
            || { echo "::error::Tag must point to a commit on main — merge your PR first, then push the tag."; exit 1; }

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install build
          python -m build --wheel

      - name: Wheel contents check
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          # The split's contract: importable helpers, but no runspec dependency,
          # no runspec.toml, and no console scripts — so it surfaces no runnables.
          /tmp/smoke/bin/python -c "
          import importlib.metadata as m
          from runspec_webops_core import connect_peer, probe, resolve
          reqs = m.requires('runspec-webops-core') or []
          assert not any(r.split()[0].lower().startswith('runspec') for r in reqs), f'core must not depend on runspec: {reqs}'
          eps = m.entry_points()
          scripts = [e.name for e in eps.select(group='console_scripts') if e.value.startswith('runspec_webops_core')]
          assert not scripts, f'core must not ship console scripts: {scripts}'
          print('Wheel contents OK — importable, zero runnables')
          "

      - name: Build sdist
        run: python -m build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: packages/python/runspec-webops-core/dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/runspec-webops-core

    permissions:
      id-token: write   # required for OIDC trusted publishing

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Idempotent re-run: if PyPI already has these files (e.g. a prior run
          # published but the github-release job failed), skip rather than error,
          # so the release can be completed by re-running the workflow.
          skip-existing: true

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Extract changelog notes
        run: |
          VERSION="${{ inputs.tag || github.ref_name }}"
          VERSION="${VERSION#webops-core-v}"
          ESCAPED="${VERSION//./\\.}"
          awk "/^## \\[${ESCAPED}\\]/{found=1; next} found && /^## \\[/{exit} found{print}" \
            packages/python/runspec-webops-core/CHANGELOG.md > release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes-file release-notes.md
          fi
