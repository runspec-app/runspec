        working-directory: packages/python/runspec-console
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install "ruff==0.15.20"

      - name: Lint
        if: matrix.check == 'lint'
        run: ruff check .

      - name: Format check
        if: matrix.check == 'format'
        run: ruff format --check .

  console-test:
    name: runspec-console test
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python/runspec-console
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # runspec-console declares pywin32 as an unconditional dependency, so
      # `pip install -e .` fails on Linux. Install only what the tests import
      # (anthropic for the adapter, paramiko for the SSH executor) and run
      # against the source tree via PYTHONPATH. The core `runspec` is installed
      # from the sibling path (skillargs parses/validates skill args via it).
      # pywebview is included so test_window_kwargs can validate the create_window
      # / start kwargs against the *real* pywebview signatures (it imports headless,
      # no GUI backend needed) — the guard for private_mode-on-the-wrong-call.
      - name: Install test deps
        run: |
          pip install -e ../runspec
          pip install pytest anthropic paramiko cryptography tomli-w dulwich pywebview

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest

  console-ui:
    name: console-ui (frontend)
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/console-ui
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v7
