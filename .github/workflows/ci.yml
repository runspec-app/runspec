  ci:
    name: CI
    needs: [python-quality, python-test, node, linux-quality, linux-test, linux-core-quality, linux-core-test, jsm-quality, jsm-test, snow-quality, snow-test, logops-quality, logops-test, logops-core-quality, logops-core-test, playbook-quality, playbook-test, claude-quality, claude-test, windows-quality, windows-unit, windows-smoke, o365-quality, o365-test, console-quality, console-test, console-ui, console-smoke, console-app-smoke, webops, webops-core-quality, webops-core-test, fs-core-quality, fs-core-test, fs-quality, fs-test, gitlab-core-quality, gitlab-core-test, gitlab-quality, gitlab-test, jira-core-quality, jira-core-test, jira-quality, jira-test, confluence-core-quality, confluence-core-test, confluence-quality, confluence-test, docs-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify dependent jobs
        run: |
          # Fail only on real failures or cancellations. A 'skipped' result is
          # expected and OK — it means change-detection didn't see relevant
          # files for that language pack.
          fail=0
          check() {
            local name="$1" result="$2"
            echo "$name: $result"
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              fail=1
            fi
          }
          check "python-quality" "${{ needs.python-quality.result }}"
          check "python-test"    "${{ needs.python-test.result }}"
          check "node"           "${{ needs.node.result }}"
          check "linux-quality"  "${{ needs.linux-quality.result }}"
          check "linux-test"     "${{ needs.linux-test.result }}"
          check "linux-core-quality" "${{ needs.linux-core-quality.result }}"
          check "linux-core-test"    "${{ needs.linux-core-test.result }}"
          check "jsm-quality"    "${{ needs.jsm-quality.result }}"
          check "jsm-test"       "${{ needs.jsm-test.result }}"
          check "snow-quality"   "${{ needs.snow-quality.result }}"
          check "snow-test"      "${{ needs.snow-test.result }}"
          check "logops-quality" "${{ needs.logops-quality.result }}"
          check "logops-test"    "${{ needs.logops-test.result }}"
          check "logops-core-quality" "${{ needs.logops-core-quality.result }}"
          check "logops-core-test"    "${{ needs.logops-core-test.result }}"
          check "playbook-quality"  "${{ needs.playbook-quality.result }}"
