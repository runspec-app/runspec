          pip install -e ../runspec-fs-core
          pip install -e ".[dev,graph]"

      # Pure parsers + mocked Graph + the off-Windows platform-guard behaviour.
      - name: Run tests
        run: pytest

  windows-smoke:
    name: runspec-windows smoke (windows-latest)
    needs: changes
    # windows-latest runners bill at 2× — run this only on pushes to main, not on
    # every PR push. The ubuntu windows-quality/windows-unit jobs still cover lint/
    # format/parsers on PRs; this catches Windows-only wheel/runtime breakage before
    # release. (See concurrency note up top for the other saver.)
    if: needs.changes.outputs.windows == 'true' && github.event_name == 'push'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/python/runspec-windows
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      # Install the wheel into a clean venv and actually run a few Windows-only
      # runnables, asserting each emits parseable JSON.
      - name: Wheel smoke test
        shell: pwsh
        run: |
          python -m venv $env:TEMP\smoke
          # Install the unpublished core dependencies first, then the wheel under test.
          & "$env:TEMP\smoke\Scripts\pip" install ..\runspec-webops-core ..\runspec-fs-core
          & "$env:TEMP\smoke\Scripts\pip" install (Get-ChildItem dist\*.whl)[0].FullName
          $bin = "$env:TEMP\smoke\Scripts"
          foreach ($cmd in @("system-info", "list-processes", "disk-usage")) {
            $out = & "$bin\$cmd"
            $out | ConvertFrom-Json | Out-Null
            Write-Host "$cmd -> OK"
          }
          # The cross-platform web runnables run on Windows too.
          & "$bin\cert-check" --help | Out-Null
          Write-Host "cert-check -> OK"
          # The folded `fs` runnable (backed by runspec-fs-core).
          & "$bin\fs" list-directory --path . | ConvertFrom-Json | Out-Null
          Write-Host "fs -> OK"
          & "$env:TEMP\smoke\Scripts\python" -c "from importlib.resources import files; assert (files('runspec_windows') / 'runspec.toml').is_file(), 'runspec.toml missing from wheel'; import runspec_windows; print('Wheel contents OK')"

  # ── runspec-console ──────────────────────────────────────────────────────────

  # runspec-console is not type-checked here: it carries pre-existing mypy debt
  # (Windows-only attrs, http handler typing) that's out of scope for this gate.
  # Lint + format + tests give it real coverage without that landmine.
  console-quality:
    name: "console quality / ${{ matrix.check }}"
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
