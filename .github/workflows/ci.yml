        run: |
          pip install -e ../runspec-webops-core
          pip install -e ../runspec-fs-core
          pip install -e ".[dev,graph]"

      # Pure parsers + mocked Graph + the off-Windows platform-guard behaviour.
      - name: Run tests
        run: pytest

  windows-smoke:
    name: runspec-windows smoke (windows-latest)
    needs: changes
    # windows-latest runners bill at 2× — run this only on pushes to main, not on
    # every PR push. The ubuntu windows-quality/windows-unit jobs still cover lint/
    # format/parsers on PRs; this catches Windows-only wheel/runtime breakage before
    # release. (See concurrency note up top for the other saver.)
    if: needs.changes.outputs.windows == 'true' && github.event_name == 'push'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/python/runspec-windows
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          cache: pip
          cache-dependency-path: packages/python/runspec-windows/pyproject.toml
          python-version: "3.12"

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      # Install the wheel into a clean venv and actually run a few Windows-only
      # runnables, asserting each emits parseable JSON.
      - name: Wheel smoke test
        shell: pwsh
        run: |
          python -m venv $env:TEMP\smoke
          # Install the unpublished core dependencies first, then the wheel under test.
          & "$env:TEMP\smoke\Scripts\pip" install ..\runspec-webops-core ..\runspec-fs-core
          & "$env:TEMP\smoke\Scripts\pip" install (Get-ChildItem dist\*.whl)[0].FullName
          $bin = "$env:TEMP\smoke\Scripts"
          foreach ($cmd in @("system-info", "list-processes", "disk-usage")) {
            $out = & "$bin\$cmd"
            $out | ConvertFrom-Json | Out-Null
            Write-Host "$cmd -> OK"
          }
          # The cross-platform web runnables run on Windows too.
          & "$bin\cert-check" --help | Out-Null
          Write-Host "cert-check -> OK"
          # The folded `filesystem` runnable (backed by runspec-fs-core).
          & "$bin\filesystem" list-directory --path . | ConvertFrom-Json | Out-Null
          Write-Host "filesystem -> OK"
          & "$env:TEMP\smoke\Scripts\python" -c "from importlib.resources import files; assert (files('runspec_windows') / 'runspec.toml').is_file(), 'runspec.toml missing from wheel'; import runspec_windows; print('Wheel contents OK')"

  # ── runspec-console ──────────────────────────────────────────────────────────

  # runspec-console is not type-checked here: it carries pre-existing mypy debt
  # (Windows-only attrs, http handler typing) that's out of scope for this gate.
  # Lint + format + tests give it real coverage without that landmine.
  console-quality:
    name: "console quality / ${{ matrix.check }}"
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, format]
    defaults:
      run:
        working-directory: packages/python/runspec-console
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install "ruff==0.15.20"

      - name: Lint
        if: matrix.check == 'lint'
        run: ruff check .

      - name: Format check
        if: matrix.check == 'format'
        run: ruff format --check .

  console-test:
    name: runspec-console test
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python/runspec-console
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          cache: pip
          cache-dependency-path: packages/python/runspec-console/pyproject.toml
          python-version: "3.12"

      # runspec-console declares pywin32 as an unconditional dependency, so
      # `pip install -e .` fails on Linux. Install only what the tests import
      # (anthropic for the adapter, paramiko for the SSH executor) and run
      # against the source tree via PYTHONPATH. The core `runspec` is installed
      # from the sibling path (skillargs parses/validates skill args via it).
      # pywebview is included so test_window_kwargs can validate the create_window
      # / start kwargs against the *real* pywebview signatures (it imports headless,
      # no GUI backend needed) — the guard for private_mode-on-the-wrong-call.
      #
      # The otel / mcp / schedule extras are installed too: their tests skip
      # when the package is missing, so without them ~25 tests never ran here.
      # (The sandbox tests stay skipped: they need a ~20 MB WASM download.)
      - name: Install test deps
        run: |
          pip install -e ../runspec
          pip install pytest anthropic paramiko cryptography tomli-w dulwich pywebview "opentelemetry-sdk>=1.27" "opentelemetry-exporter-otlp-proto-http>=1.27" "mcp>=2,<3" "apscheduler>=3.10"

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest

  # The console test suite otherwise only ever runs on Linux, so Windows-specific
  # test assumptions drift silently (they surfaced ~two dozen failures on a first
  # manual Windows run: Path.home() reads USERPROFILE not HOME, the NUL device's
  # isatty() is True, git-bash puts sh/awk on PATH so POSIX-only tests must skip
  # on win32, native path separators). This job runs the same suite on Windows —
  # under **git-bash** on purpose, the environment that surfaced those issues (so
  # the sh/awk-present skip-guards are actually exercised) — so it can't regress
  # unnoticed. Mirrors console-test's install (source tree + PYTHONPATH, no
  # `pip install -e .` — see that job) plus pywin32 + keyring so the Windows code
  # paths (Outlook availability, credential keychain) run for real. See
  # docs/design/console-pre-publish-testing.md.
  console-test-windows:
    name: runspec-console test (windows)
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/python/runspec-console
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          cache: pip
          cache-dependency-path: packages/python/runspec-console/pyproject.toml
          python-version: "3.12"

      # Install into a real venv, not the base setup-python: on Windows a base
      # install puts python.exe in the install root but console scripts in a
      # separate Scripts\ dir, whereas a venv co-locates them (as every real
      # console install does) — the local-venv discovery + marketplace probe
      # rely on runspec.exe sitting next to python.exe. pywin32 + keyring so the
      # Windows-only code paths (Outlook availability, credential keychain) run.
      - name: Install test deps
        shell: bash
        run: |
          python -m venv .venv-ci
          .venv-ci/Scripts/python -m pip install -e ../runspec
          .venv-ci/Scripts/python -m pip install pytest anthropic paramiko cryptography tomli-w dulwich pywebview pywin32 keyring

      - name: Run tests
        shell: bash
        env:
          PYTHONPATH: .
        run: .venv-ci/Scripts/python -m pytest

  # vitest is the slowest step in CI (~190s on one runner), so the suite is
  # split across three runners with `vitest run --shard`. Every test file still
  # runs, once; the type check runs on the first shard only.
  console-ui:
    name: "console-ui (frontend) / shard ${{ matrix.shard }}"
    needs: changes
    if: needs.changes.outputs.console-ui == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: packages/console-ui
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/console-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        if: matrix.shard == 1
        run: npm run typecheck

      - name: Test
        run: npm test -- --shard=${{ matrix.shard }}/3

  # The Linux jobs above mock all Windows COM/WinRT, so the trigger event sources'
  # lazy win32com / winsdk import paths are never exercised there. This job runs
  # the platform-independent trigger tests on Windows (so their win32 branches
  # run) and asserts the OS-specific imports actually resolve.
  console-smoke:
    name: runspec-console smoke (windows-latest)
    needs: changes
    # windows-latest runners bill at 2× — run only on pushes to main, not every PR
    # push. The ubuntu console-test/console-ui jobs cover the logic on PRs; this
    # asserts the Windows-only COM/WinRT import paths resolve before release.
    if: needs.changes.outputs.console == 'true' && github.event_name == 'push'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/python/runspec-console
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          cache: pip
          cache-dependency-path: packages/python/runspec-console/pyproject.toml
          python-version: "3.12"

      - name: Install test + Windows deps
        # The core `runspec` is a runtime dep of runspec_console (bridge_reporting
        # imports `runspec.logs` at module load), so install it from the sibling
        # path first — mirroring console-test / console-test-windows. Without it the
        # trigger tests fail collection with ModuleNotFoundError: No module named
        # 'runspec'.
        run: |
          pip install -e ../runspec
          pip install pytest anthropic paramiko cryptography tomli-w pywin32 "winrt-runtime>=2.0" "winrt-Windows.Foundation>=2.0" "winrt-Windows.Foundation.Collections>=2.0" "winrt-Windows.UI.Notifications>=2.0" "winrt-Windows.UI.Notifications.Management>=2.0" "winrt-Windows.ApplicationModel>=2.0"

      - name: Run trigger tests (Windows branches)
        env:
          PYTHONPATH: .
        run: pytest tests/test_events.py tests/test_triggers.py tests/test_outlook.py tests/test_notifications.py tests/test_trigger_config.py tests/test_trigger_runner.py

      - name: Smoke — Windows-only source imports resolve
        shell: pwsh
        env:
          PYTHONPATH: .
        run: |
          python -c "import pythoncom, win32com.client; from winrt.windows.ui.notifications.management import UserNotificationListener; print('lazy COM / WinRT imports OK')"
          python -c "from runspec_console.sources.outlook import OutlookSource, save_reply_draft; ok, reason = OutlookSource().available(); assert ok, reason; print('outlook source available OK')"
          python -c "from runspec_console.sources.notifications import NotificationSource; r = NotificationSource().available(); assert isinstance(r, tuple) and len(r) == 2, r; print('notifications source available ->', r)"

  # Launch-path smoke for the packaged desktop app. The console-quality/-test/-ui
  # jobs never exercise the real GTK / gdk-pixbuf paths where two Linux-only
  # startup bugs shipped: a gdk-pixbuf-incompatible window icon (a PNG-compressed
  # .ico that aborts GTK window creation) and localStorage disabled by
  # pywebview's private_mode default (null window.localStorage → blank screen).
  # This builds the bundled frontend and decodes the generated window icon through
  # the *actual* gdk-pixbuf loader GTK uses — a faithful reproduction that stays
  # deterministic (no display server / WebKit, so no flake). The localStorage
  # regression is covered by a unit test (console-test) and the index.html guard
  # test (console-ui); this job owns the icon-loader half.
  console-app-smoke:
    name: runspec-console app smoke (ubuntu)
    needs: changes
    if: needs.changes.outputs.console == 'true' || needs.changes.outputs.console-ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The GTK icon loader lives in the distro's gdk-pixbuf; python3-gi exposes
      # it to the system Python. We deliberately use that system Python (not
      # setup-python, which can't see apt-installed typelibs).
      - name: Install the GTK icon loader (gdk-pixbuf introspection)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gdkpixbuf-2.0

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/console-ui/package-lock.json

      - name: Build the bundled frontend (emits into the wheel's dist/)
        working-directory: packages/console-ui
        run: |
          npm ci
          npm run build

      - name: Assert the bundle landed where the wheel ships it
        run: test -f packages/python/runspec-console/runspec_console/dist/index.html

      # --system-site-packages so the venv can import apt's python3-gi. Deps
      # mirror the console-test job so the import chain resolves identically.
      - name: Install console + test deps
        run: |
          python3 -m venv --system-site-packages /tmp/appsmoke
          /tmp/appsmoke/bin/pip install --upgrade pip
          /tmp/appsmoke/bin/pip install -e packages/python/runspec
          /tmp/appsmoke/bin/pip install pytest anthropic paramiko cryptography tomli-w dulwich

      - name: Window icon decodes through the real gdk-pixbuf loader
        working-directory: packages/python/runspec-console
        env:
          PYTHONPATH: .
        run: |
          /tmp/appsmoke/bin/python -c "import gi; gi.require_version('GdkPixbuf','2.0'); from gi.repository import GdkPixbuf; print('gdk-pixbuf import OK')"
          /tmp/appsmoke/bin/pytest tests/test_icon_gtk_loadable.py -v

