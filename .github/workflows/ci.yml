    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the changelog-updated check can diff this branch
          # against its base (merge-base of the PR base ref and HEAD).
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install check deps
        run: pip install jsonschema

      - name: Check docs are in sync with the source of truth
        env:
          # The PR's base commit (empty on push events, where the check falls
          # back to origin/main); makes the branch diff exact.
          DOCS_CHECK_BASE: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_docs.py

  ci:
    name: CI
    needs: [python-quality, python-test, node, linux-quality, linux-test, linux-core-quality, linux-core-test, linux-root-quality, linux-root-test, jsm-quality, jsm-test, snow-quality, snow-test, logops-quality, logops-test, logops-core-quality, logops-core-test, playbook-quality, playbook-test, claude-quality, claude-test, scheduler-quality, scheduler-test, mcp-quality, mcp-test, console-room-quality, console-room-test, windows-quality, windows-unit, windows-smoke, o365-quality, o365-test, console-quality, console-test, console-test-windows, console-ui, console-smoke, console-app-smoke, webops, webops-core-quality, webops-core-test, fs-core-quality, fs-core-test, fs-quality, fs-test, gitlab-core-quality, gitlab-core-test, gitlab-quality, gitlab-test, rundeck-core-quality, rundeck-core-test, rundeck-quality, rundeck-test, jira-core-quality, jira-core-test, jira-quality, jira-test, confluence-core-quality, confluence-core-test, confluence-quality, confluence-test, docs-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify dependent jobs
        run: |
          # Fail only on real failures or cancellations. A 'skipped' result is
          # expected and OK — it means change-detection didn't see relevant
          # files for that language pack.
          fail=0
          check() {
            local name="$1" result="$2"
            echo "$name: $result"
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              fail=1
            fi
          }
          check "python-quality" "${{ needs.python-quality.result }}"
          check "python-test"    "${{ needs.python-test.result }}"
          check "node"           "${{ needs.node.result }}"
          check "linux-quality"  "${{ needs.linux-quality.result }}"
          check "linux-test"     "${{ needs.linux-test.result }}"
