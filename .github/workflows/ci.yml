    defaults:
      run:
        working-directory: packages/python/runspec-playbook
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        # runspec may not be on PyPI at the required version yet — install the
        # in-repo core from the sibling source so the dependency resolves. The
        # tests stub Ansible, but `.[dev]` still pulls ansible-core/ansible-runner
        # so we prove the dependency set installs.
        run: |
          pip install ../runspec
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Wheel smoke test
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install ../runspec
          /tmp/smoke/bin/pip install dist/*.whl
          # --help resolves the bundled runspec.toml without invoking Ansible.
          /tmp/smoke/bin/run-playbook --help
          /tmp/smoke/bin/python -c "
          from importlib.resources import files
          pkg = files('runspec_playbook')
          assert (pkg / 'runspec.toml').is_file(), 'runspec.toml missing from wheel'
          assert (pkg / 'playbooks' / 'deploy.yml').is_file(), 'bundled playbook missing from wheel'
          from runspec_playbook import compose_package_spec, run_ansible
