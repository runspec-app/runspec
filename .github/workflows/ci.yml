name: CI

# Single CI workflow per PR so a single required check (`CI / CI`) covers both
# language packs. Internal change-detection skips irrelevant jobs while still
# reporting success on the umbrella, so a Python-only PR isn't blocked waiting
# for a Node check that never runs (and vice versa).

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege token, declared explicitly. The detect-changes job needs
# `pull-requests: read` so dorny/paths-filter can list a PR's changed files via
# the GitHub API; every other job only reads the repo. This must be explicit on a
# private repo — the default GITHUB_TOKEN there can't call the PR files API, which
# surfaces as "Resource not accessible by integration" and skips the package jobs.
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      node: ${{ steps.filter.outputs.node }}
      chat: ${{ steps.filter.outputs.chat }}
      linux: ${{ steps.filter.outputs.linux }}
      linux-core: ${{ steps.filter.outputs.linux-core }}
      windows: ${{ steps.filter.outputs.windows }}
      jsm: ${{ steps.filter.outputs.jsm }}
      snow: ${{ steps.filter.outputs.snow }}
      console: ${{ steps.filter.outputs.console }}
      console-room: ${{ steps.filter.outputs.console-room }}
      webops: ${{ steps.filter.outputs.webops }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'packages/python/runspec/**'
              - 'tests/integration/**'
              - '.github/workflows/ci.yml'
            node:
              - 'packages/node/**'
              - '.github/workflows/ci.yml'
            chat:
              - 'packages/python/runspec-chat/**'
              - '.github/workflows/ci.yml'
            linux:
              - 'packages/python/runspec-linux/**'
              - 'packages/python/runspec-linux-core/**'
              - '.github/workflows/ci.yml'
            linux-core:
              - 'packages/python/runspec-linux-core/**'
              - '.github/workflows/ci.yml'
            windows:
              - 'packages/python/runspec-windows/**'
              - '.github/workflows/ci.yml'
            jsm:
              - 'packages/python/runspec-jsm/**'
              - '.github/workflows/ci.yml'
            snow:
              - 'packages/python/runspec-snow/**'
              - '.github/workflows/ci.yml'
            console:
              - 'packages/python/runspec-console/**'
              - 'packages/console-ui/**'
              - '.github/workflows/ci.yml'
            console-room:
              - 'packages/console-room/**'
              - '.github/workflows/ci.yml'
            webops:
              - 'packages/node-webops/**'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'schema/runspec.schema.json'
              - 'spec/SPEC.md'
              - 'CHANGELOG.md'
              - 'scripts/check_docs.py'
              - 'packages/python/runspec/pyproject.toml'
              - 'packages/node/package.json'
              - '.github/workflows/ci.yml'

  # ── Python ──────────────────────────────────────────────────────────────────

  python-quality:
    name: "Python quality / ${{ matrix.check }}"
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, format, typecheck]
    defaults:
      run:
        working-directory: packages/python/runspec
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        if: matrix.check == 'lint'
        run: ruff check .

      - name: Format check
        if: matrix.check == 'format'
        run: ruff format --check .

      - name: Type check
        if: matrix.check == 'typecheck'
        run: mypy runspec/

  python-test:
    name: "Python test / ${{ matrix.python-version }}"
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: packages/python/runspec
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Build wheel
        if: matrix.python-version == '3.12'
        run: |
          pip install build
          python -m build --wheel

      - name: Wheel smoke test
        if: matrix.python-version == '3.12'
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/runspec --help
          /tmp/smoke/bin/python -c "
          from importlib.resources import files
          pkg = files('runspec')
          assert (pkg / 'runspec.toml').is_file(), 'runspec.toml missing from wheel'
          assert (pkg / 'py.typed').is_file(), 'py.typed missing from wheel'
          print('Wheel contents OK')
          "

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        if: matrix.python-version == '3.12'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ── Node ────────────────────────────────────────────────────────────────────

  node:
    name: Node ${{ matrix.node }}
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
          cache-dependency-path: packages/node/package-lock.json

      - name: Install dependencies
        working-directory: packages/node
        run: npm ci

      - name: Type check
        working-directory: packages/node
        run: npm run typecheck

      - name: Build
        working-directory: packages/node
        run: npm run build

      - name: Test
        working-directory: packages/node
        run: npm test

  # ── runspec-chat ─────────────────────────────────────────────────────────────

  chat-quality:
    name: "chat quality / ${{ matrix.check }}"
    needs: changes
    if: needs.changes.outputs.chat == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, format, typecheck]
    defaults:
      run:
        working-directory: packages/python/runspec-chat
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        if: matrix.check == 'lint'
        run: ruff check .

      - name: Format check
        if: matrix.check == 'format'
        run: ruff format --check .

      - name: Type check
        if: matrix.check == 'typecheck'
        run: mypy runspec_chat/

  chat-test:
    name: runspec-chat test
    needs: changes
    if: needs.changes.outputs.chat == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python/runspec-chat
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Wheel smoke test
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/runspec-chat --help
          /tmp/smoke/bin/python -c "
          from importlib.resources import files
          pkg = files('runspec_chat')
          assert (pkg / 'chainlit_config' / 'config.toml').is_file(), 'chainlit_config/config.toml missing from wheel'
          assert (pkg / 'chainlit.md').is_file(), 'chainlit.md missing from wheel'
          print('Wheel contents OK')
          "

  # ── runspec-linux ─────────────────────────────────────────────────────────

  linux-quality:
    name: "linux quality / ${{ matrix.check }}"
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, format]
    defaults:
      run:
        working-directory: packages/python/runspec-linux
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        # runspec-linux-core is not published yet — install it from the sibling
        # source so the runspec-linux dependency resolves locally.
        run: |
          pip install -e ../runspec-linux-core
          pip install -e ".[dev]"

      - name: Lint
        if: matrix.check == 'lint'
        run: ruff check .

      - name: Format check
        if: matrix.check == 'format'
        run: ruff format --check .

  linux-test:
    name: runspec-linux test
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python/runspec-linux
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        # runspec-linux-core is not published yet — install it from the sibling
        # source so the runspec-linux dependency resolves locally.
        run: |
          pip install -e ../runspec-linux-core
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Wheel smoke test
        run: |
          python -m venv /tmp/smoke
          # Install the unpublished core dependency first, then the wheel under test.
          /tmp/smoke/bin/pip install ../runspec-linux-core
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/system-info
          /tmp/smoke/bin/python -c "
          from importlib.resources import files
          pkg = files('runspec_linux')
          assert (pkg / 'runspec.toml').is_file(), 'runspec.toml missing from wheel'
          from runspec_linux import nc_send
          print('Wheel contents OK')
          "

  # ── runspec-linux-core ──────────────────────────────────────────────────────

  linux-core-quality:
    name: "linux-core quality / ${{ matrix.check }}"
    needs: changes
    if: needs.changes.outputs.linux-core == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, format]
    defaults:
      run:
        working-directory: packages/python/runspec-linux-core
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        if: matrix.check == 'lint'
        run: ruff check .

      - name: Format check
        if: matrix.check == 'format'
        run: ruff format --check .

  linux-core-test:
    name: runspec-linux-core test
    needs: changes
    if: needs.changes.outputs.linux-core == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python/runspec-linux-core
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Wheel smoke test
        run: |
          python -m venv /tmp/smoke-core
          /tmp/smoke-core/bin/pip install dist/*.whl
          # The core package must NOT depend on runspec and must NOT ship a
          # runspec.toml or console scripts — that is the whole point of the split.
          /tmp/smoke-core/bin/python -c "
          import importlib.metadata as m
          from runspec_linux_core import nc_send, system_info
          reqs = m.requires('runspec-linux-core') or []
          assert not any(r.split()[0].lower().startswith('runspec') for r in reqs), f'core must not depend on runspec: {reqs}'
          eps = m.entry_points()
          scripts = [e.name for e in eps.select(group='console_scripts') if e.value.startswith('runspec_linux_core')]
          assert not scripts, f'core must not ship console scripts: {scripts}'
          print('core surface OK — importable, zero runnables')
          "

  # ── runspec-jsm ─────────────────────────────────────────────────────────────

  jsm-quality:
    name: "jsm quality / ${{ matrix.check }}"
    needs: changes
    if: needs.changes.outputs.jsm == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, format]
    defaults:
      run:
        working-directory: packages/python/runspec-jsm
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        if: matrix.check == 'lint'
        run: ruff check .

      - name: Format check
        if: matrix.check == 'format'
        run: ruff format --check .

  jsm-test:
    name: runspec-jsm test
    needs: changes
    if: needs.changes.outputs.jsm == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python/runspec-jsm
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Type check
        run: mypy runspec_jsm/

      - name: Run tests
        run: pytest

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Wheel smoke test
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "
          from importlib.resources import files
          pkg = files('runspec_jsm')
          assert (pkg / 'runspec.toml').is_file(), 'runspec.toml missing from wheel'
          from runspec_jsm import create_request, transition_issue, resolve_request_fields
          print('Wheel contents OK')
          "

  # ── runspec-snow ────────────────────────────────────────────────────────────

  snow-quality:
    name: "snow quality / ${{ matrix.check }}"
    needs: changes
    if: needs.changes.outputs.snow == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, format]
    defaults:
      run:
        working-directory: packages/python/runspec-snow
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        if: matrix.check == 'lint'
        run: ruff check .

      - name: Format check
        if: matrix.check == 'format'
        run: ruff format --check .

  snow-test:
    name: runspec-snow test
    needs: changes
    if: needs.changes.outputs.snow == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python/runspec-snow
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Type check
        run: mypy runspec_snow/

      - name: Run tests
        run: pytest

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Wheel smoke test
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "
          from importlib.resources import files
          pkg = files('runspec_snow')
          assert (pkg / 'runspec.toml').is_file(), 'runspec.toml missing from wheel'
          from runspec_snow import create_record, update_state, resolve_state_value
          print('Wheel contents OK')
          "

  # ── runspec-room (the chat-room server) ─────────────────────────────────────

  console-room-quality:
    name: "console-room quality / ${{ matrix.check }}"
    needs: changes
    if: needs.changes.outputs.console-room == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, format]
    defaults:
      run:
        working-directory: packages/console-room
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        if: matrix.check == 'lint'
        run: ruff check .

      - name: Format check
        if: matrix.check == 'format'
        run: ruff format --check .

  console-room-test:
    name: runspec-room test
    needs: changes
    if: needs.changes.outputs.console-room == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/console-room
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Type check
        run: mypy console_room

      - name: Run tests
        run: pytest

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Wheel smoke test
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "
          from importlib.resources import files
          pkg = files('console_room')
          assert (pkg / 'web' / 'frontend' / 'index.html').is_file(), 'frontend missing from wheel'
          from console_room import Hub, TranscriptStore
          print('Wheel contents OK')
          "

  # ── runspec-windows ─────────────────────────────────────────────────────────

  windows-quality:
    name: "windows quality / ${{ matrix.check }}"
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, format]
    defaults:
      run:
        working-directory: packages/python/runspec-windows
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev,graph]"

      - name: Lint
        if: matrix.check == 'lint'
        run: ruff check .

      - name: Format check
        if: matrix.check == 'format'
        run: ruff format --check .

  windows-unit:
    name: runspec-windows unit (parsers + graph)
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python/runspec-windows
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev,graph]"

      # Pure parsers + mocked Graph + the off-Windows platform-guard behaviour.
      - name: Run tests
        run: pytest

  windows-smoke:
    name: runspec-windows smoke (windows-latest)
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/python/runspec-windows
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      # Install the wheel into a clean venv and actually run a few Windows-only
      # runnables, asserting each emits parseable JSON.
      - name: Wheel smoke test
        shell: pwsh
        run: |
          python -m venv $env:TEMP\smoke
          & "$env:TEMP\smoke\Scripts\pip" install (Get-ChildItem dist\*.whl)[0].FullName
          $bin = "$env:TEMP\smoke\Scripts"
          foreach ($cmd in @("system-info", "list-processes", "disk-usage")) {
            $out = & "$bin\$cmd"
            $out | ConvertFrom-Json | Out-Null
            Write-Host "$cmd -> OK"
          }
          & "$env:TEMP\smoke\Scripts\python" -c "from importlib.resources import files; assert (files('runspec_windows') / 'runspec.toml').is_file(), 'runspec.toml missing from wheel'; import runspec_windows; assert runspec_windows.graph_get and runspec_windows.get_token; print('Wheel contents OK')"

  # ── runspec-console ──────────────────────────────────────────────────────────

  # runspec-console is not type-checked here: it carries pre-existing mypy debt
  # (Windows-only attrs, http handler typing) that's out of scope for this gate.
  # Lint + format + tests give it real coverage without that landmine.
  console-quality:
    name: "console quality / ${{ matrix.check }}"
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, format]
    defaults:
      run:
        working-directory: packages/python/runspec-console
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install ruff

      - name: Lint
        if: matrix.check == 'lint'
        run: ruff check .

      - name: Format check
        if: matrix.check == 'format'
        run: ruff format --check .

  console-test:
    name: runspec-console test
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python/runspec-console
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # runspec-console declares pywin32 as an unconditional dependency, so
      # `pip install -e .` fails on Linux. Install only what the tests import
      # (anthropic for the adapter, paramiko for the SSH executor) and run
      # against the source tree via PYTHONPATH.
      - name: Install test deps
        run: pip install pytest anthropic paramiko cryptography tomli-w dulwich

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest

  console-ui:
    name: console-ui (frontend)
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/console-ui
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/console-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

  # The Linux jobs above mock all Windows COM/WinRT, so the trigger event sources'
  # lazy win32com / winsdk import paths are never exercised there. This job runs
  # the platform-independent trigger tests on Windows (so their win32 branches
  # run) and asserts the OS-specific imports actually resolve.
  console-smoke:
    name: runspec-console smoke (windows-latest)
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/python/runspec-console
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test + Windows deps
        run: pip install pytest anthropic paramiko cryptography tomli-w pywin32 "winrt-runtime>=2.0" "winrt-Windows.Foundation>=2.0" "winrt-Windows.Foundation.Collections>=2.0" "winrt-Windows.UI.Notifications>=2.0" "winrt-Windows.UI.Notifications.Management>=2.0" "winrt-Windows.ApplicationModel>=2.0"

      - name: Run trigger tests (Windows branches)
        env:
          PYTHONPATH: .
        run: pytest tests/test_events.py tests/test_triggers.py tests/test_outlook.py tests/test_notifications.py tests/test_trigger_config.py tests/test_trigger_runner.py

      - name: Smoke — Windows-only source imports resolve
        shell: pwsh
        env:
          PYTHONPATH: .
        run: |
          python -c "import pythoncom, win32com.client; from winrt.windows.ui.notifications.management import UserNotificationListener; print('lazy COM / WinRT imports OK')"
          python -c "from runspec_console.sources.outlook import OutlookSource, save_reply_draft; ok, reason = OutlookSource().available(); assert ok, reason; print('outlook source available OK')"
          python -c "from runspec_console.sources.notifications import NotificationSource; r = NotificationSource().available(); assert isinstance(r, tuple) and len(r) == 2, r; print('notifications source available ->', r)"

  # ── runspec-webops (Node runnable package) ───────────────────────────────────

  webops:
    name: runspec-webops
    needs: changes
    if: needs.changes.outputs.webops == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/node-webops
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      # No committed lock (depends on the published runspec-node), so `npm install`.
      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # ── Aggregator ───────────────────────────────────────────────────────────────

  docs-check:
    name: docs drift check
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install check deps
        run: pip install jsonschema

      - name: Check docs are in sync with the source of truth
        run: python scripts/check_docs.py

  ci:
    name: CI
    needs: [python-quality, python-test, node, chat-quality, chat-test, linux-quality, linux-test, linux-core-quality, linux-core-test, jsm-quality, jsm-test, snow-quality, snow-test, windows-quality, windows-unit, windows-smoke, console-quality, console-test, console-ui, console-smoke, webops, docs-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify dependent jobs
        run: |
          # Fail only on real failures or cancellations. A 'skipped' result is
          # expected and OK — it means change-detection didn't see relevant
          # files for that language pack.
          fail=0
          check() {
            local name="$1" result="$2"
            echo "$name: $result"
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              fail=1
            fi
          }
          check "python-quality" "${{ needs.python-quality.result }}"
          check "python-test"    "${{ needs.python-test.result }}"
          check "node"           "${{ needs.node.result }}"
          check "chat-quality"   "${{ needs.chat-quality.result }}"
          check "chat-test"      "${{ needs.chat-test.result }}"
          check "linux-quality"  "${{ needs.linux-quality.result }}"
          check "linux-test"     "${{ needs.linux-test.result }}"
          check "linux-core-quality" "${{ needs.linux-core-quality.result }}"
          check "linux-core-test"    "${{ needs.linux-core-test.result }}"
          check "jsm-quality"    "${{ needs.jsm-quality.result }}"
          check "jsm-test"       "${{ needs.jsm-test.result }}"
          check "snow-quality"   "${{ needs.snow-quality.result }}"
          check "snow-test"      "${{ needs.snow-test.result }}"
          check "windows-quality" "${{ needs.windows-quality.result }}"
          check "windows-unit"    "${{ needs.windows-unit.result }}"
          check "windows-smoke"   "${{ needs.windows-smoke.result }}"
          check "console-quality" "${{ needs.console-quality.result }}"
          check "console-test"    "${{ needs.console-test.result }}"
          check "console-ui"      "${{ needs.console-ui.result }}"
          check "console-smoke"   "${{ needs.console-smoke.result }}"
          check "webops"          "${{ needs.webops.result }}"
          check "docs-check"      "${{ needs.docs-check.result }}"
          if [[ $fail -eq 1 ]]; then
            echo "One or more checks failed."
            exit 1
          fi
          echo "All checks passed (or were correctly skipped)."
