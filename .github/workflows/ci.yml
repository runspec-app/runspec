name: CI

# Single CI workflow per PR so a single required check (`CI / CI`) covers both
# language packs. Internal change-detection skips irrelevant jobs while still
# reporting success on the umbrella, so a Python-only PR isn't blocked waiting
# for a Node check that never runs (and vice versa).

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege token, declared explicitly. The detect-changes job needs
# `pull-requests: read` so dorny/paths-filter can list a PR's changed files via
# the GitHub API; every other job only reads the repo. This must be explicit on a
# private repo — the default GITHUB_TOKEN there can't call the PR files API, which
# surfaces as "Resource not accessible by integration" and skips the package jobs.
permissions:
  contents: read
  pull-requests: read

# Cancel superseded runs: a new push to a PR (or branch) aborts the previous
# run for the same ref instead of letting both finish. This is the biggest
# Actions-minute saver during iterative work — force-pushes/rebases no longer
# stack full matrix runs. Main is never cancelled (so a release run always
# completes), keyed by run id there to keep each push its own group.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# pip caching: the test jobs set `cache: pip` keyed on their package's
# pyproject.toml, so repeat runs reuse downloaded wheels. pip still resolves
# against the index every time, so a new release is picked up as before. Lint
# and format jobs install only ruff and aren't cached.

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      node: ${{ steps.filter.outputs.node }}
      linux: ${{ steps.filter.outputs.linux }}
      linux-core: ${{ steps.filter.outputs.linux-core }}
      linux-root: ${{ steps.filter.outputs.linux-root }}
      windows: ${{ steps.filter.outputs.windows }}
      o365: ${{ steps.filter.outputs.o365 }}
      jsm: ${{ steps.filter.outputs.jsm }}
      snow: ${{ steps.filter.outputs.snow }}
      logops: ${{ steps.filter.outputs.logops }}
      logops-core: ${{ steps.filter.outputs.logops-core }}
      playbook: ${{ steps.filter.outputs.playbook }}
      claude: ${{ steps.filter.outputs.claude }}
      scheduler: ${{ steps.filter.outputs.scheduler }}
      console: ${{ steps.filter.outputs.console }}
      console-ui: ${{ steps.filter.outputs.console-ui }}
      console-room: ${{ steps.filter.outputs.console-room }}
      webops: ${{ steps.filter.outputs.webops }}
      webops-core: ${{ steps.filter.outputs.webops-core }}
      fs: ${{ steps.filter.outputs.fs }}
      fs-core: ${{ steps.filter.outputs.fs-core }}
      gitlab: ${{ steps.filter.outputs.gitlab }}
      gitlab-core: ${{ steps.filter.outputs.gitlab-core }}
      rundeck: ${{ steps.filter.outputs.rundeck }}
      rundeck-core: ${{ steps.filter.outputs.rundeck-core }}
      jira: ${{ steps.filter.outputs.jira }}
      jira-core: ${{ steps.filter.outputs.jira-core }}
      confluence: ${{ steps.filter.outputs.confluence }}
      confluence-core: ${{ steps.filter.outputs.confluence-core }}
      mcp: ${{ steps.filter.outputs.mcp }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - 'packages/python/runspec/**'
              - 'tests/integration/**'
              - '.github/workflows/ci.yml'
            node:
              - 'packages/node/**'
              - '.github/workflows/ci.yml'
            linux:
              - 'packages/python/runspec-linux/**'
              - 'packages/python/runspec-linux-core/**'
              - 'packages/python/runspec-webops-core/**'
              - 'packages/python/runspec-fs-core/**'
              - '.github/workflows/ci.yml'
            linux-core:
              - 'packages/python/runspec-linux-core/**'
              - '.github/workflows/ci.yml'
            linux-root:
              - 'packages/python/runspec-linux-root/**'
              - 'packages/python/runspec-linux-core/**'
              - '.github/workflows/ci.yml'
            windows:
              - 'packages/python/runspec-windows/**'
              - 'packages/python/runspec-webops-core/**'
              - 'packages/python/runspec-fs-core/**'
              - '.github/workflows/ci.yml'
            o365:
              - 'packages/python/runspec-o365/**'
              - '.github/workflows/ci.yml'
            jsm:
              - 'packages/python/runspec-jsm/**'
              - '.github/workflows/ci.yml'
            snow:
              - 'packages/python/runspec-snow/**'
              - '.github/workflows/ci.yml'
            logops:
              - 'packages/python/runspec-logops/**'
              - 'packages/python/runspec-logops-core/**'
              - '.github/workflows/ci.yml'
            logops-core:
              - 'packages/python/runspec-logops-core/**'
              - '.github/workflows/ci.yml'
            playbook:
              - 'packages/python/runspec-playbook/**'
              - '.github/workflows/ci.yml'
            claude:
              - 'packages/python/runspec-claude/**'
              - '.github/workflows/ci.yml'
            scheduler:
              - 'packages/python/runspec-scheduler/**'
              - '.github/workflows/ci.yml'
            mcp:
              - 'packages/python/runspec-mcp/**'
              - '.github/workflows/ci.yml'
            # The Python console and its frontend are tested independently: no
            # vitest test reads the Python package and no pytest reads the
            # frontend, so a change to one doesn't need to re-run the other's
            # suite. console-app-smoke builds the frontend into the wheel and
            # runs on either.
            console:
              - 'packages/python/runspec-console/**'
              - '.github/workflows/ci.yml'
            console-ui:
              - 'packages/console-ui/**'
              - '.github/workflows/ci.yml'
            console-room:
              - 'packages/console-room/**'
              - '.github/workflows/ci.yml'
            webops:
              - 'packages/node-webops/**'
              - '.github/workflows/ci.yml'
            webops-core:
              - 'packages/python/runspec-webops-core/**'
              - '.github/workflows/ci.yml'
            fs:
              - 'packages/python/runspec-fs/**'
              - 'packages/python/runspec-fs-core/**'
              - '.github/workflows/ci.yml'
            fs-core:
              - 'packages/python/runspec-fs-core/**'
              - '.github/workflows/ci.yml'
            gitlab:
              - 'packages/python/runspec-gitlab/**'
              - 'packages/python/runspec-gitlab-core/**'
              - '.github/workflows/ci.yml'
            gitlab-core:
              - 'packages/python/runspec-gitlab-core/**'
              - '.github/workflows/ci.yml'
            rundeck:
              - 'packages/python/runspec-rundeck/**'
              - 'packages/python/runspec-rundeck-core/**'
              - '.github/workflows/ci.yml'
            rundeck-core:
              - 'packages/python/runspec-rundeck-core/**'
              - '.github/workflows/ci.yml'
            jira:
              - 'packages/python/runspec-jira/**'
              - 'packages/python/runspec-jira-core/**'
              - '.github/workflows/ci.yml'
            jira-core:
              - 'packages/python/runspec-jira-core/**'
              - '.github/workflows/ci.yml'
            confluence:
              - 'packages/python/runspec-confluence/**'
              - 'packages/python/runspec-confluence-core/**'
              - '.github/workflows/ci.yml'
            confluence-core:
              - 'packages/python/runspec-confluence-core/**'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'schema/runspec.schema.json'
              - 'spec/SPEC.md'
              - 'CHANGELOG.md'
              - 'scripts/check_docs.py'
              - 'packages/python/runspec/pyproject.toml'
              - 'packages/node/package.json'
              # Package source, so the changelog-updated check runs whenever a
              # package's shipping code changes (it verifies a matching CHANGELOG
              # update — see scripts/check_docs.py).
              - 'packages/**'
              - '.github/workflows/ci.yml'

  # ── Python ──────────────────────────────────────────────────────────────────

  python-quality:
    name: "Python quality / ${{ matrix.check }}"
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, format, typecheck]
    defaults:
      run:
        working-directory: packages/python/runspec
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        if: matrix.check == 'lint'
        run: ruff check .

      - name: Format check
        if: matrix.check == 'format'
        run: ruff format --check .

      - name: Type check
        if: matrix.check == 'typecheck'
        run: mypy runspec/

  python-test:
    name: "Python test / ${{ matrix.python-version }}"
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Full sweep on pushes to main; just the version ends on PRs to save
        # minutes — the in-between minors almost never diverge. fromJSON parses
        # each branch's string into the matrix list.
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.10", "3.13"]') || fromJSON('["3.10", "3.11", "3.12", "3.13"]') }}
    defaults:
      run:
        working-directory: packages/python/runspec
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          cache: pip
          cache-dependency-path: packages/python/runspec/pyproject.toml
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Build wheel
        if: matrix.python-version == '3.13'
        run: |
          pip install build
          python -m build --wheel

      - name: Wheel smoke test
        if: matrix.python-version == '3.13'
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/runspec --help
          /tmp/smoke/bin/python -c "
          from importlib.resources import files
          pkg = files('runspec')
          assert (pkg / 'runspec.toml').is_file(), 'runspec.toml missing from wheel'
          assert (pkg / 'py.typed').is_file(), 'py.typed missing from wheel'
          print('Wheel contents OK')
          "

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        if: matrix.python-version == '3.13'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # The shared-venv logs inbox with real accounts (docs/design/venv-logs-inbox.md):
  # tests/test_inbox.py's root-only tier demotes subprocesses to an owner and two
  # operators. Run as root, from a world-readable copy (the demoted accounts must
  # be able to import runspec), with the fs.protected_* sysctls OFF — the design
  # must not rely on them.
  python-multiuser:
    name: "Python multi-user inbox"
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Turn the kernel's link protections off
        run: sudo sysctl -w fs.protected_symlinks=0 fs.protected_hardlinks=0 fs.protected_regular=0 fs.protected_fifos=0

      - name: Inbox + secret-argv tests as root
        run: |
          # Installed (not copied) so runspec's dist metadata is there —
          # runspec/__init__ reads its own version from it.
          sudo "$(which python)" -m pip install --no-deps --target /opt/rs packages/python/runspec
          sudo cp -r packages/python/runspec/tests /opt/rs/
          sudo chmod -R a+rX /opt/rs
          cd /opt/rs
          sudo env PATH="$PATH" PYTHONPATH=/opt/rs RUNSPEC_MULTIUSER_REQUIRED=1 "$(which python)" -m pytest tests/test_inbox.py tests/test_secret_argv.py -o addopts="" -p no:cacheprovider -v -W error

  # ── Node ────────────────────────────────────────────────────────────────────

  node:
    name: Node ${{ matrix.node }}
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
          cache-dependency-path: packages/node/package-lock.json

      - name: Install dependencies
        working-directory: packages/node
        run: npm ci

      - name: Type check
        working-directory: packages/node
        run: npm run typecheck

      - name: Build
        working-directory: packages/node
        run: npm run build

      - name: Test
        working-directory: packages/node
        run: npm test

  # ── runspec-linux ─────────────────────────────────────────────────────────

  linux-quality:
    name: "linux quality / ${{ matrix.check }}"
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, format]
    defaults:
      run:
        working-directory: packages/python/runspec-linux
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Install the in-tree runspec core + the *-core siblings from source so
        # the runspec-linux deps resolve locally — runspec-linux floors on a
        # runspec version that may not be published to PyPI yet (the core fix and
        # the wrapper floor bump ship together).
        run: |
          pip install -e ../runspec
          pip install -e ../runspec-linux-core
          pip install -e ../runspec-webops-core
          pip install -e ../runspec-fs-core
          pip install -e ".[dev]"

      - name: Lint
        if: matrix.check == 'lint'
        run: ruff check .

      - name: Format check
        if: matrix.check == 'format'
        run: ruff format --check .

  linux-test:
    name: runspec-linux test
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python/runspec-linux
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          cache: pip
          cache-dependency-path: packages/python/runspec-linux/pyproject.toml
          python-version: "3.12"

      - name: Install dependencies
        # Install the in-tree runspec core + the *-core siblings from source so
        # the runspec-linux deps resolve locally — runspec-linux floors on a
        # runspec version that may not be published to PyPI yet (the core fix and
        # the wrapper floor bump ship together).
        run: |
          pip install -e ../runspec
          pip install -e ../runspec-linux-core
          pip install -e ../runspec-webops-core
          pip install -e ../runspec-fs-core
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Wheel smoke test
        run: |
          python -m venv /tmp/smoke
          # Install the unpublished core dependencies first (incl. the in-tree
          # runspec core, since the wrapper floors on a version that may not be
          # on PyPI yet), then the wheel under test.
          /tmp/smoke/bin/pip install ../runspec ../runspec-linux-core ../runspec-webops-core ../runspec-fs-core
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/system-info
          /tmp/smoke/bin/cert-check --help
          /tmp/smoke/bin/filesystem list-directory --path .
          /tmp/smoke/bin/python -c "
          from importlib.resources import files
          pkg = files('runspec_linux')
          assert (pkg / 'runspec.toml').is_file(), 'runspec.toml missing from wheel'
          from runspec_linux import nc_send
          print('Wheel contents OK')
          "

  # ── runspec-linux-root ──────────────────────────────────────────────────────

  linux-root-quality:
    name: "linux-root quality / ${{ matrix.check }}"
    needs: changes
    if: needs.changes.outputs.linux-root == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, format]
    defaults:
      run:
        working-directory: packages/python/runspec-linux-root
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        # In-tree runspec + runspec-linux-core: the wrapper floors on versions
        # that ship in the same change and may not be on PyPI yet.
        run: |
          pip install -e ../runspec
          pip install -e ../runspec-linux-core
          pip install -e ".[dev]"

      - name: Lint
        if: matrix.check == 'lint'
        run: ruff check .

      - name: Format check
        if: matrix.check == 'format'
        run: ruff format --check .

  linux-root-test:
    name: runspec-linux-root test
    needs: changes
    if: needs.changes.outputs.linux-root == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python/runspec-linux-root
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          cache: pip
          cache-dependency-path: packages/python/runspec-linux-root/pyproject.toml
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ../runspec
          pip install -e ../runspec-linux-core
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Wheel smoke test
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install ../runspec ../runspec-linux-core
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/reboot-host --help
          /tmp/smoke/bin/python -c "
          from importlib.resources import files
          pkg = files('runspec_linux_root')
          assert (pkg / 'runspec.toml').is_file(), 'runspec.toml missing from wheel'
          print('Wheel contents OK')
          "

  # ── runspec-linux-core ──────────────────────────────────────────────────────

  linux-core-quality:
    name: "linux-core quality / ${{ matrix.check }}"
    needs: changes
    if: needs.changes.outputs.linux-core == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, format]
    defaults:
      run:
        working-directory: packages/python/runspec-linux-core
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        if: matrix.check == 'lint'
        run: ruff check .

      - name: Format check
        if: matrix.check == 'format'
        run: ruff format --check .

  linux-core-test:
    name: runspec-linux-core test
    needs: changes
    if: needs.changes.outputs.linux-core == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python/runspec-linux-core
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          cache: pip
          cache-dependency-path: packages/python/runspec-linux-core/pyproject.toml
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Wheel smoke test
        run: |
          python -m venv /tmp/smoke-core
          /tmp/smoke-core/bin/pip install dist/*.whl
          # The core package must NOT depend on runspec and must NOT ship a
          # runspec.toml or console scripts — that is the whole point of the split.
          /tmp/smoke-core/bin/python -c "
          import importlib.metadata as m
          from runspec_linux_core import nc_send, system_info
          reqs = m.requires('runspec-linux-core') or []
          assert not any(r.split()[0].lower().startswith('runspec') for r in reqs), f'core must not depend on runspec: {reqs}'
          eps = m.entry_points()
          scripts = [e.name for e in eps.select(group='console_scripts') if e.value.startswith('runspec_linux_core')]
          assert not scripts, f'core must not ship console scripts: {scripts}'
          print('core surface OK — importable, zero runnables')
          "

  # ── runspec-jsm ─────────────────────────────────────────────────────────────

  jsm-quality:
    name: "jsm quality / ${{ matrix.check }}"
    needs: changes
    if: needs.changes.outputs.jsm == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, format]
    defaults:
      run:
        working-directory: packages/python/runspec-jsm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        if: matrix.check == 'lint'
        run: ruff check .

      - name: Format check
        if: matrix.check == 'format'
        run: ruff format --check .

  jsm-test:
    name: runspec-jsm test
    needs: changes
    if: needs.changes.outputs.jsm == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python/runspec-jsm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          cache: pip
          cache-dependency-path: packages/python/runspec-jsm/pyproject.toml
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Type check
        run: mypy runspec_jsm/

      - name: Run tests
        run: pytest

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Wheel smoke test
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "
          from importlib.resources import files
          pkg = files('runspec_jsm')
          assert (pkg / 'runspec.toml').is_file(), 'runspec.toml missing from wheel'
          from runspec_jsm import create_request, transition_issue, resolve_request_fields
          print('Wheel contents OK')
          "

  # ── runspec-snow ────────────────────────────────────────────────────────────

  snow-quality:
    name: "snow quality / ${{ matrix.check }}"
    needs: changes
    if: needs.changes.outputs.snow == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, format]
    defaults:
      run:
        working-directory: packages/python/runspec-snow
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        if: matrix.check == 'lint'
        run: ruff check .

      - name: Format check
        if: matrix.check == 'format'
        run: ruff format --check .

  snow-test:
    name: runspec-snow test
    needs: changes
    if: needs.changes.outputs.snow == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python/runspec-snow
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          cache: pip
          cache-dependency-path: packages/python/runspec-snow/pyproject.toml
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Type check
        run: mypy runspec_snow/

      - name: Run tests
        run: pytest

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Wheel smoke test
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "
          from importlib.resources import files
          pkg = files('runspec_snow')
