          check "mcp-quality"     "${{ needs.mcp-quality.result }}"
          check "mcp-test"        "${{ needs.mcp-test.result }}"
          check "console-room-quality" "${{ needs.console-room-quality.result }}"
          check "console-room-test"    "${{ needs.console-room-test.result }}"
          check "windows-quality" "${{ needs.windows-quality.result }}"
