name: Console Release

on:
  push:
    tags:
      - "console-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. console-v0.1.4)"
        required: true

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^console-v[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.+-]*$ ]]; then
            echo "::error::Release tag '$RELEASE_TAG' is not well-formed — expected console-v<x.y.z> (e.g. console-v0.39.0). If you started this run manually, correct the 'tag' input: a hyphen before v, and no spaces."
            exit 1
          fi

      - name: Verify tag is on main
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          git merge-base --is-ancestor ${{ github.sha }} origin/main \
            || { echo "::error::Tag must point to a commit on main — merge your PR first, then push the tag."; exit 1; }

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install UI dependencies
        working-directory: packages/console-ui
        run: npm ci

      - name: Build UI (Vite → runspec_console/dist/)
        working-directory: packages/console-ui
        run: npm run build

      # Wheel-only publish (intentional — no sdist). The wheel is pure
      # py3-none-any so it always applies. The Vite UI under
      # runspec_console/dist/ is gitignored and only force-included into the
      # wheel target (see pyproject [tool.hatch.build.targets.wheel.force-include]),
      # so a hatchling sdist would ship without the UI (dist/index.html missing
      # → runtime failure). Rather than smuggle a built artifact into a source
      # dist, we publish the wheel alone.
      - name: Build wheel
        working-directory: packages/python/runspec-console
        run: |
          pip install hatchling
          python -m hatchling build -t wheel

      - name: Wheel smoke test
        working-directory: packages/python/runspec-console
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl --no-deps
          /tmp/smoke/bin/python -c "
          from importlib.resources import files
          pkg = files('runspec_console')
          assert (pkg / 'dist' / 'index.html').is_file(), 'dist/index.html missing from wheel — run npm run build first'
          assert (pkg / 'runspec.toml').is_file(), 'runspec.toml missing from wheel'
          print('Wheel contents OK')
          "

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: packages/python/runspec-console/dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/runspec-console

    permissions:
      id-token: write   # required for OIDC trusted publishing

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Idempotent re-run: if PyPI already has these files (e.g. a prior run
          # published but the github-release job failed), skip rather than error,
          # so the release can be completed by re-running the workflow.
          skip-existing: true

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Extract changelog notes
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#console-v}"
          ESCAPED="${VERSION//./\\.}"
          awk "/^## \\[${ESCAPED}\\]/{found=1; next} found && /^## \\[/{exit} found{print}" \
            packages/python/runspec-console/CHANGELOG.md > release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes-file release-notes.md
          fi
